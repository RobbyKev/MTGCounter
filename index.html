<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=VT323&display=swap">
<style>
/* Layout: Spieltisch von oben – lange Seiten oben (180°) und unten, optional Kopfenden links (90°) und rechts (270°), Werkzeugleiste in der Mitte. Bewusst nur dunkles Thema. */
:root{
  --table:#101215; --ink:#e9e4d8; --muted:#9a968c; --brass:#c9a45c; --chip:#1c1f25; --line:#262a31; --danger:#e0543f;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,sans-serif;
  --f-title:"Cinzel",Georgia,serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--table)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{min-height:100%;background:var(--table);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body.ingame{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- Setup ---------- */
#setup{max-width:900px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.s-head h1{font-family:var(--f-title);font-size:clamp(28px,5vw,42px);letter-spacing:.04em;margin:0;color:var(--brass);text-wrap:balance}
.s-head p{margin:6px 0 0;color:var(--muted);max-width:62ch;line-height:1.5}

/* ---------- Start & Schritte ---------- */
.scr{display:grid;gap:18px}

.tiles{display:grid;gap:10px}

.more summary{cursor:pointer;color:var(--muted);font-weight:600;min-height:44px;display:flex;align-items:center}
.more{display:grid;gap:8px}
.tog.small{min-height:36px;font-size:14px}

button.map-seat{cursor:pointer;border:0}
:root[data-skin="light"] .setbox .ch{background:#fff} :root[data-skin="light"] .tile,:root[data-skin="light"] .bigbtn,:root[data-skin="light"] .back,:root[data-skin="light"] .setbox{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}

.panel.kbsel{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(0,0,0,.5)}

  background:radial-gradient(120% 100% at 50% 40%,#1f5a3a 0%,#123a25 70%,#0b2618 100%);box-shadow:inset 0 0 30px rgba(0,0,0,.55)}

.pbtn.l{left:3.5cqmin}.pbtn.r{right:3.5cqmin}.pbtn.c{left:50%;transform:translateX(-50%)}
.pbtn:active{background:rgba(0,0,0,.4)}
@container (max-width:470px){.pbtn span{display:none}.pbtn{padding:0 2.6cqmin}}

.deadov{position:absolute;inset:0;z-index:3;display:none;place-content:center;text-align:center;gap:1cqmin;pointer-events:none;background:rgba(0,0,0,.35)}
.panel.dead .deadov{display:grid}
.deadov b{font-family:var(--f-title);font-size:max(18px,8cqmin);letter-spacing:.06em}
.deadov small{font-size:max(12px,4cqmin);opacity:.85}

.rollov{position:absolute;inset:0;z-index:4;display:none;place-content:center;text-align:center;pointer-events:none;background:rgba(0,0,0,.45)}
.rollov.on{display:grid}
.rollov b{font-family:var(--f-num);font-size:min(40cqh,30cqw);line-height:.9}
.rollov small{font-size:max(12px,4cqmin);letter-spacing:.1em;text-transform:uppercase}
.rollov.top b{color:var(--brass)}

.assignov{position:absolute;inset:0;z-index:7;display:none;place-content:center;text-align:center;background:rgba(0,0,0,.4);font-weight:600;font-size:max(16px,6cqmin);border:3px dashed rgba(255,255,255,.6);border-radius:16px}
.assignov.on{display:grid}

.ov{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;background:var(--bg2);padding:3cqmin;gap:2cqmin}
.ov.on{display:flex}
.ov-h{display:flex;align-items:center;gap:2cqmin}
.ov-h>div{flex:1;min-width:0}
.ov-h h3{margin:0;font-family:var(--f-title);font-size:clamp(15px,5cqmin,23px);letter-spacing:.03em}
.ov-h p{margin:0;font-size:clamp(11px,3.2cqmin,17px);opacity:.75}
.x{width:max(44px,11cqmin);height:max(44px,11cqmin);border-radius:12px;background:rgba(0,0,0,.28);display:grid;place-items:center;flex:none}
.x svg{width:55%;height:55%}
.rows{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr;gap:1.6cqmin;align-content:start;touch-action:pan-y;-webkit-overflow-scrolling:touch}
@container (min-width:520px){.rows{grid-template-columns:1fr 1fr}.rows .wide{grid-column:1/-1}}
@container (min-width:900px) and (max-height:320px){.rows{grid-template-columns:repeat(3,1fr)}}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:1.6cqmin;padding:1.4cqmin 2cqmin;border-radius:12px;background:rgba(0,0,0,.2)}
.r .lab{display:flex;align-items:center;gap:1.6cqmin;min-width:0;font-weight:600;font-size:clamp(13px,3.8cqmin,20px)}
.r .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .lab small{display:block;font-weight:400;opacity:.75;font-size:clamp(11px,3cqmin,17px)}
.r .lab i,.dot{flex:none;width:max(12px,3.4cqmin);height:max(12px,3.4cqmin);border-radius:50%;background:var(--dot);box-shadow:0 0 0 1px rgba(255,255,255,.5);display:inline-block}
.sb{width:max(44px,11cqmin);height:max(44px,11cqmin);border-radius:10px;background:rgba(255,255,255,.12);font-family:var(--f-num);font-size:max(22px,7cqmin);font-weight:700;line-height:1;touch-action:manipulation}
.sb:active,.sb.press{background:rgba(255,255,255,.3)}
.r .v{min-width:max(40px,10cqmin);text-align:center;font-family:var(--f-num);font-weight:700;font-size:max(24px,8cqmin);font-variant-numeric:tabular-nums}
.r .v.hot{color:#ffb4a6}
.fxsec{display:grid;gap:1.6cqmin;padding:2cqmin;border-radius:12px;background:rgba(0,0,0,.2);align-content:start}
.fxsec h4{margin:0;font-size:max(11px,3.2cqmin);text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.tg{display:flex;flex-wrap:wrap;gap:1.4cqmin}
.tb{min-height:max(40px,10cqmin);padding:0 2.6cqmin;border-radius:10px;background:rgba(255,255,255,.12);font-weight:600;font-size:clamp(13px,3.8cqmin,20px);display:inline-flex;align-items:center;gap:1.4cqmin}
.tb[aria-pressed="true"]{background:var(--fg);color:var(--bg2)}
.tb.go2{background:var(--fg);color:var(--bg2);width:100%;justify-content:center}
.amt{display:flex;align-items:center;gap:2cqmin;flex-wrap:wrap}
.padv{font-family:var(--f-num);font-weight:700;font-size:max(36px,14cqmin);text-align:center;line-height:1;padding:1cqmin;border-radius:12px;background:rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.padg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqmin;flex:1;min-height:0}
.padg button{border-radius:12px;background:rgba(255,255,255,.12);font-family:var(--f-num);font-size:max(22px,7cqmin);font-weight:700;min-height:max(40px,9cqh)}
.padg button:active{background:rgba(255,255,255,.3)}
.padg .ok{background:var(--fg);color:var(--bg2)}
.addrow{display:flex;gap:1.6cqmin}
.addrow input{flex:1;min-width:0;height:max(44px,11cqmin);border-radius:10px;border:0;background:rgba(0,0,0,.3);color:var(--fg);padding:0 2.4cqmin;font-size:16px;font-family:var(--f-ui)}
.r .del{width:max(32px,8cqmin);height:max(32px,8cqmin);border-radius:8px;background:rgba(0,0,0,.25);display:grid;place-items:center}
.r .del svg{width:60%;height:60%}
.r.cust{grid-template-columns:minmax(0,1fr) auto auto auto auto}
@container (max-width:420px){
  .r,.r.cust{grid-template-columns:auto minmax(0,1fr) auto;row-gap:1cqmin}
  .r .lab{grid-column:1/-1}
  .r .lab span{white-space:normal}
  .r.cust .del{grid-column:1/-1;justify-self:end}
  .ov-h p{display:none}
}
.amt b{font-family:var(--f-num);font-size:max(30px,11cqmin);min-width:max(50px,14cqmin);text-align:center;font-variant-numeric:tabular-nums}

/* ---------- Leiste ---------- */
.barwrap{container-type:inline-size;min-width:0}
.bar{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;min-height:52px}
.bar::-webkit-scrollbar{display:none}
.bb{flex:none;height:48px;min-width:48px;padding:0 12px;border-radius:12px;background:#1a1d22;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.bb svg{width:20px;height:20px;flex:none}
.bb:active{background:#2a2e36}
.bb.on{background:var(--brass);color:#1a1408}
.bb.turnb{background:#22262d;font-family:var(--f-num);font-size:19px;letter-spacing:.02em;max-width:260px}
.bb.turnb span{overflow:hidden;text-overflow:ellipsis}
.sp{flex:1 0 6px}
.clock{flex:none;height:48px;border-radius:12px;font-family:var(--f-num);font-size:19px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 8px;display:inline-flex;align-items:center;gap:6px}
.clock.paused{color:var(--brass)}
.clock svg{width:16px;height:16px}
.banner{flex:1;display:flex;align-items:center;gap:10px;justify-content:center;font-weight:600;font-size:16px;color:var(--brass);white-space:nowrap}
.banner svg{width:20px;height:20px}
@container (max-width:980px){.bb .t{display:none}.bb{padding:0 10px}}
@container (max-width:560px){.bb.turnb{max-width:170px;font-size:17px}.clock{display:none}}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(0,0,0,.6);padding:16px}
#modal.on{display:grid}
.card{width:min(620px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#17191e;border:1px solid #2a2d34;border-radius:18px;padding:20px;display:grid;gap:16px;-webkit-overflow-scrolling:touch}
.card-h{display:flex;align-items:center;gap:12px}
.card-h h2{margin:0;flex:1;font-family:var(--f-title);font-size:22px;color:var(--brass);letter-spacing:.03em}
.card .x{width:44px;height:44px;background:#22252c}
.grp{display:grid;gap:8px}
.grp h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.dice{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.dice button{height:52px;border-radius:12px;background:#22252c;font-family:var(--f-num);font-size:21px;font-weight:600}
.dice button:active{background:#323641}
.dieout{min-height:96px;border-radius:14px;background:#0f1013;display:grid;place-content:center;text-align:center}
.dieout b{font-family:var(--f-num);font-size:60px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.dieout small{color:var(--muted);font-size:13px}
.volrow input{flex:1;max-width:260px;accent-color:var(--brass)}
.lookbar{display:flex;gap:8px}.lookbar input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#15171c;color:inherit;padding:0 14px;font-size:17px}
.lookbar .tb{font-size:16px;min-height:48px;padding:0 16px;gap:8px}.lookbar .tb svg{width:20px;height:20px}
.lookres h3 .msi{width:.9em;height:.9em}
.lookres{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:16px;align-items:start}
.lookres>img{width:100%;border-radius:4.5%/3.3%;box-shadow:0 6px 24px rgba(0,0,0,.5);display:block}
.lookres h3{margin:0 0 2px;font-family:var(--f-title);font-size:22px}.lookres .ty{opacity:.75;font-style:italic;margin-bottom:8px}
.lookres .tx{white-space:pre-wrap;background:rgba(255,255,255,.06);padding:12px;border-radius:10px;line-height:1.45}
.lookres .en{opacity:.65;font-size:.92em;margin-top:6px;white-space:pre-wrap}
.legal{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.legal span{font-size:12px;padding:3px 8px;border-radius:99px;background:#2b3a2e;color:#a9e7b5}.legal span.no{background:#3a2626;color:#f0a8a8}
.rulings{margin-top:12px;display:grid;gap:8px}.rulings div{font-size:14px;line-height:1.4;padding:8px 10px;border-left:3px solid var(--brass);background:rgba(255,255,255,.04);border-radius:0 8px 8px 0}.rulings time{display:block;font-size:11px;opacity:.6}
.rulein{width:100%;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#15171c;color:inherit;padding:0 12px;font-size:16px;margin:4px 0 8px}
.rlist{margin-top:8px}.rk{display:inline-flex;align-items:center;gap:6px}.rk .ci{font-size:1.1em}.rk .ci svg{width:1em;height:1em}
.rulebox{margin-top:10px;padding:12px 14px;border-radius:12px;background:rgba(201,164,92,.12);border:1px solid rgba(201,164,92,.35);line-height:1.45}
.rulebox h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:17px}.rulebox .ci{font-size:1.3em}
@media (max-width:620px){.lookres{grid-template-columns:1fr}.lookres>img{max-width:260px;margin:0 auto}}
.mbtn{min-height:52px;border-radius:12px;background:#22252c;padding:8px 16px;text-align:left;font-weight:600;font-size:16px;display:flex;align-items:center;gap:12px}
.mbtn svg{width:22px;height:22px;flex:none;color:var(--brass)}
.mbtn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.mbtn.warn{background:#3a1b16}
.mrow{display:flex;gap:8px;flex-wrap:wrap}
.mrow .mbtn{flex:1 1 200px}
.stepper{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper .sb{width:52px;height:52px;font-size:26px;background:#22252c}
.stepper b{font-family:var(--f-num);font-size:34px;min-width:50px;text-align:center}
.hist{display:grid;gap:0;font-size:14px}
.hist div{display:grid;grid-template-columns:48px 12px minmax(0,1fr);gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums}
.hist i{width:10px;height:10px;border-radius:50%;background:var(--dot)}
.tblwrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
table.t td.hot{color:#ffb4a6;font-weight:600}
table.t .dot{width:10px;height:10px;margin-right:6px;vertical-align:middle}
.winner{display:grid;gap:4px;padding:18px;border-radius:14px;background:radial-gradient(120% 140% at 50% 30%,var(--bg) 0%,var(--bg2) 100%);color:var(--fg);text-align:center}
.winner small{text-transform:uppercase;letter-spacing:.14em;font-size:12px;opacity:.85}
.winner b{font-family:var(--f-title);font-size:32px;letter-spacing:.04em}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{flex:1 1 120px;background:#0f1013;border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi b{font-family:var(--f-num);font-size:28px;font-variant-numeric:tabular-nums}
.chart{background:#0f1013;border-radius:12px;padding:10px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;background:var(--dot)}

.startp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;display:grid;gap:10px;justify-items:center;padding:18px;border-radius:22px;background:rgba(14,15,18,.92);border:1px solid #2f3239;box-shadow:0 20px 60px rgba(0,0,0,.6);width:min(440px,calc(100vw - 32px))}
.startp .big{width:100%;min-height:96px;border-radius:16px;background:var(--brass);color:#1a1408;font-weight:700;font-size:22px;display:grid;place-items:center;gap:4px;padding:10px;font-family:var(--f-title);letter-spacing:.03em;animation:pulse 2.2s ease-in-out infinite}
.startp .big .flip{transform:rotate(180deg);opacity:.75;font-size:.8em}
.startp .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.startp .row2 button{flex:1 1 120px;min-height:48px;border-radius:12px;background:#22252c;font-weight:600;font-size:15px;padding:0 10px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,164,92,.5)}50%{box-shadow:0 0 0 10px rgba(201,164,92,0)}}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;background:#000c;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;max-width:80vw}
#toast.on{opacity:1}
#toast.note{text-align:left;font-size:17px;line-height:1.35;padding:14px 22px;display:grid;gap:6px;border:1px solid rgba(201,164,92,.6);box-shadow:0 10px 40px rgba(0,0,0,.6)}
#toast.note b{color:#e8c46a}


/* ================= Design: Pergament & Foliant ================= */
:root[data-skin="parchment"]{--table:#2a1d12;--ink:#f1e4c6;--muted:#bfa77f;--brass:#c9973f;--chip:#3d2b1b;--line:#5a4128}
:root[data-skin="parchment"] body{background:radial-gradient(120% 90% at 50% 40%,#3a2818 0%,#22170d 100%)}
:root[data-skin="parchment"] #game{background:radial-gradient(120% 90% at 50% 45%,#3b2918 0%,#1e140b 100%)}
:root[data-skin="parchment"] .s-head h1{color:#e3c27a}
:root[data-skin="parchment"] .prow{background:#34251a} :root[data-skin="parchment"] .prow input[type=text],:root[data-skin="parchment"] .cmdin input,:root[data-skin="parchment"] .num-in,:root[data-skin="parchment"] .sel{background:#f1e4c6;color:#2b1d10;border-color:#8a6a3e}
:root[data-skin="parchment"] .map-box{background:#22170d;border-color:#5a4128}
:root[data-skin="parchment"] .panel{border-radius:6px;border:3px solid color-mix(in srgb,var(--pc) 65%,#3a2510);
  background:radial-gradient(ellipse at 50% 42%,#f5ead0 0%,#ead8af 58%,#d2b583 88%,#b8935c 100%);
  box-shadow:inset 0 0 5cqmin rgba(90,55,15,.45),0 3px 12px rgba(0,0,0,.5)}
:root[data-skin="parchment"] .inner::before{content:"";position:absolute;inset:2cqmin;border:1px solid rgba(60,38,12,.55);outline:1px solid rgba(60,38,12,.3);outline-offset:-.9cqmin;border-radius:3px;pointer-events:none;z-index:0}
:root[data-skin="parchment"] .inner.art{background:none}
:root[data-skin="parchment"] .inner.art::after{content:"";position:absolute;inset:9cqmin 7cqmin;background:var(--art) center 30%/cover;filter:sepia(.8) contrast(.95);opacity:.28;pointer-events:none;z-index:0;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 72%)}
:root[data-skin="parchment"] .panel.active{box-shadow:inset 0 0 5cqmin rgba(90,55,15,.45),0 0 0 3px #e3c27a,0 0 24px rgba(227,194,122,.45)}
:root[data-skin="parchment"] .num{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;color:#2b1d10;text-shadow:0 1px 0 rgba(255,255,255,.35);letter-spacing:-.02em}
:root[data-skin="parchment"] .name,:root[data-skin="parchment"] .ov-h h3{color:#2b1d10}
:root[data-skin="parchment"] .half span{color:#5a3e1f;opacity:.4} :root[data-skin="parchment"] .half.press{background:rgba(90,55,15,.08)}
:root[data-skin="parchment"] .pbtn,:root[data-skin="parchment"] .sb,:root[data-skin="parchment"] .tb,:root[data-skin="parchment"] .x,:root[data-skin="parchment"] .padg button{background:rgba(90,55,15,.13);color:#2b1d10}
:root[data-skin="parchment"] .badge,:root[data-skin="parchment"] .pchip,:root[data-skin="parchment"] .cmdr{background:rgba(90,55,15,.14);color:#2b1d10} :root[data-skin="parchment"] .badge.turn{background:#7a1f12;color:#f5ead0}
:root[data-skin="parchment"] .cmdr .cost{background:#2b1d10;color:#f5ead0}
:root[data-skin="parchment"] .r,:root[data-skin="parchment"] .fxsec,:root[data-skin="parchment"] .padv{background:rgba(90,55,15,.08)}
:root[data-skin="parchment"] .ov{background:#ead8af;color:#2b1d10} :root[data-skin="parchment"] .addrow input{background:#f7eedb;color:#2b1d10}
:root[data-skin="parchment"] .deadov{background:rgba(234,216,175,.6);color:#5a1a10} :root[data-skin="parchment"] .panel.dead{filter:grayscale(.7) sepia(.4) brightness(.85)}
:root[data-skin="parchment"] .rollov{background:rgba(234,216,175,.75);color:#2b1d10}
:root[data-skin="parchment"] .bb,:root[data-skin="parchment"] .bb.turnb{background:#3d2b1b;color:#f1e4c6;border:1px solid #5a4128} :root[data-skin="parchment"] .bb.on{background:#c9973f;color:#2b1d10}
:root[data-skin="parchment"] .card{--ink:#2b1d10;--muted:#6e5638;--line:#c9b083;--chip:#e3cfa3;background:#efe2c3;color:#2b1d10;border-color:#8a6a3e}
:root[data-skin="parchment"] .card .x,:root[data-skin="parchment"] .mbtn,:root[data-skin="parchment"] .dice button,:root[data-skin="parchment"] .stepper .sb{background:#e3cfa3;color:#2b1d10} :root[data-skin="parchment"] .mbtn svg{color:#7a1f12}
:root[data-skin="parchment"] .dieout,:root[data-skin="parchment"] .kpi,:root[data-skin="parchment"] .chart,:root[data-skin="parchment"] .arch-item{background:#e6d4ab} :root[data-skin="parchment"] .card-h h2{color:#7a1f12}
:root[data-skin="parchment"] .startp{background:rgba(42,29,18,.95);border-color:#5a4128} :root[data-skin="parchment"] .startp .row2 button{background:#3d2b1b}

/* ================= Design: Commander-Farben ================= */
:root[data-skin="identity"] .panel{background:var(--idg);background-size:240% 240%;animation:idshift 14s ease-in-out infinite alternate;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),inset 0 0 7cqmin rgba(255,255,255,.07)}
:root[data-skin="identity"] .panel.active{box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 0 0 3px var(--brass),0 0 30px var(--glow)}
:root[data-skin="identity"] .num{text-shadow:0 0 3cqmin var(--glow),0 2px 14px rgba(0,0,0,.45)}
:root[data-skin="identity"] .pips{display:inline-flex;gap:.8cqmin} :root[data-skin="identity"] .pips i{width:max(10px,3cqmin);height:max(10px,3cqmin);border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.6),0 0 1.5cqmin var(--c)}
@keyframes idshift{0%{background-position:0% 30%}100%{background-position:100% 70%}}

/* ================= Design: Terminal ================= */

function layout(n,table){
  if(table==='upright'){const cols=n<=3?n:(n===4?2:3);const rows=[];for(let i=0;i<n;i+=cols)rows.push([...Array(Math.min(cols,n-i)).keys()].map(x=>x+i));return{upright:true,rows,top:[],bottom:[],left:null,right:null}}
  const heads=n>=4&&table==='head2'?2:(n>=3&&table!=='long'?1:0);
  const m=n-heads,t=Math.floor(m/2),b=m-t;
  const top=[...Array(t).keys()];let k=t;
  const right=heads===2?k++:null;
  const bottom=[];for(let i=0;i<b;i++)bottom.push(k++);
  const left=heads>=1?k++:null;
  return{top,bottom:bottom.reverse(),left,right};
}

function runFx(pid,kind){const me=P(pid),f=fxState(pid),x=f.amt;const opp=alive().filter(i=>i!==pid);pushUndo();
  const hit=(id,d)=>{const q=P(id);q.life+=d;if(d<0)glitch(id);bumpDelta(id,d);addHist({pid:id,k:'life',sub:'fx',d,res:q.life})};
  let msg='';

    if(f.cmd&&isDmg()){const k=me.partner?f.ck:0;P(t).cmd[pid][k]+=x;addHist({pid:t,k:'cmd',sub:pid+'-'+k,from:pid,ck:k,d:x,res:P(t).cmd[pid][k]})}

/* ---------- 3D-Würfel (eigene kleine Canvas-Engine, läuft offline) ---------- */
const DICE=(()=>{
  const PHI=(1+Math.sqrt(5))/2,V=(x,y,z)=>[x,y,z];
  const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
    cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],len=a=>Math.hypot(a[0],a[1],a[2]),nrm=a=>mul(a,1/len(a));
  const pm=[1,-1];
  function cube(){const v=[];pm.forEach(x=>pm.forEach(y=>pm.forEach(z=>v.push(V(x,y,z)))));return v}
  function ico(){const v=[];pm.forEach(a=>pm.forEach(b=>{v.push(V(0,a,b*PHI));v.push(V(a,b*PHI,0));v.push(V(a*PHI,0,b))}));return v}
  function dodeca(){const v=cube();pm.forEach(a=>pm.forEach(b=>{v.push(V(0,a/PHI,b*PHI));v.push(V(a/PHI,b*PHI,0));v.push(V(a*PHI,0,b/PHI))}));return v}
  function facesFromNormals(verts,normals){return normals.map(n0=>{const n=nrm(n0);let m=-1e9;verts.forEach(v=>m=Math.max(m,dot(v,n)));
    const fv=verts.map((v,i)=>[v,i]).filter(([v])=>dot(v,n)>m-1e-6).map(([,i])=>i);
    const c=mul(fv.reduce((a,i)=>add(a,verts[i]),[0,0,0]),1/fv.length);const ref=nrm(sub(verts[fv[0]],c)),ref2=cross(n,ref);
    fv.sort((i,j)=>{const a=sub(verts[i],c),b=sub(verts[j],c);return Math.atan2(dot(a,ref2),dot(a,ref))-Math.atan2(dot(b,ref2),dot(b,ref))});return fv})}
  function build(verts,faces){const R=Math.max(...verts.map(len));verts=verts.map(v=>mul(v,1/R));
    const F=faces.map(f=>{const c=mul(f.reduce((a,i)=>add(a,verts[i]),[0,0,0]),1/f.length);let n=nrm(cross(sub(verts[f[1]],verts[f[0]]),sub(verts[f[2]],verts[f[0]])));if(dot(n,c)<0){n=mul(n,-1);f=f.slice().reverse()}
      const up=nrm(sub(sub(verts[f[0]],c),mul(n,dot(sub(verts[f[0]],c),n))));const inr=Math.min(...f.map((i,k)=>{const a=verts[i],b=verts[f[(k+1)%f.length]];const e=nrm(sub(b,a));const w=sub(c,a);return len(sub(w,mul(e,dot(w,e))))}));
      return{f,c,n,up,inr}});
    // Zahlen: Gegenüberliegende Seiten ergeben zusammen N+1
    const N=F.length,used=new Set();let k=1;F.forEach((fa,i)=>{if(used.has(i))return;let best=-1,bd=2;F.forEach((fb,j)=>{if(j!==i&&!used.has(j)){const d=dot(fa.n,fb.n);if(d<bd){bd=d;best=j}}});
      fa.num=k;used.add(i);if(best>=0&&bd<-.9&&N%2===0){F[best].num=N+1-k;used.add(best)}k++;while([...F].some(x=>x.num===k))k++});
    F.forEach((fa,i)=>{if(!fa.num){let m=1;while(F.some(x=>x.num===m))m++;fa.num=m}});
    return{verts,faces:F}}
  const defs={};
  {const v=[V(1,1,1),V(1,-1,-1),V(-1,1,-1),V(-1,-1,1)];defs[4]=build(v,facesFromNormals(v,v.map(x=>mul(x,-1))))}
  {const v=cube();defs[6]=build(v,facesFromNormals(v,[V(1,0,0),V(-1,0,0),V(0,1,0),V(0,-1,0),V(0,0,1),V(0,0,-1)]))}
  {const v=[V(1,0,0),V(-1,0,0),V(0,1,0),V(0,-1,0),V(0,0,1),V(0,0,-1)];defs[8]=build(v,facesFromNormals(v,cube()))}
  const swp=a=>a.map(v=>[v[2],v[1],v[0]]),okF=(F,k)=>F.every(f=>f.length===k);

function ruleIcon(k){if(k.startsWith('a:'))return manaOK&&useSym()?`<i class="ci ms ms-ability-${k.slice(2)}"></i>`:`<i class="ci">${I.book}</i>`;if(!CI_MS[k]&&!CI[k]&&!['cmd','hourglass','saga','tax1'].includes(k))return`<i class="ci">${I.book}</i>`;return k==='cmd'?`<i class="ci">${I.sword||''}</i>`:k==='hourglass'||k==='saga'?`<i class="ci">${I.hourglass}</i>`:ctrIcon(k)}
function ruleListHTML(){const q=(ui.ruleQ||'').trim().toLowerCase(),cat=ui.rcat||'spiel';
  const list=RULES.map((r,i)=>[r,i]).filter(([r])=>q?(r[1].toLowerCase().includes(q)||r[2].toLowerCase().includes(q)):r[3]===cat);
  const ru=ui.rule!=null?RULES[ui.rule]:null;
  return`<div class="chips-row rlist">${list.map(([r,i])=>`<button class="ch txt rk" data-act="rule" data-i="${i}" aria-pressed="${ui.rule===i}">${ruleIcon(r[0])}${r[1]}</button>`).join('')||'<span class="hint">Nichts gefunden.</span>'}</div>
    ${ru?`<div class="rulebox"><h4>${ruleIcon(ru[0])}${ru[1]}</h4>${manaInText(esc(ru[2]))}</div>`:''}`}
function lookResHTML(c){if(!c)return'';if(c.err)return`<p class="hint">${esc(c.err)}</p>`;
  const img=c.imgDe||c.img,nm=c.nameDe||c.name,ty=c.typeDe||c.type,tx=c.textDe||c.text;
  const leg=c.leg?`<div class="legal">${Object.entries(c.leg).map(([k,v])=>`<span class="${v==='legal'?'':'no'}">${k}: ${v==='legal'?'erlaubt':v==='banned'?'verboten':v==='restricted'?'beschränkt':'nicht erlaubt'}</span>`).join('')}</div>`:'';
  const rul=c.rulings?(c.rulings.length?`<h4 style="margin:14px 0 0">Offizielle Regel-Hinweise <small style="opacity:.6;font-weight:400">(englisch)</small></h4><div class="rulings">${c.rulings.map(r=>`<div><time>${esc(r.published_at)}</time>${esc(r.comment)}</div>`).join('')}</div>`:'<p class="hint">Keine besonderen Regel-Hinweise zu dieser Karte.</p>'):(c.rul?'<p class="hint">Regel-Hinweise werden geladen …</p>':'');
  return`<div class="lookres">${img?`<img src="${esc(img)}" alt="${esc(nm)}">`:'<div></div>'}<div><h3>${esc(nm)} ${c.cost?`<span class="mc">${manaHTML(c.cost)}</span>`:''}</h3>${c.nameDe&&c.nameDe!==c.name?`<div class="en" style="margin:0 0 4px">${esc(c.name)}</div>`:''}
    <div class="ty">${esc(ty)}</div>${tx?`<div class="tx">${manaInText(esc(tx))}</div>`:''}${c.textDe&&c.text?`<details class="en"><summary>Englischer Originaltext</summary>${manaInText(esc(c.text))}</details>`:''}
    ${c.pt?`<div style="font-family:var(--f-num);font-weight:700;font-size:24px;margin-top:6px">${esc(c.pt)}</div>`:''}${leg}${rul}</div></div>`}
async function lookup(q){q=(q||'').trim();if(!q)return;ui.look={err:'Suche „'+q+'“ …'};const box=document.getElementById('lookres');if(box)box.innerHTML=lookResHTML(ui.look);
  const c=await sfCard(q);if(!c){ui.look={err:'Keine Karte gefunden. Ohne Internet funktioniert die Suche nicht.'};const b=document.getElementById('lookres');if(b)b.innerHTML=lookResHTML(ui.look);return}
  ui.look=c;const r=S.setup.lookRecent||(S.setup.lookRecent=[]);const nm=c.nameDe||c.name;const i=r.indexOf(nm);if(i>=0)r.splice(i,1);r.unshift(nm);r.length=Math.min(r.length,8);save();
  if(ui.modal==='look')renderModal();

/* ---------- Effekte mit Rundenbezug ---------- */
const TMODES={down:'In deinem Zug −1',up:'In deinem Zug +1',round:'Jede Runde −1',eot:'Bis Ende des Zuges',next:'Bis zu deinem nächsten Zug'};
const TPRE=[['Aussetzen','down',4],['Saga','up',1,3],['Bis Zugende','eot'],['Bis zum nächsten Zug','next'],['Runden','round',3]];
function timerChips(p){return(p.timers||[]).map(t=>`<span class="pchip tmr${(t.m==='down'||t.m==='round')&&t.v<=1?' warn':''}" title="${esc(t.n)}"><span class="pc-t"><i class="ci">${I.hourglass}</i>${t.m==='eot'||t.m==='next'?'':`<b>${t.m==='up'?t.v+'/'+t.max:t.v}</b>`}</span><small>${esc(t.n)}</small></span>`).join('')}
function turnHooks(prev,nx,newRound){const msgs=[],rem=S.setup.remind!==false;
  S.players.forEach(p=>{if(!p.timers||!p.timers.length)return;const keep=[];
    p.timers.forEach(t=>{let done=false,why='';
      if(t.m==='eot'){done=true;why='endet (Zugende)'}
      else if(t.m==='next'&&p.id===nx){done=true;why='endet – '+esc(p.name)+' ist wieder dran'}
      else if(t.m==='down'&&p.id===nx){t.v--;if(t.v<=0){done=true;why=t.n==='Aussetzen'?'letzte Zeitmarke weg – jetzt kostenlos wirken!':'abgelaufen'}else msgs.push(`${I.hourglass?'':''}<b>${esc(p.name)}</b>: ${esc(t.n)} noch ${t.v}`)}
      else if(t.m==='up'&&p.id===nx){t.v++;if(t.v>=(t.max||3)){done=true;why='letztes Kapitel – danach opfern'}else msgs.push(`<b>${esc(p.name)}</b>: ${esc(t.n)} Kapitel ${t.v}`)}
      else if(t.m==='round'&&newRound){t.v--;if(t.v<=0){done=true;why='abgelaufen'}}
      if(done){msgs.push(`<b>${esc(p.name)}</b>: ${esc(t.n)} ${why}`);ev(p.name+': '+t.n+' '+why.replace(/<[^>]+>/g,''),p.id)}else keep.push(t)});
    p.timers=keep});
  if(rem){const P_=i=>P(i);
    if(prev!=null&&S.g.monarch===prev)msgs.push(`<b>Monarch</b>: ${esc(P_(prev).name)} zieht am Zugende 1 Karte`);
    if(S.g.initiative===nx)msgs.push(`<b>Initiative</b>: ${esc(P_(nx).name)} erkundet die Unterstadt weiter`);
    if(P_(nx).rad)msgs.push(`<b>Strahlung</b>: ${esc(P_(nx).name)} legt ${P_(nx).rad} Karten in den Friedhof`);
    if(S.g.dn&&prev!=null)msgs.push(S.g.dn===1?`<b>Tag</b>: Hat ${esc(P_(prev).name)} keinen Zauber gewirkt? Dann wird es Nacht.`:`<b>Nacht</b>: Hat ${esc(P_(prev).name)} 2+ Zauber gewirkt? Dann wird es Tag.`)}
  if(msgs.length){notice(msgs);if(msgs.some(m=>/abgelaufen|endet|kostenlos|opfern/.test(m)))setTimeout(()=>sfx('turn'),250)}}

function applyLive(){if(!(S.g&&S.players.length))return;const st=S.setup;Object.assign(S.cfg,{cmdLife:st.cmdLife,sound:st.sound,sfx:st.sfx,turns:st.turns,table:st.table,clock:st.clock,art:st.art});

function goScr(s){ui.scr=s;renderSetup();save();window.scrollTo(0,0)}
function fmtCmdSetup(st){return st.fmt==='custom'?!!st.customCmd:FORMATS[st.fmt].cmd}
function fmtDmgSetup(st){return st.fmt==='custom'?!!st.customCmd:FORMATS[st.fmt].dmg}
function readSetupInputs(){const st=S.setup;const cc=document.getElementById('customcmd');if(cc)st.customCmd=cc.checked;const mo=document.getElementById('matchopt');if(mo)st.match=mo.checked;for(let i=0;i<st.n;i++){const a=document.getElementById('pname'+i),b=document.getElementById('ppart'+i);if(a)st.players[i].name=a.value.trim()||('Spieler '+(i+1));if(b)st.players[i].partner=b.checked}
  const c=document.getElementById('cmdlife');if(c)st.cmdLife=c.checked;
  const so=document.getElementById('sound');if(so)st.sound=so.checked;
  const co=document.getElementById('clockopt');if(co)st.clock=co.checked;
  const sx=document.getElementById('sfxopt');if(sx)st.sfx=sx.checked;
  const tu=document.getElementById('turnsopt');if(tu)st.turns=tu.checked;
  const ao=document.getElementById('artopt');if(ao)st.art=ao.checked;
  const go=document.getElementById('glowopt');if(go)st.glow=go.checked;
  const ro=document.getElementById('remindopt');if(ro)st.remind=ro.checked;
  const mo2=document.getElementById('musicopt');if(mo2)st.music=mo2.checked;
  const mv=document.getElementById('musvol');if(mv)st.musVol=+mv.value;
  const so2=document.getElementById('symopt');if(so2)st.symbols=so2.checked;
  for(let i=0;i<st.n;i++)for(const k of[0,1]){const c=document.getElementById(`cmd${i}-${k}`);if(c){const v=c.value.trim();if(v!==st.players[i].cmdr[k]){st.players[i].cmdr[k]=v;if(!v)st.players[i].cdata[k]=null}}}
  const ar=document.getElementById('arch');if(ar)st.arch=+ar.value;
  const sc=document.getElementById('startcustom');if(sc&&sc.value){const v=parseInt(sc.value,10);if(v>0)st.start=Math.min(999,v)}}
elSetup.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;readSetupInputs();const st=S.setup;
  switch(b.dataset.act){
    case'nav':if(b.dataset.to==='settings'&&ui.scr!=='settings'){ui.setBack=ui.scr||'home'}goScr(b.dataset.to);return;
    case'resume':applyLive();ui.back=null;ui.scr='home';S.phase='game';show();save();wake();return;
    case'archive':ui.archConfirm=false;openModal('archive');return;
    case'skin':st.skin=b.dataset.v;applySkin();break;
    case'mussrc':S.setup.musSrc=b.dataset.v;save();MUSIC.sync();renderSetup();break;
    case'sndtest':{ac();const k=b.dataset.k;if(k==='end')tone([[523,.16],[659,.16],[784,.16],[1047,.5]],true);else sfx(k,true);return}
    case'fmt':st.fmt=b.dataset.v;{const l=fmtLife(st.fmt,st.n);if(l)st.start=l}if(st.fmt!=='commander'&&st.fmt!=='custom')st.arch=-1;goScr('count');return;
    case'n':st.n=+b.dataset.v;{const l=fmtLife(st.fmt,st.n);if(l&&st.fmt==='brawl')st.start=l}if(st.table==='upright'){if(st.arch>=st.n)st.arch=-1;break}if(st.table==='head2'&&st.n<4)st.table=st.n>=3?'head1':'long';if(st.table==='head1'&&st.n<3)st.table='long';if(st.arch>=st.n)st.arch=-1;break;
    case'start':st.start=+b.dataset.v;document.getElementById('startcustom').value='';break;
    case'table':st.table=b.dataset.v;applyLive();break;
    case'col':st.players[+b.dataset.i].color=b.dataset.c;st.players[+b.dataset.i].colorSet=true;break;
    case'rot':{const p=st.players[+b.dataset.i];const L=layout(st.n,st.table);const cur=p.rot!=null?p.rot:autoRot(+b.dataset.i,L);p.rot=(cur+90)%360;applyLive();break}
    case'apply':applyEdits();return;
    case'go':startGame();return;
  }
  renderSetup();save()});
elSetup.addEventListener('change',e=>{readSetupInputs();const t=e.target;

function applyEdits(){const st=S.setup;if(st.n!==S.players.length)return;
  S.players.forEach((p,i)=>{const s=st.players[i];if(p.name!==s.name)ev(p.name+' heißt jetzt '+s.name,i);p.name=s.name;p.color=s.color;p.partner=s.partner;p.rot=s.rot;p.cmdr=s.cmdr.slice();p.cdata=s.cdata.map(cmdObj)});
  Object.assign(S.cfg,{cmdLife:st.cmdLife,sound:st.sound,sfx:st.sfx,turns:st.turns,table:st.table,clock:st.clock,art:st.art});
  ui.back=null;ui.scr='home';S.phase='game';show();save();wake();toast('Übernommen')}
function startGame(){readSetupInputs();const st=S.setup;
  const fcmd=fmtCmdSetup(st),fdmg=fmtDmgSetup(st);if(st.n<3)st.arch=-1;
  S.cfg={fmt:st.fmt,cmd:fcmd,dmg:fdmg,start:st.start,cmdLife:st.cmdLife,sound:st.sound,sfx:st.sfx,turns:st.turns,table:st.table,arch:st.arch,clock:st.clock,art:st.art};
  S.players=st.players.slice(0,st.n).map((p,i)=>{const sl=st.arch>=0?(i===st.arch?40:20):st.start;
    return{id:i,name:p.name,color:p.color,partner:p.partner,rot:p.rot,cmdr:p.cmdr.slice(),cdata:p.cdata.map(cmdObj),custom:[],startLife:sl,life:sl,poison:0,energy:0,exp:0,rad:0,speed:0,ring:0,bless:false,timers:[],tax1:0,tax2:0,misc:0,cmd:{},elim:null,time:0}});
  S.players.forEach(p=>S.players.forEach(q=>{if(q.id!==p.id)p.cmd[q.id]=[0,0]}));
  S.match=(st.n===2&&st.match&&!fcmd)?{game:1,results:[]}:null;
  S.g=newG();S.hist=[];S.lifeLog=[];undo=[];ui.ov={};ui.fx={};ui.delta={};ui.roll={};ui.rollTop=new Set();
  logLives();ev(FORMATS[st.fmt].n+' · '+st.n+' Spieler'+(S.match?' · Match Best-of-3':'')+(st.arch>=0?' · Archenemy: '+S.players[st.arch].name:' · '+st.start+' Leben'));
  ui.startPrompt=true;ui.back=null;ui.scr='home';S.phase='game';show();save();wake();if(S.cfg.sound||S.cfg.sfx)ac()}
function cmdObj(c){return c?{...c}:null}
function cmdName(p,k){const c=p.cdata&&p.cdata[k];const n=(c&&(c.nameDe||c.name))||(p.cmdr&&p.cmdr[k])||'';return n?shortName(n):''}
const mWins=id=>S.match?S.match.results.filter(r=>r.winner===id).length:0;
const mOver=()=>!!S.match&&S.players.some(p=>mWins(p.id)>=2);
function lastLoser(){if(!S.match||!S.match.results.length)return null;const r=S.match.results[S.match.results.length-1];return r.winner==null?null:S.players.find(p=>p.id!==r.winner).id}
function newG(){return{paused:false,pausedAt:null,turn:1,active:null,first:null,monarch:null,initiative:null,dn:0,storm:0,planar:0,started:Date.now(),turnStart:null,ended:false,endedAt:null,winner:null}}
function restartSame(){pushUndo();if(S.match){if(mOver()){S.match={game:1,results:[]};ev('Neues Match')}else S.match.game++}S.players.forEach(p=>{Object.assign(p,{life:p.startLife,poison:0,energy:0,exp:0,rad:0,speed:0,ring:0,bless:false,timers:[],tax1:0,tax2:0,misc:0,elim:null,time:0});(p.custom||[]).forEach(c=>c.v=0);for(const f in p.cmd)p.cmd[f]=[0,0]});
  S.g=newG();S.lifeLog=[];logLives();ev(S.match?'Spiel '+S.match.game+' von 3':'Neue Runde');ui.ov={};ui.fx={};ui.delta={};ui.startPrompt=true;closeModal();update();save()}

  const dz=(k,on,label,sub)=>`<button class="dz${on?' on':''}" data-act="desig" data-pid="${p.id}" data-k="${k}" aria-pressed="${on}">${ctrIcon(k)}<span>${label}<small>${sub}</small></span></button>`;

    const n=c.tax?(cn?cn:c.n):c.n;
    const sub=c.tax?`<small>${v}× gestorben / gewirkt · +${v*2} Mana${cd&&cd.cmc!=null?' · kostet '+(cd.cmc+v*2):''}</small>`:c.hint?`<small>${c.hint}</small>`:'';
    return`<div class="r"><div class="lab">${ctrIcon(c.k)}<span>${esc(n)}${sub}</span></div>${rowsCtl(`data-act="ctr" data-pid="${p.id}" data-k="${c.k}"`,c.tax?'+'+v*2:v,c.k==='poison'&&v>=7?' hot':'')}</div>`}));

  rows.push(`<div class="r wide"><div class="addrow" style="grid-column:1/-1"><input type="text" id="custin${p.id}" placeholder="Eigener Zähler, z. B. Schatz" maxlength="20" autocomplete="off"><button class="tb" data-act="custadd" data-pid="${p.id}">Hinzufügen</button></div></div>`);
  rows.push(`<div class="r wide sect"><div class="lab"><i class="ci">${I.hourglass}</i><span>Effekte mit Rundenbezug<small>${S.cfg.turns?'Laufen beim Zugwechsel automatisch ab':'„Züge mitzählen“ einschalten, damit sie automatisch ablaufen'}</small></span></div></div>`);
  (p.timers||[]).forEach((t,ti)=>rows.push(`<div class="r cust"><div class="lab"><i class="ci">${I.hourglass}</i><span>${esc(t.n)}<small>${TMODES[t.m]}${t.m==='up'?' · bis '+t.max:''}</small></span></div>${t.m==='eot'||t.m==='next'?'<span></span><span></span><span></span>':rowsCtl(`data-act="tmr" data-pid="${p.id}" data-i="${ti}"`,t.m==='up'?t.v+'/'+t.max:t.v)}<button class="del" data-act="tmrdel" data-pid="${p.id}" data-i="${ti}" aria-label="Effekt entfernen">${I.x}</button></div>`));

function chip(k,label,val,cls,extra){return`<span class="pchip${cls?' '+cls:''}" title="${esc(label)}"${extra||''}><span class="pc-t">${k?ctrIcon(k):''}${val!=null&&val!==''?`<b>${val}</b>`:''}</span><small>${esc(label)}</small></span>`}
function chipsHTML(p){const out=[];
  if(S.g.monarch===p.id)out.push(chip('monarch','Monarch','','gold'));
  if(S.g.initiative===p.id)out.push(chip('initiative','Initiative','','gold'));
  if(p.bless)out.push(chip('bless','Stadtsegen',''));
  if(S.cfg.arch===p.id)out.push(`<span class="pchip"><span class="pc-t"><b>Erzfeind</b></span></span>`);
  if(p.poison)out.push(chip('poison','Gift',p.poison,p.poison>=7?'warn':''));
  if(isDmg())S.players.forEach(q=>{if(q.id===p.id)return;const a=p.cmd[q.id];const m=Math.max(a[0],q.partner?a[1]:0);if(m)out.push(`<span class="pchip${m>=15?' warn':''}" style="--dot:${col(q).bg}" title="Commander-Schaden"><span class="pc-t"><i></i><b>${m}</b></span><small>${esc(q.name)}</small></span>`)});
  if(p.tax1&&!cmdName(p,0))out.push(chip('tax1','Steuer','+'+p.tax1*2));
  if(p.partner&&p.tax2&&!cmdName(p,1))out.push(chip('tax2','Steuer²','+'+p.tax2*2));
  if(p.energy)out.push(chip('energy','Energie',p.energy));
  if(p.exp)out.push(chip('exp','Erfahrung',p.exp));
  if(p.rad)out.push(chip('rad','Strahlung',p.rad));
  if(p.speed)out.push(chip('speed','Tempo',p.speed,p.speed>=4?'gold':''));
  if(p.ring)out.push(chip('ring','Ring',p.ring));
  if(p.misc)out.push(chip('misc','Marken',p.misc));
  (p.custom||[]).forEach(c=>{if(c.v)out.push(chip('custom',c.name,c.v))});
  out.push(timerChips(p));
  return out.join('')}

const MSC={W:'#f6f0d6',U:'#a9d0ef',B:'#b9aeb4',R:'#f19c80',G:'#9bd3ae',C:'#d5d0cc'};
const useSym=()=>S.setup.symbols!==false;
function symImg(x,fb){const f=x.replace(/\//g,'').toUpperCase();return`<img class="msi" src="https://svgs.scryfall.io/card-symbols/${encodeURIComponent(f)}.svg" alt="{${esc(x)}}" onerror="this.hidden=true;this.nextElementSibling.hidden=false">${fb.replace('<i ','<i hidden ')}`}
function manaHTML(cost){if(!cost)return'';if(useSym())return cost.replace(/\{([^}]+)\}/g,(m,x)=>symImg(x,manaPip(x))).replace(/ \/\/ /g,' / ');return cost.replace(/\{([^}]+)\}/g,(m,x)=>manaPip(x)).replace(/ \/\/ /g,' / ')}
function manaPip(x){{
  if(/^[WUBRGC]$/.test(x))return`<i class="mp ${x}"></i>`;
  const h=x.split('/');if(h.length===2&&MSC[h[0]]&&MSC[h[1]])return`<i class="mp" style="background:linear-gradient(135deg,${MSC[h[0]]} 50%,${MSC[h[1]]} 50%)"></i>`;
  if(h.length===2&&h[1]==='P'&&MSC[h[0]])return`<i class="mp ${h[0]}">ϕ</i>`;
  return`<i class="mp">${esc(x)}</i>`}}
function manaInText(t){if(useSym())return t.replace(/\{([^}]+)\}/g,(m,x)=>symImg(x,x==='T'?'<i class="mp">↷</i>':manaPip(x)));return t.replace(/\{([^}]+)\}/g,(m,x)=>{const c=x.replace('/','');const cls=/^[WUBRGC]$/.test(c)?c:'';return`<i class="mp ${cls}">${x==='T'?'↷':x.replace('/','')}</i>`})}
function cmdrHTML(p){const out=[];if(!isCmd())return'';[0,1].forEach(k=>{if(k===1&&!p.partner)return;const n=cmdName(p,k);if(!n)return;const tax=p[k?'tax2':'tax1']||0;const c=p.cdata[k];
    const cost=c&&c.cmc!=null?c.cmc+tax*2:null;
    const mc=c&&c.cost?`<span class="mc">${manaHTML(c.cost)}</span>`:'';
    out.push(`<span class="cmdr" title="${esc(n)}" data-act="card" data-pid="${p.id}" data-k="${k}"><span class="cn">${esc(n)}</span>${mc}${tax?`<span class="tx">+${tax*2}</span>`:''}${tax&&cost!=null?`<span class="cost">= ${cost}</span>`:!mc&&cost!=null?`<span class="cost">${cost} Mana</span>`:''}</span>`)});
  return out.join('')}

function update(){try{MUSIC.follow()}catch(e){}if(S.phase!=='game'||!S.players.length)return;
  const bar=$('#bar');if(bar){const sl=bar.scrollLeft;bar.innerHTML=barHTML();bar.scrollLeft=sl;tickClock()}
  S.players.forEach(p=>{const el=elGame.querySelector(`.panel[data-pid="${p.id}"]`);if(!el)return;

    el.classList.toggle('dead',!!dr);el.classList.toggle('active',S.cfg.turns&&S.g.active===p.id&&!S.g.ended);el.classList.toggle('kbsel',ui.sel===p.id);el.classList.toggle('pick',ui.pick===p.id);el.classList.toggle('shake',!!ui.shake[p.id]);

    else if(sk==='parchment'){el.style.setProperty('--pc',c.bg);el.style.setProperty('--bg2','#ead8af');el.style.setProperty('--fg','#2b1d10')}
    else if(sk==='terminal'){const nf=mixHex(c.bg,'#ffffff',.45);el.style.setProperty('--fg',p.color==='B'?'#c9a6ff':p.color==='C'?'#cfe3ea':nf);el.style.setProperty('--bg2','#020a05')}
    else if(sk==='identity'){const ids=idColors(p);let g,glow;if(ids){const cs=ids.map(x=>ID_COL[x]);g=cs.length===1?`radial-gradient(120% 120% at 30% 25%,${mixHex(cs[0],'#ffffff',.18)},${cs[0]} 45%,${mixHex(cs[0],'#000000',.55)})`:`linear-gradient(125deg,${cs.map((x,i)=>x+' '+Math.round(i/(cs.length-1)*100)+'%').join(',')})`;glow=ID_GLOW[ids[0]]}else{g=`radial-gradient(120% 120% at 30% 25%,${c.bg},${c.bg2})`;glow='rgba(255,255,255,.3)'}
      el.style.setProperty('--idg',g);el.style.setProperty('--glow',glow);el.style.setProperty('--bg2',ids?mixHex(ID_COL[ids[0]],'#000000',.55):c.bg2);el.style.setProperty('--fg',ids&&ids.length===1&&ids[0]==='W'?'#fffaf0':'#f7f3ea')}
    else{el.style.setProperty('--bg2',c.bg2);el.style.setProperty('--fg',art&&sk==='classic'?'#f7f3ea':c.fg)}
    el.querySelector('.name').innerHTML=esc(p.name)+(sk==='identity'&&idColors(p)&&isCmd()?` <span class="pips">${idColors(p).map(x=>useSym()?symImg(x,`<i style="--c:${ID_COL[x]}"></i>`):`<i style="--c:${ID_COL[x]}"></i>`).join('')}</span>`:'');
    const inn=el.querySelector('.inner');inn.classList.toggle('art',!!art);el.classList.toggle('hasart',!!art);if(art)inn.style.setProperty('--art',`url("${art}")`);
    {const ids=S.setup.glow!==false&&sk!=='identity'&&isCmd()?idColors(p):null;el.classList.toggle('glowon',!!ids);
      if(ids){const cs=ids.map(x=>ID_LINE[x]);el.style.setProperty('--glg',cs.length===1?cs[0]:`linear-gradient(135deg,${cs.map((x,i)=>x+' '+Math.round(i/(cs.length-1)*100)+'%').join(',')})`);el.style.setProperty('--glc',ID_GLOW[ids[0]])}}
    el.querySelector('.cmdrline').innerHTML=cmdrHTML(p);
    el.querySelector('.num').textContent=p.life;
    const b=[];if(S.cfg.turns&&S.g.active===p.id&&!S.g.ended)b.push(`<span class="badge turn">am Zug${S.cfg.clock?' <span class="ttime"></span>':''}</span>`);if(S.match&&mWins(p.id))b.push(`<span class="badge">${'●'.repeat(mWins(p.id))} ${mWins(p.id)===1?'1 Sieg':'2 Siege'}</span>`);
    el.querySelector('.badges').innerHTML=b.join('');
    el.querySelector('.pchips').innerHTML=chipsHTML(p);
    const dl=el.querySelector('.delta'),dv=ui.delta[p.id];dl.classList.toggle('on',!!(dv&&dv.v));if(dv)dl.textContent=(dv.v>0?'+':'−')+Math.abs(dv.v);
    el.querySelector('.deadov small').textContent=dr||'';
    const rv=ui.roll[p.id],rov=el.querySelector('.rollov');rov.classList.toggle('on',rv!=null);rov.classList.toggle('top',ui.rollTop.has(p.id));if(rv!=null)rov.querySelector('b').textContent=rv;
    const ov=el.querySelector('.ov');const t=ui.ov[p.id];ov.classList.toggle('on',!!t);
    if(t&&ov.contains(document.activeElement)&&document.activeElement.tagName==='INPUT'){}

      <div class="row2"><button data-act="sp-pick">Auslosen</button><button data-act="sp-choose">Selbst wählen</button><button data-act="sp-skip">Überspringen</button></div>`}
    else sp.innerHTML=`<button class="big" data-act="sp-pick">${up?'':'<span class="flip">Startspieler auslosen</span>'}<span>Startspieler auslosen</span></button>
      <div class="row2"><button data-act="sp-roll">Alle würfeln W20</button><button data-act="sp-choose">Selbst wählen</button><button data-act="sp-skip">Überspringen</button></div>`}
  else if(sp)sp.remove();
  if(ui.modal==='hist'||ui.modal==='stats')renderModal()}

const nowG=()=>S.g.paused&&S.g.pausedAt?S.g.pausedAt:Date.now();
function tickClock(){if(!S.g||S.phase!=='game')return;const c=document.getElementById('clock');const end=S.g.ended?S.g.endedAt:nowG();
  if(c)c.innerHTML=(S.g.paused?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>':'')+fmtT(end-S.g.started);
  const tt=elGame.querySelector('.panel.active .ttime');if(tt&&S.g.turnStart)tt.textContent=fmtT(nowG()-S.g.turnStart)}
function togglePause(){const g=S.g;if(g.ended)return;const now=Date.now();
  if(g.paused){const d=now-(g.pausedAt||now);g.started+=d;if(g.turnStart)g.turnStart+=d;g.paused=false;g.pausedAt=null;toast('Uhr läuft weiter')}
  else{g.paused=true;g.pausedAt=now;toast('Uhr pausiert')}update();save()}
setInterval(tickClock,1000);

/* ---------- Eingabe: Tippen = 1 Schritt, Halten = schnell ---------- */
const presses=new Map();
elGame.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.half');
  if(h&&!ui.assign){e.preventDefault();const pid=+h.dataset.pid,d=+h.dataset.dir;pushUndo('life'+pid);h.classList.add('press');
    const st={el:h,held:false,tap:()=>changeLife(pid,d)};
    st.t=setTimeout(()=>{st.held=true;changeLife(pid,d*10);st.iv=setInterval(()=>changeLife(pid,d*10),550)},450);
    presses.set(e.pointerId,st);try{h.setPointerCapture(e.pointerId)}catch(_){}return}
  const r=e.target.closest('[data-rep]');
  if(r){const act=()=>runAct(r);r.classList.add('press');const st={el:r,held:false,tap:act,n:0};
    st.t=setTimeout(()=>{st.held=true;const loop=()=>{runAct(r);st.n++;st.iv=setTimeout(loop,st.n>8?60:130)};loop()},420);
    presses.set(e.pointerId,st)}
});
function endPress(e,apply){const st=presses.get(e.pointerId);if(!st)return;clearTimeout(st.t);clearTimeout(st.iv);clearInterval(st.iv);st.el.classList.remove('press');presses.delete(e.pointerId);
  if(!st.held&&apply)st.tap()}
window.addEventListener('pointerup',e=>endPress(e,true));
window.addEventListener('pointercancel',e=>endPress(e,false));
elGame.addEventListener('contextmenu',e=>e.preventDefault());

function runAct(b){const a=b.dataset.act,pid=+b.dataset.pid,d=+b.dataset.d;
  if(a==='cmd')changeCmd(pid,+b.dataset.from,+b.dataset.k,d);
  else if(a==='ctr')changeCtr(pid,b.dataset.k,d);
  else if(a==='cust'){const c=P(pid).custom[+b.dataset.i];if(!c)return;const nv=Math.max(0,c.v+d);if(nv===c.v)return;pushUndo('cu'+pid+b.dataset.i);c.v=nv;addHist({pid,k:'ev',text:P(pid).name+': '+c.name+' → '+nv});update();save()}
  else if(a==='tmr'){const t=(P(pid).timers||[])[+b.dataset.i];if(!t)return;pushUndo('tm'+pid+b.dataset.i);if(t.m==='up')t.v=Math.max(1,Math.min(t.max,t.v+d));else t.v=Math.max(1,t.v+d);update();save()}
  else if(a==='fxamt'){const f=fxState(pid);f.amt=Math.max(1,Math.min(999,f.amt+d));update()}}

elGame.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.hasAttribute('data-rep')||b.disabled)return;const a=b.dataset.act,pid=b.dataset.pid!=null?+b.dataset.pid:null;
  switch(a){
    case'card':{const k=+b.dataset.k;ui.cardK[pid]=k;ui.ov[pid]='card';update();const pl=P(pid),cd=pl.cdata&&pl.cdata[k];
      if(cd&&!cd.full&&!cd.offline){enrich(cd).then(n=>{if(n&&n!==cd){pl.cdata[k]=n;if(S.setup.players[pid])S.setup.players[pid].cdata[k]={...n};save();update()}})}
      else if(!cd&&pl.cmdr&&pl.cmdr[k]){sfCard(pl.cmdr[k]).then(n=>{if(n){pl.cdata[k]=n;save();update()}})}break}
    case'cardlang':ui.cardEn[pid]=!ui.cardEn[pid];update();break;
    case'ov':ui.ov[pid]=ui.ov[pid]===b.dataset.ov?null:b.dataset.ov;if(b.dataset.ov==='pad')ui.pad[pid]='';update();break;
    case'ovclose':ui.ov[pid]=null;update();break;
    case'fxset':fxState(pid).amt=+b.dataset.v;update();break;
    case'fxtgt':{const f=fxState(pid),t=+b.dataset.t;f.target=f.target===t?null:t;update();break}
    case'fxcmd':fxState(pid).cmd=!fxState(pid).cmd;update();break;
    case'fxck':fxState(pid).ck=+b.dataset.k;update();break;
    case'fxlink':fxState(pid).link=!fxState(pid).link;update();break;
    case'fx':runFx(pid,b.dataset.kind);break;
    case'padkey':{let v=ui.pad[pid]??'';const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(k==='±')v=v.startsWith('-')?v.slice(1):'-'+v;else if(v.replace('-','').length<4)v+=k;ui.pad[pid]=v;update();break}
    case'padok':{const v=parseInt(ui.pad[pid],10);ui.pad[pid]='';ui.ov[pid]=null;if(!isNaN(v)&&v!==P(pid).life){pushUndo();changeLife(pid,v-P(pid).life)}else update();break}
    case'custadd':{const inp=document.getElementById('custin'+pid);const n=inp&&inp.value.trim();if(!n){inp&&inp.focus();break}pushUndo();P(pid).custom.push({name:n,v:0});inp.blur();update();save();break}
    case'tmradd':{const pre=TPRE[+b.dataset.i],inp=document.getElementById('tmrin'+pid),nm=(inp&&inp.value.trim())||pre[0];pushUndo();const pl=P(pid);(pl.timers||(pl.timers=[])).push({n:nm,m:pre[1],v:pre[2]||0,max:pre[3]||null});if(inp){inp.value='';inp.blur()}ev(pl.name+': Effekt „'+nm+'“ ('+TMODES[pre[1]]+')',pid);update();save();break}
    case'tmrdel':{pushUndo();P(pid).timers.splice(+b.dataset.i,1);update();save();break}
    case'custdel':{pushUndo();P(pid).custom.splice(+b.dataset.i,1);update();save();break}
    case'pause':togglePause();break;
    case'fs':fullscreen();break;
    case'rotp':{const p=P(pid);p.rot=(rotOf(p)+90)%360;S.setup.players[pid].rot=p.rot;relayout();update();save();break}
    case'undo':doUndo();break;
    case'next':if(S.g.ended)openModal('end');else stepTurn(1);break;
    case'prev':stepTurn(-1);break;
    case'monarch':case'initiative':ui.assign=a;update();break;
    case'desig':{const k=b.dataset.k,pl=P(pid);pushUndo();if(k==='bless'){pl.bless=!pl.bless;ev(pl.name+(pl.bless?' erhält den Stadtsegen':': Stadtsegen entfernt'),pid)}
      else{const had=S.g[k]===pid;S.g[k]=had?null:pid;ev(k==='monarch'?(had?'Kein Monarch mehr':'Monarch: '+pl.name):(had?'Initiative entfernt':'Initiative: '+pl.name),pid);if(!had)sfx('turn')}update();save();break}
    case'assign':{pushUndo();const k=ui.assign;if(k==='start'){ui.assign=null;setStarter(pid,'gewählt');update();break}S.g[k]=pid;ev((k==='monarch'?'Monarch: ':'Initiative: ')+P(pid).name,pid);ui.assign=null;update();save();break}
    case'assignnone':{pushUndo();const k=ui.assign;S.g[k]=null;ev(k==='monarch'?'Kein Monarch mehr':'Initiative entfernt');ui.assign=null;update();save();break}
    case'assigncancel':if(ui.assign==='start')ui.startPrompt=true;ui.assign=null;update();break;
    case'sp-pick':pickStart();break;
    case'sp-loser':{ui.startPrompt=false;pushUndo();setStarter(lastLoser(),'(Verlierer des letzten Spiels)');update();break}
    case'sp-roll':rollAll(true);break;
    case'sp-choose':ui.startPrompt=false;ui.assign='start';update();break;
    case'sp-skip':ui.startPrompt=false;update();break;
    case'dn':pushUndo();S.g.dn=(S.g.dn+1)%3;if(S.g.dn)ev(S.g.dn===1?'Es wird Tag':'Es wird Nacht');update();save();break;
    case'menu':case'tools':case'hist':case'stats':case'look':openModal(a);if(a==='look')setTimeout(()=>{const i=document.getElementById('lookin');if(i&&!HASTOUCH)i.focus()},50);break;
  }});

/* ---------- Auswertung ---------- */
function playTime(p){let t=p.time||0;if(S.g.active===p.id&&S.g.turnStart&&!S.g.ended)t+=nowG()-S.g.turnStart;return t}
function cmdDealt(p){let s=0;S.players.forEach(q=>{if(q.id!==p.id){const a=q.cmd[p.id];s+=a[0]+a[1]}});return s}
function chartSVG(){const log=S.lifeLog.slice();if(!log.length)return'';
  const end=S.g.ended?S.g.endedAt:Date.now();log.push({t:end,l:S.players.map(p=>p.life)});
  const t0=log[0].t,t1=Math.max(end,t0+60000);let lo=0,hi=0;log.forEach(e=>e.l.forEach(v=>{if(v>hi)hi=v;if(v<lo)lo=v}));hi=Math.ceil(hi/10)*10||10;
  const W=560,H=220,pl=34,pr=10,pt=10,pb=24,x=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),y=v=>pt+(hi-v)/(hi-lo||1)*(H-pt-pb);
  const ticks=[];const step=hi>40?20:10;for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)ticks.push(v);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lebensverlauf">`;
  ticks.forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#5a4a3a':'#23262d'}" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" fill="#9a968c" font-size="11" text-anchor="end">${v}</text>`});
  const mins=Math.round((t1-t0)/60000);s+=`<text x="${pl}" y="${H-6}" fill="#9a968c" font-size="11">0 min</text><text x="${W-pr}" y="${H-6}" fill="#9a968c" font-size="11" text-anchor="end">${mins} min</text>`;
  S.players.forEach((p,i)=>{let d='';let prev=null;log.forEach(e=>{const v=e.l[i];if(v==null)return;const X=x(e.t).toFixed(1),Y=y(v).toFixed(1);d+=d?` L${X},${prev} L${X},${Y}`:`M${X},${Y}`;prev=Y});
    const c=LINE[p.color]||'#ccc';s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`;
    const last=log[log.length-1];s+=`<circle cx="${x(last.t)}" cy="${y(last.l[i])}" r="3.5" fill="${c}"/>`});
  return s+'</svg>'}
function statsHTML(){const g=S.g;const end=g.ended?g.endedAt:nowG();
  const tbl=`<div class="tblwrap"><table class="t"><thead><tr><th>Spieler</th><th>Leben</th><th>Zeit am Zug</th>${isDmg()?'<th>Cmd-Schaden ausgeteilt</th>':''}<th>Ausgeschieden</th></tr></thead><tbody>${S.players.map(p=>`<tr><td><span class="dot" style="--dot:${col(p).bg}"></span>${esc(p.name)}${cmdName(p,0)?` <small style="color:var(--muted)">${esc([0,1].map(k=>cmdName(p,k)).filter(Boolean).join(' + '))}</small>`:''}</td><td>${p.life}</td><td>${fmtT(playTime(p))}</td>${isDmg()?`<td>${cmdDealt(p)}</td>`:''}<td>${p.elim?`Zug ${p.elim.turn}${p.elim.by!=null&&P(p.elim.by)?' · durch '+esc(P(p.elim.by).name):''}`:'–'}</td></tr>`).join('')}</tbody></table></div>`;
  const mx=`<div class="tblwrap"><table class="t"><thead><tr><th>erhalten ↓ / von →</th>${S.players.map(q=>`<th><span class="dot" style="--dot:${col(q).bg}"></span>${esc(q.name.slice(0,6))}</th>`).join('')}</tr></thead><tbody>${S.players.map(p=>`<tr><td><span class="dot" style="--dot:${col(p).bg}"></span>${esc(p.name)}</td>${S.players.map(q=>{if(q.id===p.id)return'<td>–</td>';const a=p.cmd[q.id];const v=q.partner?a[0]+' / '+a[1]:a[0];return`<td class="${Math.max(a[0],a[1])>=15?'hot':''}">${v}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
  return`${S.match?`<div class="kpis">${S.players.map(p=>`<div class="kpi"><small>Match · ${esc(p.name)}</small><b>${mWins(p.id)} ${mWins(p.id)>=2?' · Sieger':''}</b></div>`).join('')}</div>`:''}<div class="kpis"><div class="kpi"><small>Spieldauer</small><b>${fmtT(end-g.started)}</b></div>${S.cfg.turns?`<div class="kpi"><small>Runde</small><b>${g.turn}</b></div>`:''}<div class="kpi"><small>Noch im Spiel</small><b>${alive().length} / ${S.players.length}</b></div></div>
  <div class="grp"><h4>Lebensverlauf</h4><div class="chart">${chartSVG()}<div class="legend">${S.players.map(p=>`<span style="--dot:${LINE[p.color]}"><i></i>${esc(p.name)}</span>`).join('')}</div></div></div>
  <div class="grp"><h4>Spieler</h4>${tbl}</div>
  ${isDmg()?`<div class="grp"><h4>Commander-Schaden</h4>${mx}</div>`:''}`}

function archiveHTML(){const all=loadArch();const fmts=[...new Set(all.map(g=>g.fmt||'commander'))];const af=ui.archFmt&&fmts.includes(ui.archFmt)?ui.archFmt:'all';const a=af==='all'?all:all.filter(g=>(g.fmt||'commander')===af);const chips=fmts.length>1?`<div class="chips-row">${['all',...fmts].map(f=>`<button class="ch txt" data-act="archfmt" data-v="${f}" aria-pressed="${f===af}">${f==='all'?'Alle':FORMATS[f]?FORMATS[f].n:f}</button>`).join('')}</div>`:'';if(!a.length)return'<p class="hint">Noch keine beendeten Spiele. Sobald ein Spiel einen Gewinner hat, landet es hier.</p>';
  const tally=(keyFn)=>{const m={};a.forEach(gm=>gm.players.forEach(p=>{const k=keyFn(p);if(!k)return;const e=m[k]||(m[k]={k,games:0,wins:0,place:0});e.games++;e.place+=p.place;if(p.place===1)e.wins++}));return Object.values(m).sort((x,y)=>y.wins-x.wins||y.wins/y.games-x.wins/x.games)};
  const tbl=(rows,label)=>`<div class="tblwrap"><table class="t"><thead><tr><th>${label}</th><th>Spiele</th><th>Siege</th><th>Quote</th><th>Ø Platz</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.k)}</td><td>${r.games}</td><td>${r.wins}</td><td>${Math.round(r.wins/r.games*100)} %</td><td>${(r.place/r.games).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`;
  const avg=a.reduce((s,g)=>s+g.dur,0)/a.length;
  const cm=tally(p=>p.cmdr);
  return`${chips}<div class="kpis"><div class="kpi"><small>Spiele</small><b>${a.length}</b></div><div class="kpi"><small>Ø Dauer</small><b>${fmtT(avg)}</b></div><div class="kpi"><small>Ø Runden</small><b>${(a.reduce((s,g)=>s+g.turns,0)/a.length).toFixed(1)}</b></div></div>
  <div class="grp"><h4>Spieler</h4>${tbl(tally(p=>p.name),'Spieler')}</div>
  ${cm.length?`<div class="grp"><h4>Commander</h4>${tbl(cm,'Commander')}</div>`:''}
  <div class="grp"><h4>Letzte Spiele</h4><div class="arch-list">${a.slice().reverse().slice(0,30).map(g=>{const d=new Date(g.date);return`<div class="arch-item"><span><b>${esc(g.winner||'Unentschieden')}</b> gewinnt${(()=>{const w=g.players.find(p=>p.place===1);return w&&w.cmdr?' mit '+esc(w.cmdr):''})()}</span><small>${FORMATS[g.fmt||'commander']?FORMATS[g.fmt||'commander'].n:''}${g.mgame?' (Spiel '+g.mgame+')':''} · ${d.toLocaleDateString('de-DE')} · ${fmtT(g.dur)} · ${g.turns} Runden · ${g.players.map(p=>esc(p.name)).join(', ')}</small></div>`}).join('')}</div></div>
  <button class="mbtn${ui.archConfirm?' warn':''}" data-act="archclear">${I.reset}<span>${ui.archConfirm?'Wirklich alles löschen? Nochmal tippen':'Archiv leeren'}</span></button>`}

function histLine(h){const t=new Date(h.t);const tm=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  const p=h.pid!=null?P(h.pid):null;const dot=p?col(p).bg:'transparent';const nm=p?esc(p.name):'';const sg=v=>(v>0?'+':'−')+Math.abs(v);let txt;
  if(h.k==='ev')txt=esc(h.text);
  else if(h.k==='life')txt=`${nm}: Leben ${sg(h.d)} → <b>${h.res}</b>`;
  else if(h.k==='cmd'){const q=P(h.from);txt=`${nm}: Commander-Schaden von ${esc(q?q.name:'?')}${q&&q.partner?' ('+(h.ck+1)+')':''} ${sg(h.d)} → <b>${h.res}</b>`}
  else{const c=CTRS.find(c=>c.k===h.k);txt=`${nm}: ${c?c.n:h.k} ${sg(h.d)} → <b>${h.res}</b>`}
  return`<div style="--dot:${dot}"><time>${tm}</time><i></i><span>${txt}</span></div>`}

  else if(t==='look'){const rr=S.setup.lookRecent||[],ru=ui.rule!=null?RULES[ui.rule]:null;body=`<div class="card-h"><h2>Karte &amp; Regeln</h2>${X}</div>

  else if(t==='archive'){body=`<div class="card-h"><h2>Archiv</h2>${X}</div>${archiveHTML()}`}
  else if(t==='end'){const w=S.g.winner!=null?P(S.g.winner):null;const c=w?col(w):COLORS.C;body=`<div class="card-h"><h2>Spielende</h2>${X}</div>
    <div class="winner" style="--bg:${c.bg};--bg2:${c.bg2};--fg:${c.fg}"><small>${S.match?(mOver()?'Match gewonnen':'Spiel '+S.match.game+' gewonnen'):(w?'Gewonnen hat':'Ergebnis')}</small><b>${w?esc(w.name):'Unentschieden'}</b>${S.match?`<small>Stand ${S.players.map(p=>mWins(p.id)).join(' : ')}</small>`:''}${w&&cmdName(w,0)?`<small>mit ${esc([0,1].map(k=>cmdName(w,k)).filter(Boolean).join(' + '))}</small>`:''}</div>
    ${statsHTML()}
    <div class="mrow"><button class="mbtn" data-act="restart2">${I.reset}<span>${S.match?(mOver()?'Neues Match':'Spiel '+(S.match.game+1)+' starten'):'Neue Runde'}<small>${S.match&&!mOver()?'Gleiche Decks, Leben zurück auf '+S.cfg.start:'Gleiche Spieler'}</small></span></button><button class="mbtn" data-act="close">${I.undo}<span>Weiterspielen<small>Zum Korrigieren „Zurück“ nutzen</small></span></button></div>`}
  const sc=elModal.querySelector('.card')?.scrollTop||0;
  elModal.innerHTML=`<div class="card" role="dialog" aria-modal="true">${body}</div>`;elModal.classList.add('on');elModal.querySelector('.card').scrollTop=sc}
elModal.addEventListener('click',e=>{if(e.target===elModal)return closeModal();const b=e.target.closest('[data-act]');if(!b)return;
  switch(b.dataset.act){
    case'close':closeModal();break;
    case'restart':if(ui.confirm==='restart')restartSame();else{ui.confirm='restart';renderModal()}break;
    case'restart2':restartSame();break;
    case'archive':ui.archConfirm=false;openModal('archive');break;
    case'skin':S.setup.skin=b.dataset.v;applySkin();update();renderModal();save();break;
    case'archfmt':ui.archFmt=b.dataset.v;renderModal();break;
    case'archclear':if(ui.archConfirm){saveArch([]);ui.archConfirm=false;toast('Archiv geleert')}else ui.archConfirm=true;renderModal();break;
    case'setup':case'settings':case'home':{closeModal();S.players.forEach((p,i)=>Object.assign(S.setup.players[i],{name:p.name,color:p.color,partner:p.partner,rot:p.rot}));S.setup.n=S.players.length;S.setup.table=S.cfg.table;if(S.cfg.fmt)S.setup.fmt=S.cfg.fmt;
      const a=b.dataset.act;ui.scr=a==='setup'?'players':a;ui.back=a==='home'?null:'game';S.phase='setup';show();save();break}
    case'fs':fullscreen();break;
    case'die':rollDie3d(b.dataset.s==='coin'?'coin':+b.dataset.s);break;
    case'reroll':if(ui.dSides==='planar')rollPlanar();else rollDie3d(ui.dSides||20);break;
    case'dcount':{ui.dCount=Math.max(1,Math.min(6,(ui.dCount||1)+ +b.dataset.d));const sb=b.parentElement.querySelector('b');if(sb)sb.textContent=ui.dCount;break}
    case'dcol':S.setup.diceCol=b.dataset.v;elModal.querySelectorAll('.dcol').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));save();if(ui.dSides)rollDie3d(ui.dSides);break;
    case'startp':pickStart();break;
    case'rollall':rollAll();break;
    case'planar':rollPlanar();break;
    case'lookgo':lookup(document.getElementById('lookin').value);break;
    case'lookpick':lookup(b.dataset.n);break;
    case'rule':ui.rule=ui.rule===+b.dataset.i?null:+b.dataset.i;{const rl=document.getElementById('rulelist');if(rl)rl.innerHTML=ruleListHTML()}break;
    case'rcat':ui.rcat=b.dataset.v;ui.ruleQ='';ui.rule=null;{const ri=document.getElementById('rulein');if(ri)ri.value=''}elModal.querySelectorAll('.rcats .ch').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));{const rl=document.getElementById('rulelist');if(rl)rl.innerHTML=ruleListHTML()}break;
    case'music':S.setup.music=!S.setup.music;MUSIC.sync();save();renderModal();toast(S.setup.music?'Musik an':'Musik aus');break;
    case'monarch':case'initiative':closeModal();ui.assign=b.dataset.act;update();break;
    case'dn':pushUndo();S.g.dn=(S.g.dn+1)%3;if(S.g.dn)ev(S.g.dn===1?'Es wird Tag':'Es wird Nacht');update();save();renderModal();break;
    case'storm':S.g.storm=Math.max(0,S.g.storm+ +b.dataset.d);renderModal();update();save();break;
  }});
elModal.addEventListener('change',e=>{if(e.target.id==='m-sfx'){S.cfg.sfx=S.setup.sfx=e.target.checked;if(e.target.checked){ac();sfx('heal')}save()}if(e.target.id==='m-turns'){S.cfg.turns=S.setup.turns=e.target.checked;update();save()}if(e.target.id==='m-clock'){S.cfg.clock=S.setup.clock=e.target.checked;update();save()}if(e.target.id==='m-art'){S.cfg.art=S.setup.art=e.target.checked;update();save()}if(e.target.id==='m-cmdlife'){S.cfg.cmdLife=S.setup.cmdLife=e.target.checked;save()}if(e.target.id==='m-sound'){S.cfg.sound=S.setup.sound=e.target.checked;if(e.target.checked)ac();save()}});
elModal.addEventListener('input',e=>{const t=e.target;if(t.id==='rulein'){ui.ruleQ=t.value;ui.rule=null;const rl=document.getElementById('rulelist');if(rl)rl.innerHTML=ruleListHTML();elModal.querySelectorAll('.rcats .ch').forEach(x=>x.setAttribute('aria-pressed',String(!ui.ruleQ&&x.dataset.v===(ui.rcat||'spiel'))));return}if(t.id!=='lookin')return;const dl=document.getElementById('dl-lookin');if(dl&&[...dl.options].some(o=>o.value===t.value)){lookup(t.value);t.blur();return}onCmdInput(t)});
elModal.addEventListener('keydown',e=>{if(e.target.id==='lookin'&&e.key==='Enter'){e.preventDefault();lookup(e.target.value);e.target.blur()}});
document.addEventListener('keydown',e=>{
  if(S.phase==='game'&&!ui.modal&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    const k=e.key;
    if(/^[1-6]$/.test(k)&&+k<=S.players.length){ui.sel=ui.sel===+k-1?null:+k-1;update();e.preventDefault();return}
    if(ui.sel!=null&&(k==='ArrowUp'||k==='ArrowDown'||k==='+'||k==='-')){const d=(k==='ArrowUp'||k==='+'?1:-1)*(e.shiftKey?10:1);pushUndo('life'+ui.sel);changeLife(ui.sel,d);e.preventDefault();return}
    if(ui.sel!=null&&/^[cma]$/i.test(k)&&!(k.toLowerCase()==='c'&&!isDmg())){const t={c:'cmd',m:'ctr',a:'fx'}[k.toLowerCase()];ui.ov[ui.sel]=ui.ov[ui.sel]===t?null:t;update();e.preventDefault();return}
    if(k==='f'||k==='F'){fullscreen();e.preventDefault();return}
    if(k===' '&&S.cfg.turns){e.preventDefault();if(!S.g.ended)stepTurn(1);return}
  }
  if(e.key==='Escape'){if(ui.sel!=null&&!ui.modal&&!Object.values(ui.ov).some(Boolean)){ui.sel=null;update();return}if(ui.modal)closeModal();else if(ui.assign){ui.assign=null;update()}else{ui.ov={};update()}}
  if((e.metaKey||e.ctrlKey)&&e.key==='z'&&S.phase==='game'&&!ui.modal){e.preventDefault();doUndo()}});

function show(){applySkin();const g=S.phase==='game'&&S.players.length;elSetup.hidden=!!g;elGame.hidden=!g;document.body.classList.toggle('ingame',!!g);
  if(g)buildGame();else{if(ro)ro.disconnect();renderSetup();window.scrollTo(0,0)}}
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$|pages\.dev$|netlify|vercel/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
show();
window.__tafel={get S(){return S},ui};
})();
</script>
