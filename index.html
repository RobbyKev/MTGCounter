<title>Life &amp; Lore</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=VT323&family=Press+Start+2P&family=Inter:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600;700&family=Great+Vibes&display=swap">
<style>
/* Layout: Spieltisch von oben – lange Seiten oben (180°) und unten, optional Kopfenden links (90°) und rechts (270°), Werkzeugleiste in der Mitte. Bewusst nur dunkles Thema. */
:root{
  --table:#101215; --ink:#e9e4d8; --muted:#9a968c; --brass:#c9a45c; --chip:#1c1f25; --line:#262a31; --danger:#e0543f;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,sans-serif;
  --f-title:"Cinzel",Georgia,serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--table)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{min-height:100%;background:var(--table);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body.ingame{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- Setup ---------- */
#setup{max-width:900px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.s-head h1{font-family:var(--f-title);font-size:clamp(28px,5vw,42px);letter-spacing:.04em;margin:0;color:var(--brass);text-wrap:balance}
.s-head p{margin:6px 0 0;color:var(--muted);max-width:62ch;line-height:1.5}
.s-head p.live{color:var(--ink);background:#1b1a14;border:1px solid #3a3221;padding:10px 12px;border-radius:10px}
.s-sec{display:grid;gap:10px}
.s-lab{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ch{min-width:52px;height:44px;padding:0 14px;border-radius:10px;background:var(--chip);font-family:var(--f-num);font-size:22px;font-weight:600}
.ch.txt{font-family:var(--f-ui);font-size:15px}
.ch[aria-pressed="true"]{background:var(--brass);color:#1a1408}
.num-in,.sel{height:44px;border-radius:10px;border:1px solid #2b2f37;background:#15171c;color:var(--ink)}
.num-in{width:84px;font-family:var(--f-num);font-size:22px;text-align:center}
.sel{padding:0 10px;font-size:16px;font-family:var(--f-ui);max-width:100%}
.s-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
@media (max-width:760px){.s-grid{grid-template-columns:1fr}}
.plist{display:grid;gap:10px}
.prow{display:grid;gap:10px;padding:12px;border-radius:12px;background:#16181d;border-left:6px solid var(--pc)}
.prow-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prow input[type=text]{flex:1 1 160px;min-width:0;height:44px;border-radius:9px;border:1px solid #2b2f37;background:#0f1114;color:var(--ink);padding:0 12px;font-size:17px;font-family:var(--f-ui)}
.seat{font-size:13px;color:var(--muted)}
.cmdin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.cmdin input{height:44px;border-radius:9px;border:1px solid #2b2f37;background:#0f1114;color:var(--ink);padding:0 12px;font-size:16px;font-family:var(--f-ui);min-width:0;width:100%}
.cprev{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-height:20px}
.cprev img{width:44px;height:32px;object-fit:cover;border-radius:5px}
.cprev b{color:var(--ink);font-weight:600}
.arch-list{display:grid;gap:8px}
.arch-item{display:grid;gap:4px;padding:10px 12px;border-radius:12px;background:#0f1013;font-size:14px}
.arch-item small{color:var(--muted)}
.sw-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.sw[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08)}
.prow-opts{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}
.mini{height:40px;padding:0 12px;border-radius:9px;background:var(--chip);font-size:14px;font-weight:600}
.tog{display:flex;gap:10px;align-items:center;font-size:15px;min-height:44px;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--brass);flex:none}
.map{position:sticky;top:12px;display:grid;gap:10px}
.map-box{aspect-ratio:4/3;max-width:100%;border-radius:12px;background:#0b0c0f;border:1px solid #23262d;padding:8px;display:flex;gap:6px}
.map-side{width:24%;display:flex}
.map-center{flex:1;display:grid;grid-template-rows:1fr 8px 1fr;gap:6px;min-width:0}
.map-row{display:flex;gap:6px;min-height:0}
.map-seat{flex:1;border-radius:6px;background:var(--bg);color:var(--fg);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:22px;min-width:0}
.map-seat span{display:inline-block;transform:rotate(var(--r))}
.map-mid{border-radius:3px;background:#1c1f25}
.map p,.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.go{height:56px;border-radius:12px;background:var(--brass);color:#1a1408;font-weight:600;font-size:18px;letter-spacing:.02em;padding:0 18px}
.go.sec{background:var(--chip);color:var(--ink)}
.go-row{display:flex;gap:10px;flex-wrap:wrap}
.go-row .go{flex:1 1 220px}

/* ---------- Start & Schritte ---------- */
.scr{display:grid;gap:18px}
.home{min-height:calc(100dvh - 80px);display:grid;align-content:center;justify-items:stretch;gap:14px;max-width:460px;width:100%;margin:0 auto}
.brand{text-align:center;display:grid;justify-items:center;gap:6px;margin-bottom:14px}
.brand .logo{width:92px;height:92px;border-radius:24px;background:#1f5384;color:#c9a45c;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:54px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.brand h1{margin:6px 0 0;font-family:var(--f-title);font-size:clamp(28px,6vw,40px);letter-spacing:.04em;color:var(--brass)}
.brand p{margin:0;color:var(--muted)}
.bigbtn{display:grid;gap:3px;text-align:left;padding:18px 20px;border-radius:16px;background:var(--chip);font-size:20px;font-weight:600}
.bigbtn small{font-size:14px;font-weight:400;color:var(--muted)}
.bigbtn.pri{background:var(--brass);color:#1a1408} .bigbtn.pri small{color:rgba(26,20,8,.7)}
.homerow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn.sm{font-size:16px;padding:14px;display:flex;align-items:center;gap:10px;justify-content:center;text-align:center}
.bigbtn.sm svg{width:20px;height:20px}
.ver{text-align:center;margin-top:10px}
.stephead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{height:44px;padding:0 14px;border-radius:10px;background:var(--chip);font-weight:600}
.steps{display:flex;align-items:center;gap:10px;margin-left:auto;color:var(--muted);font-size:14px;font-weight:600}
.stepdots{display:flex;gap:5px;font-style:normal}
.stepdots b{width:26px;height:6px;border-radius:3px;background:var(--chip)} .stepdots b.on{background:var(--brass)}
.sh2{margin:4px 0 0;font-family:var(--f-title);font-size:clamp(24px,4vw,32px);letter-spacing:.02em}
.tiles{display:grid;gap:10px}
.tiles.fmt{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tiles.cnt{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{display:grid;gap:4px;align-content:start;text-align:left;padding:16px;border-radius:16px;background:var(--chip);border:2px solid transparent;min-height:96px}

.sp{flex:1 0 6px}
.clock{flex:none;height:48px;border-radius:12px;font-family:var(--f-num);font-size:19px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 8px;display:inline-flex;align-items:center;gap:6px}

@container (max-width:1250px){.bb .t{display:none}.bb{padding:0 10px}}
@container (max-width:560px){.bb.turnb{max-width:170px;font-size:17px}.clock .ct{display:none}.clock{background:#1a1d22;padding:0 12px}}

.tb.star{font-size:13px;min-height:34px;padding:0 10px;gap:5px;flex:none}.tb.star svg{width:15px;height:15px}.tb.star.on{background:var(--brass);color:#1a1408}

.tv-join{background:rgba(201,164,92,.18);border:1px solid rgba(201,164,92,.5);border-radius:.5em;padding:.15em .6em;color:#f3e5ab}.tv-join b{letter-spacing:.15em;font-family:var(--f-num)}

.lookres h3{margin:0 0 2px;font-family:var(--f-title);font-size:22px}.lookres .ty{opacity:.75;font-style:italic;margin-bottom:8px}
.lookres .tx{white-space:pre-wrap;background:rgba(255,255,255,.06);padding:12px;border-radius:10px;line-height:1.45}
.lookres .en{opacity:.65;font-size:.92em;margin-top:6px;white-space:pre-wrap}
.legal{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.legal span{font-size:12px;padding:3px 8px;border-radius:99px;background:#2b3a2e;color:#a9e7b5}.legal span.no{background:#3a2626;color:#f0a8a8}
.rulings{margin-top:12px;display:grid;gap:8px}.rulings div{font-size:14px;line-height:1.4;padding:8px 10px;border-left:3px solid var(--brass);background:rgba(255,255,255,.04);border-radius:0 8px 8px 0}.rulings time{display:block;font-size:11px;opacity:.6}
.rulein{width:100%;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#15171c;color:inherit;padding:0 12px;font-size:16px;margin:4px 0 8px}
.rlist{margin-top:8px}.rk{display:inline-flex;align-items:center;gap:6px}.rk .ci{font-size:1.1em}.rk .ci svg{width:1em;height:1em}
.zoomov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);display:grid;place-items:center;opacity:0;transition:opacity .25s;cursor:zoom-out;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.zoomov.on{opacity:1}.zoomov img{max-width:92vw;max-height:86vh;border-radius:4.5%/3.3%;box-shadow:0 20px 70px rgba(0,0,0,.8);transform:scale(.85);transition:transform .3s cubic-bezier(.2,.8,.3,1.2)}
.zoomov.on img{transform:scale(1)}.zoomov span{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));color:rgba(255,255,255,.55);font-size:13px}
.rlab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin:6px 0 2px}
.rofc{margin-top:10px;padding-top:8px;border-top:1px solid rgba(201,164,92,.3)}.rofc q{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:17px;line-height:1.35;quotes:none}.rofc small{display:block;font-size:11px;opacity:.55;margin-top:4px}
.rulebox{margin-top:10px;padding:12px 14px;border-radius:12px;background:rgba(201,164,92,.12);border:1px solid rgba(201,164,92,.35);line-height:1.45}
.rulebox h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:17px}.rulebox .ci{font-size:1.3em}
@media (max-width:620px){.lookres{grid-template-columns:1fr}.lookres>img{max-width:260px;margin:0 auto}}
.lookimg{display:grid;gap:10px;align-content:start;min-width:0}
.lookimg>img{cursor:zoom-in;width:100%;border-radius:4.5%/3.3%;box-shadow:0 6px 24px rgba(0,0,0,.5);display:block}
.bigbtn.explainbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:12px 16px;font-size:18px;text-align:center}
.bigbtn.explainbtn svg{width:22px;height:22px;flex:none}
@media (max-width:620px){.lookimg>img{max-width:260px;margin:0 auto}}
.mbtn{min-height:52px;border-radius:12px;background:#22252c;padding:8px 16px;text-align:left;font-weight:600;font-size:16px;display:flex;align-items:center;gap:12px}
.mbtn svg{width:22px;height:22px;flex:none;color:var(--brass)}
.mbtn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.mbtn.warn{background:#3a1b16}
.mrow{display:flex;gap:8px;flex-wrap:wrap}
.mrow .mbtn{flex:1 1 200px}
.stepper{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper .sb{width:52px;height:52px;font-size:26px;background:#22252c}
.stepper b{font-family:var(--f-num);font-size:34px;min-width:50px;text-align:center}
.hist{display:grid;gap:0;font-size:14px}
.hist div{display:grid;grid-template-columns:48px 12px minmax(0,1fr);gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums}
.hist i{width:10px;height:10px;border-radius:50%;background:var(--dot)}
.tblwrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
table.t td.hot{color:#ffb4a6;font-weight:600}
table.t .dot{width:10px;height:10px;margin-right:6px;vertical-align:middle}
.winner{display:grid;gap:4px;padding:18px;border-radius:14px;background:radial-gradient(120% 140% at 50% 30%,var(--bg) 0%,var(--bg2) 100%);color:var(--fg);text-align:center}
.winner small{text-transform:uppercase;letter-spacing:.14em;font-size:12px;opacity:.85}
.winner b{font-family:var(--f-title);font-size:32px;letter-spacing:.04em}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{flex:1 1 120px;background:#0f1013;border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi b{font-family:var(--f-num);font-size:28px;font-variant-numeric:tabular-nums}
.chart{background:#0f1013;border-radius:12px;padding:10px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;background:var(--dot)}

.startp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;display:grid;gap:10px;justify-items:center;padding:18px;border-radius:22px;background:rgba(14,15,18,.92);border:1px solid #2f3239;box-shadow:0 20px 60px rgba(0,0,0,.6);width:min(440px,calc(100vw - 32px))}
.startp .big{width:100%;min-height:96px;border-radius:16px;background:var(--brass);color:#1a1408;font-weight:700;font-size:22px;display:grid;place-items:center;gap:4px;padding:10px;font-family:var(--f-title);letter-spacing:.03em;animation:pulse 2.2s ease-in-out infinite}
.startp .big .flip{transform:rotate(180deg);opacity:.75;font-size:.8em}
.startp .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.startp .row2 button{flex:1 1 120px;min-height:48px;border-radius:12px;background:#22252c;font-weight:600;font-size:15px;padding:0 10px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,164,92,.5)}50%{box-shadow:0 0 0 10px rgba(201,164,92,0)}}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;background:#000c;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;max-width:80vw}
#toast.on{opacity:1}
#toast.note{text-align:left;font-size:17px;line-height:1.35;padding:14px 22px;display:grid;gap:6px;border:1px solid rgba(201,164,92,.6);box-shadow:0 10px 40px rgba(0,0,0,.6)}
#toast.note b{color:#e8c46a}


/* ================= Design: Pergament & Foliant ================= */

  box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),inset 0 0 7cqmin rgba(255,255,255,.07)}

.ifront{transform:rotateY(180deg);background:#05060d}
.if-frame{position:absolute;inset:6.2% 7.2% 5%;display:flex;flex-direction:column;gap:calc(var(--w)*.016);font-size:calc(var(--w)*.045);color:#f3e5ab}
.if-title,.if-type{display:flex;align-items:center;justify-content:space-between;gap:.4em;padding:.28em .6em;border-radius:.45em;background:linear-gradient(180deg,#262a38,#0e1018);border:1.5px solid #d4af37;box-shadow:inset 0 0 .4em #000,0 0 0 1px #000,0 .15em .4em rgba(0,0,0,.8);color:#f3e5ab;text-shadow:0 1px 2px #000}
.if-title span:first-child{font-family:var(--f-title);font-weight:700;font-size:1.1em;letter-spacing:.01em;white-space:nowrap}
.if-cost{display:flex;gap:.12em}
.ipip{width:.82em;height:.82em;border-radius:50%;display:inline-block;box-shadow:0 1px 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.25)}
.ipip.W{background:#f8f1d8}.ipip.U{background:#a9d0ef}.ipip.B{background:#b9aeb4}.ipip.R{background:#f19c80}.ipip.G{background:#9bd3ae}
.ipms{font-size:.78em;box-shadow:0 1px 1px rgba(0,0,0,.6)}
.if-art{position:relative;flex:1.35;border-radius:46% 46% 3px 3px/24% 24% 3px 3px;overflow:hidden;background:#05060f;border:2px solid #d4af37;box-shadow:0 0 0 1px #000,0 .2em .6em rgba(0,0,0,.9),inset 0 0 1em rgba(0,0,0,.8)}

function layout(n,table){
  if(table==='upright'){const cols=n<=3?n:(n===4?2:3);const rows=[];for(let i=0;i<n;i+=cols)rows.push([...Array(Math.min(cols,n-i)).keys()].map(x=>x+i));return{upright:true,rows,top:[],bottom:[],left:null,right:null}}
  const heads=n>=4&&table==='head2'?2:(n>=3&&table!=='long'?1:0);
  const m=n-heads,t=Math.floor(m/2),b=m-t;
  const top=[...Array(t).keys()];let k=t;
  const right=heads===2?k++:null;
  const bottom=[];for(let i=0;i<b;i++)bottom.push(k++);
  const left=heads>=1?k++:null;
  return{top,bottom:bottom.reverse(),left,right};
}

const SF='https://api.scryfall.com';

const deMap={};
// Zwischenspeicher: gleiche Scryfall-Anfrage höchstens alle 30 Minuten (schont die API, die um Zurückhaltung bittet)
const sfMem=new Map();
function sfJSON(path){const hit=sfMem.get(path);if(hit&&Date.now()-hit.t<1800000)return hit.p;
  const p=fetch(SF+path).then(r=>r.ok?r.json():r.status===404?null:Promise.reject()).catch(()=>{sfMem.delete(path);return null});
  sfMem.set(path,{t:Date.now(),p});while(sfMem.size>300)sfMem.delete(sfMem.keys().next().value);return p}

const CKEY='ll-cards';let cardC=null;
function cardCache(){if(!cardC){try{cardC=JSON.parse(localStorage.getItem(CKEY))||{}}catch(e){cardC={}}}return cardC}
function cardGet(n){const c=cardCache()[n.toLowerCase()];return c&&c.d&&Date.now()-c.t<864e5?{...c.d}:null}
function cardPut(keys,d){const c=cardCache(),t=Date.now(),v=JSON.parse(JSON.stringify(d));keys.filter(Boolean).forEach(k=>c[k.toLowerCase().trim()]={t,d:v});
  const ks=Object.keys(c);if(ks.length>150)ks.sort((a,b)=>c[a].t-c[b].t).slice(0,ks.length-150).forEach(k=>delete c[k]);try{localStorage.setItem(CKEY,JSON.stringify(c))}catch(e){}}
async function sfCard(name){const k=String(name||'').trim();if(!k)return null;const h=cardGet(k);if(h)return h;const c=await sfCardNet(k);if(c)cardPut([k,c.name,c.nameDe],c);return c}
async function sfSearchDe(q){const j=await sfJSON('/cards/search?q='+encodeURIComponent(q+' lang:de')+'&unique=cards');return j&&j.data?j.data:[]}
function faceOf(c){return c.image_uris?c:(c.card_faces&&c.card_faces[0])||{}}
function cardText(c,key){if(c[key])return c[key];if(c.card_faces)return c.card_faces.map(f=>f[key]||'').filter(Boolean).join('\n—\n');return''}

  let c=await sfJSON('/cards/named?fuzzy='+encodeURIComponent(name));

    type:c.type_line||'',text:cardText(c,'oracle_text'),pt:c.power!=null?c.power+'/'+c.toughness:(face.power!=null?face.power+'/'+face.toughness:''),oracle:c.oracle_id||null,full:true,price:c.prices?{eur:c.prices.eur,eurf:c.prices.eur_foil,usd:c.prices.usd}:null,set:c.set_name||'',cm:(c.purchase_uris&&c.purchase_uris.cardmarket)||null,rul:c.rulings_uri||null,sfu:c.scryfall_uri||null,leg:c.legalities?{Commander:c.legalities.commander,Standard:c.legalities.standard,Pioneer:c.legalities.pioneer,Modern:c.legalities.modern,Brawl:c.legalities.brawl}:null};
  if(out.oracle){const j=await sfJSON('/cards/search?q='+encodeURIComponent('oracleid:'+out.oracle+' lang:de -is:promo')+'&unique=prints&order=released&dir=desc')||await sfJSON('/cards/search?q='+encodeURIComponent('oracleid:'+out.oracle+' lang:de')+'&unique=prints&order=released&dir=desc');
    const d=j&&j.data&&(j.data.find(y=>!/placeholder|missing/.test(y.image_status||''))||j.data[0]);if(d){const df=faceOf(d),diu=d.image_uris||df.image_uris||{};
      out.nameDe=d.printed_name||(d.card_faces?d.card_faces.map(f=>f.printed_name).filter(Boolean).join(' // '):'')||null;
      out.typeDe=d.printed_type_line||df.printed_type_line||'';out.textDe=cardText(d,'printed_text');out.imgDe=/placeholder|missing/.test(d.image_status||'')?null:(diu.normal||null)}}
  return out}

/* ---------- 3D-Würfel (eigene kleine Canvas-Engine, läuft offline) ---------- */
const DICE=(()=>{
  const PHI=(1+Math.sqrt(5))/2,V=(x,y,z)=>[x,y,z];
  const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
    cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],len=a=>Math.hypot(a[0],a[1],a[2]),nrm=a=>mul(a,1/len(a));

rliche Halbwüchsige"], "evoke": ["Du kannst diesen Zauberspruch für seine Herbeirufungskosten wirken. Falls du dies tust, wird die Kreatur geopfert, wenn sie ins Spiel kommt.", "Wehmut"], "dash": ["Du kannst diesen Zauberspruch für seine Sturmangriff-Kosten wirken. Falls du dies tust, erhält die Kreatur Eile und kehrt zu Beginn des nächsten Endsegments aus dem Spiel auf die Hand ihres Besitzers zurück.", "Flammenrausch-Reiter"], "a:blitz": ["Falls du diesen Zauberspruch für seine Blitz-Kosten wirkst, erhält er Eile und „Wenn diese Kreatur stirbt, ziehe eine Karte.\" Opfere diese Kreatur zu Beginn des nächsten Endsegments.", "Sabin, monumentaler Mönch"], "a:unearth": ["{7}: Bringe diese Karte aus deinem Friedhof ins Spiel zurück. Sie erhält Eile. Schicke sie zu Beginn des nächsten Endsegments, oder falls sie das Spiel verlassen würde, ins Exil. Spiele Exhumieren wie eine Hexerei.", "Tri-Sentinel, Akt der Rache"], "a:ninjutsu": ["{1}{R}, bringe einen ungeblockten Angreifer, den du kontrollierst, auf die Hand zurück: Bringe diese Karte aus deiner Hand getappt und angreifend ins Spiel.", "Yuffie, Materia-Jägerin"], "a:mutate": ["Falls du diesen Zauberspruch für seine Mutationskosten wirkst, lege ihn auf oder unter eine Nicht-Mensch-Kreatur deiner Wahl, die du besitzt. Sie mutieren zur oben liegenden Kreatur, die zusätzlich alle Fähigkeiten der darunter liegenden hat.", "Immerfeder-Phoenix"], "a:disguise": ["Du kannst diese Karte verdeckt für {3} als eine 2/2 Kreatur mit Abwehr {2} wirken. Decke sie zu einem beliebigen Zeitpunkt für ihre Verkleidungskosten auf.", "Bayek von Siwa"], "a:plot": ["Du kannst {1}{B}{G} bezahlen und diese Karte aus deiner Hand ins Exil schicken. Wirke sie in einem späteren Zug wie eine Hexerei, ohne ihre Manakosten zu bezahlen. Spiele Aushecken wie eine Hexerei.", "Schlammplünderung"], "a:bargain": ["Du kannst ein Artefakt, eine Verzauberung oder einen Spielstein opfern, sowie du diesen Zauberspruch wirkst.", "Buboh-Störenfried"], "a:offspring" function cardBrief(c){if(!c||!c.name)return'';return`${c.nameDe&&c.nameDe!==c.name?c.nameDe+' ('+c.name+')':c.name}${c.cost?' '+c.cost:''} — ${c.typeDe||c.type||''}${c.pt?' '+c.pt:''}\n${c.textDe||c.text||'(kein Text bekannt)'}`}

function applyLive(){if(!(S.g&&S.players.length))return;const st=S.setup;Object.assign(S.cfg,{cmdLife:st.cmdLife,sound:st.sound,sfx:st.sfx,turns:st.turns,table:st.table,clock:st.clock,art:st.art});

function readSetupInputs(){const st=S.setup;const cc=document.getElementById('customcmd');if(cc)st.customCmd=cc.checked;const mo=document.getElementById('matchopt');if(mo)st.match=mo.checked;for(let i=0;i<st.n;i++){const a=document.getElementById('pname'+i),b=document.getElementById('ppart'+i);if(a)st.players[i].name=a.value.trim()||('Spieler '+(i+1));if(b)st.players[i].partner=b.checked}
  const c=document.getElementById('cmdlife');if(c)st.cmdLife=c.checked;

  const ao=document.getElementById('artopt');if(ao)st.art=ao.checked;

  for(let i=0;i<st.n;i++)for(const k of[0,1]){const c=document.getElementById(`cmd${i}-${k}`);if(c){const v=c.value.trim();if(v!==st.players[i].cmdr[k]){st.players[i].cmdr[k]=v;if(!v)st.players[i].cdata[k]=null}}}
  const ar=document.getElementById('arch');if(ar)st.arch=+ar.value;

elSetup.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;readSetupInputs();const st=S.setup;
  switch(b.dataset.act){
    case'nav':if(b.dataset.to==='settings'&&ui.scr!=='settings'){ui.setBack=ui.scr||'home'}goScr(b.dataset.to);return;
    case'resume':applyLive();ui.back=null;ui.scr='home';S.phase='game';show();save();wake();try{LIVE.autoResume()}catch(e){}return;
    case'archive':ui.archConfirm=false;openModal('archive');return;
    case'ask':if(ui.chatCtx){ui.chat=[];ui.chatCtx=null}ui.askCard=null;openModal('ask');break;
    case'look':case'rules':openModal(b.dataset.act);return;
    case'watch':openModal('watchin');setTimeout(()=>{const i=document.getElementById('watchin');if(i)i.focus()},60);return;
    case'scan':openModal('look');SCAN.open();return;

    case'arcacc':st.arcAcc=b.dataset.v;applySkin();break;

    case'musskip':MUSIC.skip();setTimeout(()=>{if(ui.scr==='settings')renderSetup()},400);break;case'mussrc':S.setup.musSrc=b.dataset.v;if(b.dataset.v==='radio'&&!S.setup.music){S.setup.music=true}save();MUSIC.sync();renderSetup();break;case'radio':S.setup.radio=b.dataset.v;S.setup.musSrc='radio';S.setup.music=true;save();MUSIC.sync();renderSetup();break;
    case'sndtest':{ac();const k=b.dataset.k;if(k==='end')tone([[523,.16],[659,.16],[784,.16],[1047,.5]],true);else sfx(k,true);return}
    case'fmt':st.fmt=b.dataset.v;{const l=fmtLife(st.fmt,st.n);if(l)st.start=l}if(st.fmt!=='commander'&&st.fmt!=='custom')st.arch=-1;goScr('count');return;
    case'n':st.n=+b.dataset.v;{const l=fmtLife(st.fmt,st.n);if(l&&st.fmt==='brawl')st.start=l}if(st.table==='upright'){if(st.arch>=st.n)st.arch=-1;break}if(st.table==='head2'&&st.n<4)st.table=st.n>=3?'head1':'long';if(st.table==='head1'&&st.n<3)st.table='long';if(st.arch>=st.n)st.arch=-1;break;
    case'start':st.start=+b.dataset.v;document.getElementById('startcustom').value='';break;
    case'table':st.table=b.dataset.v;applyLive();break;

function applyEdits(){const st=S.setup;if(st.n!==S.players.length)return;
  S.players.forEach((p,i)=>{const s=st.players[i];if(p.name!==s.name)ev(p.name+' heißt jetzt '+s.name,i);p.name=s.name;p.color=s.color;p.partner=s.partner;p.rot=s.rot;p.cmdr=s.cmdr.slice();p.cdata=s.cdata.map(cmdObj)});
  Object.assign(S.cfg,{cmdLife:st.cmdLife,sound:st.sound,sfx:st.sfx,turns:st.turns,table:st.table,clock:st.clock,art:st.art});
  ui.back=null;ui.scr='home';S.phase='game';show();save();wake();toast('Übernommen')}
function startGame(){readSetupInputs();const st=S.setup;
  const fcmd=fmtCmdSetup(st),fdmg=fmtDmgSetup(st);if(st.n<3||!fcmd)st.arch=-1;
  S.cfg={fmt:st.fmt,cmd:fcmd,dmg:fdmg,start:st.start,cmdLife:st.cmdLife,sound:st.sound,sfx:st.sfx,turns:st.turns,table:st.table,arch:st.arch,clock:st.clock,art:st.art};
  S.players=st.players.slice(0,st.n).map((p,i)=>{const sl=st.arch>=0?(i===st.arch?40:20):st.start;
    return{id:i,name:p.name,color:p.color,partner:p.partner,rot:p.rot,cmdr:p.cmdr.slice(),cdata:p.cdata.map(cmdObj),custom:[],startLife:sl,life:sl,poison:0,energy:0,exp:0,rad:0,speed:0,ring:0,bless:false,timers:[],tax1:0,tax2:0,misc:0,cmd:{},elim:null,time:0}});
  S.players.forEach(p=>S.players.forEach(q=>{if(q.id!==p.id)p.cmd[q.id]=[0,0]}));
  S.match=(st.n===2&&st.match&&!fcmd)?{game:1,results:[]}:null;
  S.g=newG();S.hist=[];S.lifeLog=[];undo=[];undoDirty=true;ui.ov={};ui.fx={};ui.delta={};ui.roll={};ui.rollTop=new Set();
  logLives();ev(FORMATS[st.fmt].n+' · '+st.n+' Spieler'+(S.match?' · Match Best-of-3':'')+(st.arch>=0?' · Archenemy: '+S.players[st.arch].name:' · '+st.start+' Leben'));
  ui.startPrompt=true;ui.back=null;ui.scr='home';S.phase='game';show();save();wake();if(S.cfg.sound||S.cfg.sfx)ac()}
function cmdObj(c){return c?{...c}:null}
function cmdName(p,k){const c=p.cdata&&p.cdata[k];const n=(c&&(c.nameDe||c.name))||(p.cmdr&&p.cmdr[k])||'';return n?shortName(n):''}
const mWins=id=>S.match?S.match.results.filter(r=>r.winner===id).length:0;
const mOver=()=>!!S.match&&S.players.some(p=>mWins(p.id)>=2);
function lastLoser(){if(!S.match||!S.match.results.length)return null;const r=S.match.results[S.match.results.length-1];return r.winner==null?null:S.players.find(p=>p.id!==r.winner).id}
function newG(){return{paused:false,pausedAt:null,turn:1,active:null,first:null,monarch:null,initiative:null,dn:0,storm:0,planar:0,started:Date.now(),turnStart:null,ended:false,endedAt:null,winner:null}}
function restartSame(){pushUndo();if(S.match){if(mOver()){S.match={game:1,results:[]};ev('Neues Match')}else if(S.match.results.some(r=>r.game===S.match.game))S.match.game++}S.players.forEach(p=>{Object.assign(p,{life:p.startLife,poison:0,energy:0,exp:0,rad:0,speed:0,ring:0,bless:false,timers:[],tax1:0,tax2:0,misc:0,elim:null,time:0});(p.custom||[]).forEach(c=>c.v=0);for(const f in p.cmd)p.cmd[f]=[0,0]});
  S.g=newG();S.lifeLog=[];logLives();ev(S.match?'Spiel '+S.match.game+' von 3':'Neue Runde');ui.ov={};ui.fx={};ui.delta={};ui.startPrompt=true;closeModal();update();save()}

/* ---------- Gemeinsam spielen: alle Spielaktionen laufen über OPS ---------- */
// Ohne „Gemeinsam spielen“ und auf dem Startgerät wird direkt ausgeführt. Ein beigetretenes Handy schickt die Aktion als Änderung (Delta)
// ans Startgerät und zeigt einfache Zähländerungen sofort selbst an; der nächste Stand vom Startgerät gleicht das ab.
const vid=v=>Number.isInteger(v)&&P(v)?v:null,dn=(v,l)=>{v=Math.round(+v);return Number.isFinite(v)?Math.max(-l,Math.min(l,v)):0};
const OPS={
  life:(pid,d)=>{d=dn(d,9999);if(vid(pid)==null||!d)return;pushUndo('life'+pid);changeLife(pid,d)},
  cmd:(pid,from,k,d)=>{d=dn(d,999);if(vid(pid)==null||vid(from)==null||pid===from||!d)return;changeCmd(pid,from,k?1:0,d)},
  ctr:(pid,k,d)=>{d=dn(d,999);if(vid(pid)==null||!CTRS.some(c=>c.k===k)||!d)return;changeCtr(pid,k,d)},
  cust:(pid,i,d)=>{d=dn(d,999);const c=vid(pid)!=null&&P(pid).custom[i];if(!c||!d)return;const nv=Math.max(0,c.v+d);if(nv===c.v)return;pushUndo('cu'+pid+i);c.v=nv;addHist({pid,k:'ev',text:P(pid).name+': '+c.name+' → '+nv});update();save()},
  tmr:(pid,i,d)=>{d=dn(d,99);const t=vid(pid)!=null&&(P(pid).timers||[])[i];if(!t||!d)return;pushUndo('tm'+pid+i);if(t.m==='up')t.v=Math.max(1,Math.min(t.max,t.v+d));else t.v=Math.max(1,t.v+d);update();save()},
  fx:(pid,kind,o)=>{if(vid(pid)==null||!['dmg','drain','opp','alllose','allgain'].includes(kind)||!o||typeof o!=='object')return;const keepF=ui.fx[pid],keepO=ui.ov[pid];

function symImg(x,fb){const f=x.replace(/\//g,'').toUpperCase();return`<img class="msi" src="https://svgs.scryfall.io/card-symbols/${encodeURIComponent(f)}.svg" alt="{${esc(x)}}" onerror="this.hidden=true;this.nextElementSibling.hidden=false">${fb.replace('<i ','<i hidden ')}`}
function manaHTML(cost){if(!cost)return'';if(useSym())return cost.replace(/\{([^}]+)\}/g,(m,x)=>symImg(x,manaPip(x))).replace(/ \/\/ /g,' / ');return cost.replace(/\{([^}]+)\}/g,(m,x)=>manaPip(x)).replace(/ \/\/ /g,' / ')}
function manaPip(x){{
  if(/^[WUBRGC]$/.test(x))return`<i class="mp ${x}"></i>`;
  const h=x.split('/');if(h.length===2&&MSC[h[0]]&&MSC[h[1]])return`<i class="mp" style="background:linear-gradient(135deg,${MSC[h[0]]} 50%,${MSC[h[1]]} 50%)"></i>`;
  if(h.length===2&&h[1]==='P'&&MSC[h[0]])return`<i class="mp ${h[0]}">ϕ</i>`;
  return`<i class="mp">${esc(x)}</i>`}}
function manaInText(t){if(useSym())return t.replace(/\{([^}]+)\}/g,(m,x)=>symImg(x,x==='T'?'<i class="mp">↷</i>':manaPip(x)));return t.replace(/\{([^}]+)\}/g,(m,x)=>{const c=x.replace('/','');const cls=/^[WUBRGC]$/.test(c)?c:'';return`<i class="mp ${cls}">${x==='T'?'↷':x.replace('/','')}</i>`})}
function cmdrHTML(p){const out=[];if(!isCmd())return'';[0,1].forEach(k=>{if(k===1&&!p.partner)return;const n=cmdName(p,k);if(!n)return;const tax=p[k?'tax2':'tax1']||0;const c=p.cdata[k];
    const cost=c&&c.cmc!=null?c.cmc+tax*2:null;
    const mc=c&&c.cost?`<span class="mc">${manaHTML(c.cost)}</span>`:'';
    out.push(`<span class="cmdr" title="${esc(n)}" data-act="card" data-pid="${p.id}" data-k="${k}"><span class="cn">${esc(n)}</span>${mc}${tax?`<span class="tx">+${tax*2}</span>`:''}${tax&&cost!=null?`<span class="cost">= ${cost}</span>`:!mc&&cost!=null?`<span class="cost">${cost} Mana</span>`:''}</span>`)});
  return out.join('')}

  if(ui.assign){const what=ui.assign==='monarch'?'den Monarchen':'die Initiative';

  const mon=g.monarch!=null?P(g.monarch):null,ini=g.initiative!=null?P(g.initiative):null;

function update(){try{MUSIC.follow()}catch(e){}try{if(LIVE.local||LIVE.coopHost)LIVE.push()}catch(e){}if(S.phase!=='game'||!S.players.length)return;const cs=coopSeat();

    else if(sk==='arcane'){el.style.setProperty('--pc',c.bg);el.style.setProperty('--bg2','#0c0913');el.style.setProperty('--fg','#f3eefc')}
    else if(sk==='terminal'){const nf=mixHex(c.bg,'#ffffff',.45);el.style.setProperty('--fg',p.color==='B'?'#c9a6ff':p.color==='C'?'#cfe3ea':nf);el.style.setProperty('--bg2','#020a05')}
    else if(sk==='identity'){const ids=idColors(p);let g,glow;if(ids){const cs=ids.map(x=>ID_COL[x]);g=cs.length===1?`radial-gradient(120% 120% at 30% 25%,${mixHex(cs[0],'#ffffff',.18)},${cs[0]} 45%,${mixHex(cs[0],'#000000',.55)})`:`linear-gradient(125deg,${cs.map((x,i)=>x+' '+Math.round(i/(cs.length-1)*100)+'%').join(',')})`;glow=ID_GLOW[ids[0]]}else{g=`radial-gradient(120% 120% at 30% 25%,${c.bg},${c.bg2})`;glow='rgba(255,255,255,.3)'}
      el.style.setProperty('--idg',g);el.style.setProperty('--glow',glow);el.style.setProperty('--bg2',ids?mixHex(ID_COL[ids[0]],'#000000',.55):c.bg2);el.style.setProperty('--fg',ids&&ids.length===1&&ids[0]==='W'?'#fffaf0':'#f7f3ea')}
    else{el.style.setProperty('--bg2',c.bg2);el.style.setProperty('--fg',art&&sk==='classic'?'#f7f3ea':c.fg)}
    el.querySelector('.name').innerHTML=esc(p.name)+(sk==='identity'&&idColors(p)&&isCmd()?` <span class="pips">${idColors(p).map(x=>useSym()?symImg(x,`<i style="--c:${ID_COL[x]}"></i>`):`<i style="--c:${ID_COL[x]}"></i>`).join('')}</span>`:'');
    const inn=el.querySelector('.inner');inn.classList.toggle('art',!!art);el.classList.toggle('hasart',!!art);if(art)inn.style.setProperty('--art',`url("${art}")`);
    {const ids=S.setup.glow!==false&&sk!=='identity'&&isCmd()?idColors(p):null;el.classList.toggle('glowon',!!ids);
      if(ids){const cs=ids.map(x=>ID_LINE[x]);el.classList.toggle('glowmulti',cs.length>1);el.style.setProperty('--glg',cs.length===1?cs[0]:`linear-gradient(135deg,${cs.join(',')})`);el.style.setProperty('--glcols',cs.join(',')+','+cs[0]);el.style.setProperty('--glc',ID_GLOW[ids[0]])}}
    el.querySelector('.cmdrline').innerHTML=cmdrHTML(p);
    el.querySelector('.num').textContent=p.life;
    const b=[];if(S.cfg.turns&&S.g.active===p.id&&!S.g.ended)b.push(`<span class="badge turn">am Zug${S.cfg.clock?' <span class="ttime"></span>':''}</span>`);if(S.match&&mWins(p.id))b.push(`<span class="badge">${'●'.repeat(mWins(p.id))} ${mWins(p.id)===1?'1 Sieg':'2 Siege'}</span>`);
    el.querySelector('.badges').innerHTML=b.join('');
    el.querySelector('.pchips').innerHTML=chipsHTML(p);
    const dl=el.querySelector('.delta'),dv=ui.delta[p.id];dl.classList.toggle('on',!!(dv&&dv.v));if(dv)dl.textContent=(dv.v>0?'+':'−')+Math.abs(dv.v);
    el.querySelector('.deadov small').textContent=dr||'';
    const rv=ui.roll[p.id],rov=el.querySelector('.rollov');rov.classList.toggle('on',rv!=null);rov.classList.toggle('top',ui.rollTop.has(p.id));if(rv!=null)rov.querySelector('b').textContent=rv;
    const ov=el.querySelector('.ov');const t=cs!=null&&p.id!==cs?null:ui.ov[p.id];ov.classList.toggle('on',!!t);
    if(t&&ov.contains(document.activeElement)&&document.activeElement.tagName==='INPUT'){}
    else if(t){const sc=ov.querySelector('.rows')?.scrollTop||0;ov.innerHTML=ovHTML(p,t);const r=ov.querySelector('.rows');if(r)r.scrollTop=sc}else if(ov.innerHTML)ov.innerHTML='';
    const as=el.querySelector('.assignov');as.classList.toggle('on',!!ui.assign);as.textContent=ui.assign?'Hier tippen':'';
  });
  // Marken/Commander/Aktion eines kleinen Felds öffnen sich groß über dem eigenen Feld
  {const sh=document.getElementById('cosheet');if(sh){const sp=ui.coSheet,t=sp!=null&&ui.ov[sp];if(t&&P(sp)){const pel=elGame.querySelector(`.panel[data-pid="${sp}"]`),cs2=pel?getComputedStyle(pel):null;sh.classList.add('on');
      if(cs2)sh.style.cssText=`--bg:${cs2.getPropertyValue('--bg')};--bg2:${cs2.getPropertyValue('--bg2')};--fg:${cs2.getPropertyValue('--fg')}`;
      if(!(sh.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')){const sc=sh.querySelector('.rows')?.scrollTop||0;sh.innerHTML=`<div class="ov on">${ovHTML(P(sp),t)}</div>`;const r=sh.querySelector('.rows');if(r)r.scrollTop=sc}}
    else{sh.classList.remove('on');if(sh.innerHTML)sh.innerHTML='';if(sp!=null&&!ui.ov[sp])ui.coSheet=null}}}
  tickClock();
  let sp=document.getElementById('startp');
  if(ui.startPrompt&&!S.g.ended&&alive().length>1){if(!sp){sp=document.createElement('div');sp.id='startp';sp.className='startp';elGame.appendChild(sp)}
    const up=layout(S.players.length,S.cfg.table).upright;
    const ll=lastLoser();
    if(ll!=null&&!mOver()){sp.innerHTML=`<button class="big" data-act="sp-loser">${up?'':`<span class="flip">${esc(P(ll).name)} fängt an</span>`}<span>${esc(P(ll).name)} fängt an</span></button><div class="hint" style="text-align:center">Verlierer des letzten Spiels beginnt</div>
      <div class="row2"><button data-act="sp-pick">Auslosen</button><button data-act="sp-choose">Selbst wählen</button><button data-act="sp-skip">Überspringen</button></div>`}
    else sp.innerHTML=`<button class="big" data-act="sp-pick">${up?'':'<span class="flip">Startspieler auslosen</span>'}<span>Startspieler auslosen</span></button>
      <div class="row2"><button data-act="sp-roll">Alle würfeln W20</button><button data-act="sp-choose">Selbst wählen</button><button data-act="sp-skip">Überspringen</button></div>`}
  else if(sp)sp.remove();
  if(ui.modal==='hist'||ui.modal==='stats')renderModal()}

const nowG=()=>S.g.paused&&S.g.pausedAt?S.g.pausedAt:Date.now();
function tickClock(){if(!S.g||S.phase!=='game')return;const c=document.getElementById('clock');const end=S.g.ended?S.g.endedAt:nowG();
  if(c)c.innerHTML=(S.g.paused?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>')+'<span class="ct">'+fmtT(end-S.g.started)+'</span>';
  pauseUI()
  const tt=elGame.querySelector('.panel.active .ttime');if(tt&&S.g.turnStart)tt.textContent=fmtT(nowG()-S.g.turnStart)}
function pauseUI(){let o=document.getElementById('pauseov');const on=!!(S.g&&S.g.paused&&!S.g.ended&&S.phase==='game');document.body.classList.toggle('gpaused',on);
  if(on&&!o){o=document.createElement('button');o.id='pauseov';o.dataset.act='pause';o.innerHTML='<b>Pause</b><small>Uhr und Zugzeit angehalten · tippen zum Fortsetzen</small>';elGame.appendChild(o)}else if(!on&&o)o.remove()}
function togglePause(){const g=S.g;if(g.ended)return;const now=Date.now();
  if(g.paused){const d=now-(g.pausedAt||now);g.started+=d;if(g.turnStart)g.turnStart+=d;g.paused=false;g.pausedAt=null;0}
  else{g.paused=true;g.pausedAt=now;0}update();save();try{tickClock()}catch(e){}}
setInterval(tickClock,1000);

/* ---------- Eingabe: Tippen = 1 Schritt, Halten = schnell ---------- */
const presses=new Map();
elGame.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.half');
  if(h&&!ui.assign){e.preventDefault();const pid=+h.dataset.pid,d=+h.dataset.dir;h.classList.add('press');
    const st={el:h,held:false,tap:()=>doOp('life',pid,d)};
    st.t=setTimeout(()=>{st.held=true;doOp('life',pid,d*10);st.iv=setInterval(()=>doOp('life',pid,d*10),550)},450);
    presses.set(e.pointerId,st);try{h.setPointerCapture(e.pointerId)}catch(_){}return}
  const r=e.target.closest('[data-rep]');
  if(r){const act=()=>runAct(r);r.classList.add('press');const st={el:r,held:false,tap:act,n:0};
    st.t=setTimeout(()=>{st.held=true;const loop=()=>{runAct(r);st.n++;st.iv=setTimeout(loop,st.n>8?60:130)};loop()},420);
    presses.set(e.pointerId,st)}
});
function endPress(e,apply){const st=presses.get(e.pointerId);if(!st)return;clearTimeout(st.t);clearTimeout(st.iv);clearInterval(st.iv);st.el.classList.remove('press');presses.delete(e.pointerId);
  if(!st.held&&apply)st.tap()}
window.addEventListener('pointerup',e=>endPress(e,true));
window.addEventListener('pointercancel',e=>endPress(e,false));
elGame.addEventListener('contextmenu',e=>e.preventDefault());

function runAct(b){const a=b.dataset.act,pid=+b.dataset.pid,d=+b.dataset.d;
  if(a==='cmd')doOp('cmd',pid,+b.dataset.from,+b.dataset.k,d);
  else if(a==='ctr')doOp('ctr',pid,b.dataset.k,d);
  else if(a==='cust')doOp('cust',pid,+b.dataset.i,d);
  else if(a==='tmr')doOp('tmr',pid,+b.dataset.i,d);
  else if(a==='fxamt'){const f=fxState(pid);f.amt=Math.max(1,Math.min(999,f.amt+d));update()}}

elGame.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.hasAttribute('data-rep')||b.disabled)return;const a=b.dataset.act,pid=b.dataset.pid!=null?+b.dataset.pid:null;
  switch(a){
    case'card':{const k=+b.dataset.k;ui.cardK[pid]=k;ui.ov[pid]='card';update();const pl=P(pid),cd=pl.cdata&&pl.cdata[k];
      if(cd&&!cd.full&&!cd.offline){enrich(cd).then(n=>{if(n&&n!==cd){pl.cdata[k]=n;if(S.setup.players[pid]&&!isJoined())S.setup.players[pid].cdata[k]={...n};save();update()}})}
      else if(!cd&&pl.cmdr&&pl.cmdr[k]){sfCard(pl.cmdr[k]).then(n=>{if(n){pl.cdata[k]=n;save();update()}})}break}
    case'cardlang':ui.cardEn[pid]=!ui.cardEn[pid];update();break;
    case'ov':ui.ov[pid]=ui.ov[pid]===b.dataset.ov?null:b.dataset.ov;if(b.dataset.ov==='pad')ui.pad[pid]='';{const cs=coopSeat();if(cs!=null&&pid!==cs){if(ui.coSheet!=null&&ui.coSheet!==pid)ui.ov[ui.coSheet]=null;ui.coSheet=ui.ov[pid]?pid:null}}update();break;
    case'ovclose':ui.ov[pid]=null;if(ui.coSheet===pid)ui.coSheet=null;update();break;
    case'fxset':fxState(pid).amt=+b.dataset.v;update();break;
    case'fxtgt':{const f=fxState(pid),t=+b.dataset.t;f.target=f.target===t?null:t;update();break}
    case'fxcmd':fxState(pid).cmd=!fxState(pid).cmd;update();break;
    case'fxck':fxState(pid).ck=+b.dataset.k;update();break;
    case'fxlink':fxState(pid).link=!fxState(pid).link;update();break;
    case'fx':doOp('fx',pid,b.dataset.kind,{...fxState(pid)});if(isJoined()){ui.ov[pid]=null;if(ui.coSheet===pid)ui.coSheet=null;update()}break;
    case'padkey':{let v=ui.pad[pid]??'';const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(k==='±')v=v.startsWith('-')?v.slice(1):'-'+v;else if(v.replace('-','').length<4)v+=k;ui.pad[pid]=v;update();break}
    case'padok':{const v=parseInt(ui.pad[pid],10);ui.pad[pid]='';ui.ov[pid]=null;if(ui.coSheet===pid)ui.coSheet=null;if(!isNaN(v)&&v!==P(pid).life)doOp('life',pid,v-P(pid).life);else update();break}
    case'custadd':{const inp=document.getElementById('custin'+pid);const n=inp&&inp.value.trim();if(!n){inp&&inp.focus();break}inp.blur();doOp('custadd',pid,n);break}
    case'tmradd':{const inp=document.getElementById('tmrin'+pid),nm=inp?inp.value.trim():'';if(inp){inp.value='';inp.blur()}doOp('tmradd',pid,+b.dataset.i,nm);break}
    case'tmrdel':doOp('tmrdel',pid,+b.dataset.i);break;
    case'custdel':doOp('custdel',pid,+b.dataset.i);break;
    case'pause':doOp('pause');break;
    case'fs':fullscreen();break;
    case'rotp':{const p=P(pid);p.rot=(rotOf(p)+90)%360;S.setup.players[pid].rot=p.rot;relayout();update();save();break}
    case'undo':doOp('undo');break;
    case'next':if(S.g.ended)openModal('end');else doOp('next');break;
    case'prev':doOp('prev');break;
    case'monarch':case'initiative':ui.assign=a;update();break;
    case'desig':doOp('desig',pid,b.dataset.k);break;
    case'assign':{const k=ui.assign;ui.assign=null;update();doOp('assign',k,pid);break}
    case'assignnone':{const k=ui.assign;ui.assign=null;update();doOp('assign',k,null);break}
    case'assigncancel':if(ui.assign==='start')ui.startPrompt=true;ui.assign=null;update();break;
    case'sp-pick':doOp('sp','pick');break;
    case'sp-loser':doOp('sp','loser');break;
    case'sp-roll':doOp('sp','roll');break;
    case'sp-choose':ui.startPrompt=false;ui.assign='start';update();doOp('sp','off');break;
    case'sp-skip':ui.startPrompt=false;update();doOp('sp','off');break;
    case'dn':doOp('dn');break;
    case'ask':if(ui.chatCtx){ui.chat=[];ui.chatCtx=null}ui.askCard=null;openModal('ask');break;case'menu':case'tools':case'hist':case'stats':case'look':case'rules':openModal(a);if(a==='look')setTimeout(()=>{const i=document.getElementById('lookin');if(i&&!HASTOUCH)i.focus()},50);break;
  }});

/* ---------- Auswertung ---------- */
function playTime(p){let t=p.time||0;if(S.g.active===p.id&&S.g.turnStart&&!S.g.ended)t+=nowG()-S.g.turnStart;return t}
function cmdDealt(p){let s=0;S.players.forEach(q=>{if(q.id!==p.id){const a=q.cmd[p.id];s+=a[0]+a[1]}});return s}
function chartSVG(){const log=S.lifeLog.slice();if(!log.length)return'';
  const end=S.g.ended?S.g.endedAt:Date.now();log.push({t:end,l:S.players.map(p=>p.life)});
  const t0=log[0].t,t1=Math.max(end,t0+60000);let lo=0,hi=0;log.forEach(e=>e.l.forEach(v=>{if(v>hi)hi=v;if(v<lo)lo=v}));hi=Math.ceil(hi/10)*10||10;
  const W=560,H=220,pl=34,pr=10,pt=10,pb=24,x=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),y=v=>pt+(hi-v)/(hi-lo||1)*(H-pt-pb);
  const ticks=[];const step=hi>40?20:10;for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)ticks.push(v);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lebensverlauf">`;
  ticks.forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#5a4a3a':'#23262d'}" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" fill="#9a968c" font-size="11" text-anchor="end">${v}</text>`});

    <button class="mbtn coopbtn" data-act="coop">${I.users}<span>Gemeinsam spielen (jeder am eigenen Handy)${LIVE.coopHost?' · läuft':''}<small>Alle Handys zeigen dasselbe Spiel – jeder sieht sich selbst groß</small></span></button>

    <button class="mbtn" data-act="music">${I.music}<span>Musik ${S.setup.music?'ausschalten':'einschalten'}<small>Ruhige Hintergrundmusik passend zum Design · Lautstärke in den Einstellungen</small></span></button>
    <button class="mbtn" data-act="archive">${I.stats}<span>Archiv &amp; Bilanz<small>Alle beendeten Spiele auf diesem Gerät</small></span></button>
    <p class="hint">Rechte Hälfte tippen +1, linke Hälfte −1, halten in 10er-Schritten. In den Zähler-Feldern zählt Halten schnell hoch. „Zurück“ macht jede Aktion rückgängig.</p>
    ${HASTOUCH?'':`<p class="hint">Tastatur am Mac: <span class="kbd">1</span>–<span class="kbd">6</span> Spieler wählen · <span class="kbd">↑</span> <span class="kbd">↓</span> Leben ±1 (mit <span class="kbd">⇧</span> ±10) · <span class="kbd">C</span> Commander · <span class="kbd">M</span> Marken · <span class="kbd">A</span> Aktion · <span class="kbd">Leertaste</span> nächster Zug · <span class="kbd">⌘Z</span> zurück · <span class="kbd">F</span> Vollbild · <span class="kbd">Esc</span> schließen</p>`}`;
  else if(t==='tools'){const d=ui.die,pc=ui.planar;body=`<div class="card-h"><h2>Würfel &amp; Werkzeuge</h2>${X}</div>
    <div class="grp dicebox"><h4>Würfeln</h4><div class="dice">${[4,6,8,10,12,20].map(s=>`<button data-act="die" data-s="${s}" aria-pressed="${ui.dSides===s}">W${s}</button>`).join('')}<button data-act="die" data-s="coin" aria-pressed="${ui.dSides==='coin'}">Münze</button></div>
      <div class="dopts"><div class="stepper"><button class="sb" data-act="dcount" data-d="-1" aria-label="weniger Würfel">−</button><b>${ui.dCount||1}</b><button class="sb" data-act="dcount" data-d="1" aria-label="mehr Würfel">+</button><span class="hint">Würfel</span></div>
        <div class="chips-row">${Object.keys(DICE.COLS).map(k=>`<button class="dcol" style="background:${DICE.COLS[k][0]}" data-act="dcol" data-v="${k}" aria-pressed="${(S.setup.diceCol||'ivory')===k}" aria-label="Würfelfarbe"></button>`).join('')}</div></div>
      <canvas class="dicecv" id="dicecv" data-act="reroll" aria-label="Würfelfläche – antippen zum erneuten Würfeln"></canvas>
      <div class="diceres" id="diceres">${d?d.html:'<small>Würfel wählen – oder auf den Tisch tippen</small>'}</div></div>
    <div class="grp"><h4>Wer fängt an?</h4><div class="mrow">
      <button class="mbtn" data-act="startp">${I.next}<span>Startspieler auslosen<small>Läuft um den Tisch und bleibt stehen</small></span></button>
      <button class="mbtn" data-act="rollall">${I.dice}<span>Alle würfeln W20<small>Ergebnis auf jedem Feld</small></span></button></div></div>
    <div class="grp"><h4>Sturm-Zähler (dieser Zug)</h4><div class="stepper"><button class="sb" data-act="storm" data-d="-1" aria-label="weniger">−</button><b>${S.g.storm}</b><button class="sb" data-act="storm" data-d="1" aria-label="mehr">+</button><span class="hint">Geht beim nächsten Zug auf 0</span></div></div>
    <div class="grp"><h4>Planechase</h4><button class="mbtn" data-act="planar">${I.planar}<span>Planarwürfel werfen<small>Rollt oben auf dem Tisch · dieser Wurf kostet <b id="planarcost">${S.g.planar||0}</b> Mana · pro Zug +1</small></span></button></div>
    <div class="grp"><h4>Monarch, Initiative &amp; Tag/Nacht</h4><div class="mrow">
      <button class="mbtn" data-act="monarch">${ctrIcon('monarch')}<span>Monarch<small>${S.g.monarch!=null?esc(P(S.g.monarch).name):'niemand'} · Spieler antippen</small></span></button>
      <button class="mbtn" data-act="initiative">${ctrIcon('initiative')}<span>Initiative<small>${S.g.initiative!=null?esc(P(S.g.initiative).name):'niemand'} · Spieler antippen</small></span></button>
      <button class="mbtn" data-act="dn">${S.g.dn===2?ctrIcon('night'):ctrIcon('day')}<span>Tag / Nacht<small>${S.g.dn===1?'Tag':S.g.dn===2?'Nacht':'aus'} · antippen zum Wechseln</small></span></button></div></div>`}
  else if(t==='look'){const rr=S.setup.lookRecent||[],ru=ui.rule!=null?RULES[ui.rule]:null;body=`<div class="card-h"><h2>Karte nachschlagen</h2>${X}</div>
    <div class="grp"><div class="lookbar"><input type="search" id="lookin" list="dl-lookin" placeholder="Kartenname – deutsch oder englisch" autocomplete="off" enterkeyhint="search" value="${esc(ui.lookList?ui.lookList.q:'')}"><datalist id="dl-lookin"></datalist><button class="tb" data-act="lookgo">${I.search}<span class="tl">Suchen</span></button><button class="tb scanb" data-act="scan" aria-label="Scannen">${I.cam}<span class="tl">Scannen</span></button></div>
      ${rr.length?`<div class="chips-row" style="margin-top:8px">${rr.map(n=>`<button class="ch txt" data-act="lookpick" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}</div>
    <div id="lookres">${lookAreaHTML()}</div>
`}
  else if(t==='live'){body=LIVE.modalHTML(X)}
  else if(t==='coop'){body=LIVE.coopHTML(X)}
  else if(t==='watchin'){body=`<div class="card-h"><h2>Zuschauen</h2>${X}</div><p class="hint" style="font-size:15px">Code vom Spielgerät eingeben (Menü → Zuschauer &amp; TV):</p><div class="lookbar"><input id="watchin" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="z. B. K7M2QA" style="text-transform:uppercase;letter-spacing:.3em;font-size:22px"><button class="tb" data-act="watchgo">${I.tv} Verbinden</button></div><button class="mbtn" data-act="watchscan" style="margin-top:12px">${I.cam}<span>QR-Code scannen<small>Den QR-Code am Fernseher oder Spielgerät mit der Kamera erfassen</small></span></button>`}
  else if(t==='ask'){body=`<div class="card-h"><h2>KI-Regelhilfe</h2><button class="tb" id="askclear" data-act="askclear"${(ui.chat||[]).length?'':' hidden'}>Neu</button>${X}</div>
    ${ui.askCard?`<div class="askcard">${ui.askCard.img||ui.askCard.imgDe?`<img src="${esc(ui.askCard.imgDe||ui.askCard.img)}" alt="">`:''}<span>Frage zu <b>${esc(ui.askCard.nameDe||ui.askCard.name)}</b></span><button class="tb" data-act="askuncard" aria-label="Karte entfernen">${I.x}</button></div>`:''}
    <div class="chatlog" id="chatlog">${askLogHTML()}</div>
    <div class="chatin"><textarea id="askin" rows="2" placeholder="z. B. Darf ich [[Gegenzauber]] auf eine Fähigkeit wirken?" enterkeyhint="send"></textarea><button class="tb go2" id="asksend" data-act="asksend"${ui.askBusy?' disabled':''}>${I.next}</button></div>
    <div class="aiopts"><label class="tog small"><input type="checkbox" id="m-aigame" ${S.setup.aiGame!==false?'checked':''}> Spielstand mitschicken (Leben, Commander)</label><label class="tog small"><input type="checkbox" id="m-aianon" ${S.setup.aiAnon!==false?'checked':''}> Spielernamen anonymisieren („Spieler 1, 2 …“)</label></div>
    <p class="hint small">Kostenloser KI-Dienst (Pollinations.ai), ohne Konto. Gesendet werden deine Frage, die Kartentexte und – wenn oben eingeschaltet – der Spielstand. Antworten können falsch sein – im Zweifel gelten die offiziellen Regeln.</p>`}
  else if(t==='rules'){body=`<div class="card-h"><h2>Regeln</h2>${X}</div>
    <button class="mbtn" data-act="ask">${I.chat}<span>KI fragen<small>Regelfrage in eigenen Worten stellen – kostenlos, ohne Konto</small></span></button>
    <div class="grp"><h4>${RULES.length} Begriffe</h4>
      <input type="search" id="rulein" class="rulein" placeholder="Begriff suchen, z. B. Trampel, Fluch, Schatz" autocomplete="off" value="${esc(ui.ruleQ||'')}">
      <div class="chips-row rcats">${Object.entries(RCAT).map(([k,v])=>`<button class="ch txt" data-act="rcat" data-v="${k}" aria-pressed="${!ui.ruleQ&&(ui.rcat||'spiel')===k}">${v}</button>`).join('')}</div>
      <div id="rulelist">${ruleListHTML()}</div></div>`}
  else if(t==='hist'){body=`<div class="card-h"><h2>Verlauf</h2>${X}</div>
    <div class="hist">${S.hist.length?S.hist.slice().reverse().map(histLine).join(''):'<p class="hint">Noch keine Einträge.</p>'}</div>`}
  else if(t==='stats'){body=`<div class="card-h"><h2>Übersicht</h2>${X}</div>${statsHTML()}`}
  else if(t==='archive'){body=`<div class="card-h"><h2>Archiv</h2>${X}</div>${archiveHTML()}`}
  else if(t==='end'){const w=S.g.winner!=null?P(S.g.winner):null;const c=w?col(w):COLORS.C;body=`<div class="card-h"><h2>Spielende</h2>${X}</div>
    <div class="winner" style="--bg:${c.bg};--bg2:${c.bg2};--fg:${c.fg}"><small>${S.match?(mOver()?'Match gewonnen':'Spiel '+S.match.game+' gewonnen'):(w?'Gewonnen hat':'Ergebnis')}</small><b>${w?esc(w.name):'Unentschieden'}</b>${S.match?`<small>Stand ${S.players.map(p=>mWins(p.id)).join(' : ')}</small>`:''}${w&&cmdName(w,0)?`<small>mit ${esc([0,1].map(k=>cmdName(w,k)).filter(Boolean).join(' + '))}</small>`:''}</div>
    ${statsHTML()}
    <div class="mrow"><button class="mbtn" data-act="restart2">${I.reset}<span>${S.match?(mOver()?'Neues Match':'Spiel '+(S.match.game+1)+' starten'):'Neue Runde'}<small>${S.match&&!mOver()?'Gleiche Decks, Leben zurück auf '+S.cfg.start:'Gleiche Spieler'}</small></span></button><button class="mbtn" data-act="close">${I.undo}<span>Weiterspielen<small>Zum Korrigieren „Zurück“ nutzen</small></span></button></div>
    <button class="mbtn" data-act="share">${ICO_SH}<span>Ergebnis teilen<small>Bild mit Sieger, Platzierung und Lebensverlauf – z. B. für WhatsApp</small></span></button>`}
  const sc=elModal.querySelector('.card')?.scrollTop||0;
  elModal.innerHTML=`<div class="card" role="dialog" aria-modal="true">${body}</div>`;elModal.classList.add('on');elModal.querySelector('.card').scrollTop=sc}
elModal.addEventListener('click',e=>{if(e.target===elModal)return closeModal();const b=e.target.closest('[data-act]');if(!b)return;
  switch(b.dataset.act){
    case'close':closeModal();break;
    case'restart':if(ui.confirm==='restart'){closeModal();doOp('restart')}else{ui.confirm='restart';renderModal()}break;
    case'restart2':closeModal();doOp('restart');break;
    case'archive':ui.archConfirm=false;openModal('archive');break;
    case'skin':S.setup.skin=b.dataset.v;applySkin();update();renderModal();save();break;
    case'archfmt':ui.archFmt=b.dataset.v;renderModal();break;
    case'share':shareResult();break;
    case'archexp':archExport();break;
    case'archimp':archImport();break;
    case'archclear':if(ui.archConfirm){saveArch([]);ui.archConfirm=false;toast('Archiv geleert')}else ui.archConfirm=true;renderModal();break;
    case'settings':if(isJoined()){closeModal();ui.scr='settings';ui.back='game';S.phase='setup';show();break}
    case'setup':case'home':{closeModal();S.players.forEach((p,i)=>Object.assign(S.setup.players[i],{name:p.name,color:p.color,partner:p.partner,rot:p.rot}));S.setup.n=S.players.length;S.setup.table=S.cfg.table;if(S.cfg.fmt)S.setup.fmt=S.cfg.fmt;
      const a=b.dataset.act;ui.scr=a==='setup'?'players':a;ui.back=a==='home'?null:'game';S.phase='setup';show();save();break}
    case'fs':fullscreen();break;
    case'die':if(isJoined()){closeModal();doOp('roll',b.dataset.s,ui.dCount||1);break}rollDie3d(b.dataset.s==='coin'?'coin':+b.dataset.s);break;
    case'reroll':if(isJoined()){closeModal();doOp(ui.dSides==='planar'?'planar':'roll',ui.dSides||20,ui.dCount||1);break}if(ui.dSides==='planar')rollPlanar();else rollDie3d(ui.dSides||20);break;
    case'dcount':{ui.dCount=Math.max(1,Math.min(6,(ui.dCount||1)+ +b.dataset.d));const sb=b.parentElement.querySelector('b');if(sb)sb.textContent=ui.dCount;break}
    case'dcol':S.setup.diceCol=b.dataset.v;elModal.querySelectorAll('.dcol').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));save();if(ui.dSides)rollDie3d(ui.dSides);break;
    case'startp':closeModal();doOp('startp');break;
    case'rollall':closeModal();doOp('rollall');break;
    case'planar':if(isJoined()){closeModal();doOp('planar');break}rollPlanar();break;
    case'coop':openModal('coop');break;
    case'coopstart':LIVE.coopStart();break;
    case'coopstop':LIVE.coopStop();break;
    case'coopnew':LIVE.coopNewToken();break;
    case'coopseat':S.setup.coopSeat=+b.dataset.v;save();show();openModal('coop');LIVE.push(true);break;
    case'coopsnd':S.setup.coopSnd=S.setup.coopSnd==='mine'?'all':'mine';save();renderModal();break;
    case'coopleave':LIVE.coopLeave();break;
    case'live':openModal('live');break;
    case'livestart':LIVE.start();break;
    case'livestop':LIVE.stop();break;case'liveask':S.setup.liveAsk=!(S.setup.liveAsk!==false);save();renderModal();LIVE.push(true);break;case'livekick':LIVE.kick(b.dataset.cid);break;
    case'livelocal':LIVE.setLocal(true);break;
    case'watchscan':closeModal();LIVE.scanJoin();break;
    case'watchgo':{const v=document.getElementById('watchin').value;if(v.trim().length>=5)LIVE.watch(v);break}
    case'zoom':{const z=document.createElement('div');z.className='zoomov';const sm=b.getAttribute('src'),lg=sm.replace('/normal/','/large/');z.innerHTML=`<img src="${lg}" alt="" onerror="if(this.src!=='${sm}')this.src='${sm}'"><span>Antippen zum Schließen</span>`;z.addEventListener('click',()=>{z.classList.remove('on');setTimeout(()=>z.remove(),250)});document.body.appendChild(z);requestAnimationFrame(()=>z.classList.add('on'));break}
    case'lookgo':lookList(document.getElementById('lookin').value);break;
    case'lookitem':{const x=ui.lookList&&ui.lookList.items[+b.dataset.i];if(x)lookup(x.name,true);break}
    case'lookback':ui.look=null;{const bb=document.getElementById('lookres');if(bb)bb.innerHTML=lookAreaHTML()}break;
    case'lookstar':{const c=ui.look;if(!c||!c.name)break;const sv=S.setup.saved||(S.setup.saved=[]);const i=sv.findIndex(x=>x.n===c.name);if(i>=0)sv.splice(i,1);else sv.unshift({n:c.name,d:c.nameDe||'',i:c.imgDe||c.img||''});sv.length=Math.min(sv.length,60);save();const bb=document.getElementById('lookres');if(bb)bb.innerHTML=lookAreaHTML();toast(i>=0?'Nicht mehr gemerkt':'Gemerkt');break}
    case'scan':SCAN.open();break;
    case'lookpick':lookup(b.dataset.n);break;
    case'rule':ui.rule=ui.rule===+b.dataset.i?null:+b.dataset.i;{const rl=document.getElementById('rulelist');if(rl)rl.innerHTML=ruleListHTML()}break;
    case'ask':if(ui.chatCtx){ui.chat=[];ui.chatCtx=null}ui.askCard=null;openModal('ask');break;
    case'askcard':{const c=ui.look&&ui.look.name?ui.look:null;if((c&&c.name)!==ui.chatCtx){ui.chat=[];ui.chatCtx=c&&c.name}ui.askCard=c;openModal('ask');break}
    case'askexplain':{const c=ui.look&&ui.look.name?ui.look:null;if(!c)break;ui.chat=[];ui.chatCtx=c.name;ui.askCard=c;ui.askBusy=false;openModal('ask');
      askSend('Erkläre mir die Karte, einfach',explainPrompt(c));break}
    case'askuncard':ui.askCard=null;ui.chat=[];ui.chatCtx=null;renderModal();break;
    case'askclear':ui.chat=[];renderModal();break;
    case'asksend':{const i=document.getElementById('askin');if(i&&i.value.trim()){const v=i.value;i.value='';askSend(v)}break}
    case'askex':askSend(b.textContent);break;
    case'rcat':ui.rcat=b.dataset.v;ui.ruleQ='';ui.rule=null;{const ri=document.getElementById('rulein');if(ri)ri.value=''}elModal.querySelectorAll('.rcats .ch').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));{const rl=document.getElementById('rulelist');if(rl)rl.innerHTML=ruleListHTML()}break;
    case'music':S.setup.music=!S.setup.music;MUSIC.sync();save();renderModal();toast(S.setup.music?'Musik an':'Musik aus');break;
    case'monarch':case'initiative':closeModal();ui.assign=b.dataset.act;update();break;
    case'dn':doOp('dn');renderModal();break;
    case'storm':doOp('storm',+b.dataset.d);renderModal();break;
  }});
elModal.addEventListener('change',e=>{if(e.target.id==='m-aigame'){S.setup.aiGame=e.target.checked;save()}if(e.target.id==='m-aianon'){S.setup.aiAnon=e.target.checked;save()}if(e.target.id==='m-sfx'){S.cfg.sfx=S.setup.sfx=e.target.checked;if(e.target.checked){ac();sfx('heal')}save()}if(e.target.id==='m-turns'){S.cfg.turns=S.setup.turns=e.target.checked;update();save()}if(e.target.id==='m-clock'){S.cfg.clock=S.setup.clock=e.target.checked;update();save()}if(e.target.id==='m-art'){S.cfg.art=S.setup.art=e.target.checked;update();save()}if(e.target.id==='m-cmdlife'){S.cfg.cmdLife=S.setup.cmdLife=e.target.checked;save()}if(e.target.id==='m-sound'){S.cfg.sound=S.setup.sound=e.target.checked;if(e.target.checked)ac();save()}});
elModal.addEventListener('input',e=>{const t=e.target;if(t.id==='rulein'){ui.ruleQ=t.value;ui.rule=null;const rl=document.getElementById('rulelist');if(rl)rl.innerHTML=ruleListHTML();elModal.querySelectorAll('.rcats .ch').forEach(x=>x.setAttribute('aria-pressed',String(!ui.ruleQ&&x.dataset.v===(ui.rcat||'spiel'))));return}if(t.id!=='lookin')return;const dl=document.getElementById('dl-lookin');if(dl&&[...dl.options].some(o=>o.value===t.value)){lookup(t.value);t.blur();return}onCmdInput(t)});
elModal.addEventListener('keydown',e=>{if(e.target.id==='askin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=e.target.value;if(v.trim()){e.target.value='';askSend(v)}return}if(e.target.id==='watchin'&&e.key==='Enter'){e.preventDefault();LIVE.watch(e.target.value);return}if(e.target.id==='lookin'&&e.key==='Enter'){e.preventDefault();lookList(e.target.value);e.target.blur()}});
document.addEventListener('keydown',e=>{
  if(S.phase==='game'&&!ui.modal&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    const k=e.key;
    if(/^[1-6]$/.test(k)&&+k<=S.players.length){ui.sel=ui.sel===+k-1?null:+k-1;update();e.preventDefault();return}
    if(ui.sel!=null&&(k==='ArrowUp'||k==='ArrowDown'||k==='+'||k==='-')){const d=(k==='ArrowUp'||k==='+'?1:-1)*(e.shiftKey?10:1);doOp('life',ui.sel,d);e.preventDefault();return}
    if(ui.sel!=null&&/^[cma]$/i.test(k)&&!(k.toLowerCase()==='c'&&!isDmg())){const t={c:'cmd',m:'ctr',a:'fx'}[k.toLowerCase()];ui.ov[ui.sel]=ui.ov[ui.sel]===t?null:t;update();e.preventDefault();return}
    if(k==='f'||k==='F'){fullscreen();e.preventDefault();return}
    if(k===' '&&S.cfg.turns){e.preventDefault();if(!S.g.ended)doOp('next');return}
  }
  if(e.key==='Escape'){if(ui.sel!=null&&!ui.modal&&!Object.values(ui.ov).some(Boolean)){ui.sel=null;update();return}if(ui.modal)closeModal();else if(ui.assign){ui.assign=null;update()}else{ui.ov={};update()}}
  if((e.metaKey||e.ctrlKey)&&e.key==='z'&&S.phase==='game'&&!ui.modal){e.preventDefault();doOp('undo')}});

function show(){applySkin();const g=S.phase==='game'&&S.players.length;elSetup.hidden=!!g;elGame.hidden=!g;document.body.classList.toggle('ingame',!!g);
  if(g)buildGame();else{if(ro)ro.disconnect();renderSetup();window.scrollTo(0,0)}}
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$|pages\.dev$|netlify|vercel/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(S.phase!=='setup'||ui.scr!=='home'){S.phase='setup';ui.scr='home';ui.back=null;ui.modal=null}
show();
{const wm=location.search.match(/[?&]watch=([A-Za-z0-9]{4,6})/),jm=location.hash.match(/[#&]j=([0-9a-f]{16,64})/);if(wm){LIVE.watch(wm[1],jm&&jm[1])}else try{if(S.setup.intro!==false&&!/[?&]nointro/.test(location.search))INTRO.play()}catch(e){}}
window.__tafel={get S(){return S},ui,get MUSIC(){return MUSIC},get AC(){return AC}};
})();
</script>
