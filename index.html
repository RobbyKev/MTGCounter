<title>Commander-Tafel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Cinzel:wght@600;700&display=swap">
<style>
/* Layout: Spieltisch von oben – lange Seiten oben (180°) und unten, optional Kopfenden links (90°) und rechts (270°), Werkzeugleiste in der Mitte. Bewusst nur dunkles Thema. */
:root{
  --table:#101215; --ink:#e9e4d8; --muted:#9a968c; --brass:#c9a45c; --chip:#1c1f25; --line:#262a31; --danger:#e0543f;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,sans-serif;
  --f-title:"Cinzel",Georgia,serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--table)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{min-height:100%;background:var(--table);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body.ingame{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- Setup ---------- */
#setup{max-width:900px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.s-head h1{font-family:var(--f-title);font-size:clamp(28px,5vw,42px);letter-spacing:.04em;margin:0;color:var(--brass);text-wrap:balance}
.s-head p{margin:6px 0 0;color:var(--muted);max-width:62ch;line-height:1.5}
.s-head p.live{color:var(--ink);background:#1b1a14;border:1px solid #3a3221;padding:10px 12px;border-radius:10px}
.s-sec{display:grid;gap:10px}
.s-lab{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ch{min-width:52px;height:44px;padding:0 14px;border-radius:10px;background:var(--chip);font-family:var(--f-num);font-size:22px;font-weight:600}
.ch.txt{font-family:var(--f-ui);font-size:15px}
.ch[aria-pressed="true"]{background:var(--brass);color:#1a1408}
.num-in,.sel{height:44px;border-radius:10px;border:1px solid #2b2f37;background:#15171c;color:var(--ink)}
.num-in{width:84px;font-family:var(--f-num);font-size:22px;text-align:center}
.sel{padding:0 10px;font-size:16px;font-family:var(--f-ui);max-width:100%}
.s-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
@media (max-width:760px){.s-grid{grid-template-columns:1fr}}
.plist{display:grid;gap:10px}
.prow{display:grid;gap:10px;padding:12px;border-radius:12px;background:#16181d;border-left:6px solid var(--pc)}
.prow-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prow input[type=text]{flex:1 1 160px;min-width:0;height:44px;border-radius:9px;border:1px solid #2b2f37;background:#0f1114;color:var(--ink);padding:0 12px;font-size:17px;font-family:var(--f-ui)}
.seat{font-size:13px;color:var(--muted)}
.cmdin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.cmdin input{height:44px;border-radius:9px;border:1px solid #2b2f37;background:#0f1114;color:var(--ink);padding:0 12px;font-size:16px;font-family:var(--f-ui);min-width:0;width:100%}
.cprev{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-height:20px}
.cprev img{width:44px;height:32px;object-fit:cover;border-radius:5px}
.cprev b{color:var(--ink);font-weight:600}
.arch-list{display:grid;gap:8px}
.arch-item{display:grid;gap:4px;padding:10px 12px;border-radius:12px;background:#0f1013;font-size:14px}
.arch-item small{color:var(--muted)}
.sw-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.sw[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08)}
.prow-opts{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}
.mini{height:40px;padding:0 12px;border-radius:9px;background:var(--chip);font-size:14px;font-weight:600}
.tog{display:flex;gap:10px;align-items:center;font-size:15px;min-height:44px;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--brass);flex:none}
.map{position:sticky;top:12px;display:grid;gap:10px}
.map-box{aspect-ratio:4/3;max-width:100%;border-radius:12px;background:#0b0c0f;border:1px solid #23262d;padding:8px;display:flex;gap:6px}
.map-side{width:24%;display:flex}
.map-center{flex:1;display:grid;grid-template-rows:1fr 8px 1fr;gap:6px;min-width:0}
.map-row{display:flex;gap:6px;min-height:0}
.map-seat{flex:1;border-radius:6px;background:var(--bg);color:var(--fg);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:22px;min-width:0}
.map-seat span{display:inline-block;transform:rotate(var(--r))}
.map-mid{border-radius:3px;background:#1c1f25}
.map p,.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.go{height:56px;border-radius:12px;background:var(--brass);color:#1a1408;font-weight:600;font-size:18px;letter-spacing:.02em;padding:0 18px}
.go.sec{background:var(--chip);color:var(--ink)}
.go-row{display:flex;gap:10px;flex-wrap:wrap}
.go-row .go{flex:1 1 220px}

/* ---------- Spiel ---------- */
#game{position:fixed;inset:0;padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 6px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 6px);display:flex;gap:6px;background:var(--table);user-select:none;-webkit-user-select:none;overflow:hidden}
.side{width:23%;display:flex;min-width:0}
@media (orientation:portrait){.side{width:27%}}
.center{flex:1;min-width:0;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);gap:6px}
.row{display:flex;gap:6px;min-height:0}
.center.up{grid-template-rows:none}
.panel.kbsel{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(0,0,0,.5)}
.panel.kbsel.active{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--brass)}
.kbd{display:inline-block;min-width:22px;padding:1px 6px;border-radius:5px;background:#2a2d34;border:1px solid #3a3e47;font-size:12px;text-align:center;color:var(--ink)}
.tog small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.tog.top{align-items:flex-start}.tog.top input{margin-top:2px}
.panel{flex:1;min-width:0;position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 120% at 50% 45%,var(--bg) 0%,var(--bg2) 100%);color:var(--fg);transition:box-shadow .25s,filter .3s}
.inner{position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);container-type:size}
.panel.active{box-shadow:0 0 0 3px var(--brass),0 0 28px rgba(201,164,92,.35)}
.panel.pick{box-shadow:0 0 0 4px #fff,0 0 40px rgba(255,255,255,.5)}
.panel.dead{filter:grayscale(.85) brightness(.7)}
.panel.hasart{--fg:#f7f3ea}
.inner.art{background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.18) 38%,rgba(0,0,0,.25) 62%,rgba(0,0,0,.6) 100%),var(--art) center 30%/cover no-repeat}
.inner.art .num{text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.6)}
.inner.art .name,.inner.art .cmdr{text-shadow:0 1px 6px rgba(0,0,0,.8)}
.panel.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.half{position:absolute;top:0;bottom:0;width:50%;touch-action:none;display:flex;align-items:center;z-index:0;cursor:pointer}
.half.minus{left:0;justify-content:flex-start;padding-left:5cqmin}
.half.plus{right:0;justify-content:flex-end;padding-right:5cqmin}
.half span{font-family:var(--f-num);font-size:max(26px,13cqmin);font-weight:600;opacity:.28;transition:opacity .15s}
.half.press{background:rgba(255,255,255,.09)}
.half.press span{opacity:.75}

.head{position:absolute;top:0;left:0;right:0;padding:3.5cqmin 4cqmin 0;display:grid;justify-items:center;gap:1.6cqmin;pointer-events:none;z-index:1}
.nameline{display:flex;align-items:center;gap:2cqmin;max-width:100%;flex-wrap:wrap;justify-content:center}
.name{font-family:var(--f-title);font-weight:700;font-size:max(15px,6cqmin);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.badges{display:contents}
.badge{display:inline-flex;align-items:center;gap:1cqmin;height:max(22px,6.5cqmin);padding:0 2cqmin;border-radius:99px;background:rgba(0,0,0,.28);font-size:max(11px,3.6cqmin);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge svg{width:max(14px,4.2cqmin);height:max(14px,4.2cqmin)}
.badge.turn{background:var(--brass);color:#1a1408}
.cmdrline{display:flex;flex-wrap:wrap;justify-content:center;gap:1.4cqmin;pointer-events:auto;max-width:94%}
.cmdr{display:inline-flex;align-items:center;gap:1.4cqmin;height:max(26px,7.5cqmin);padding:0 2.4cqmin;border-radius:99px;background:rgba(0,0,0,.32);font-size:max(12px,3.8cqmin);font-weight:600;white-space:nowrap;max-width:100%;font-variant-numeric:tabular-nums}
.cmdr .cn{overflow:hidden;text-overflow:ellipsis;max-width:38cqw}
.cmdr .tx{opacity:.9}
.cmdr{cursor:pointer}
.cmdr .cost{padding:0 1.6cqmin;border-radius:99px;background:var(--fg);color:var(--bg2);font-weight:700}
.cardv{flex:1;min-height:0;display:flex;gap:3cqmin;align-items:stretch}
.cardv .ci{flex:none;height:100%;max-width:46%;display:flex;align-items:flex-start;justify-content:center}
.cardv .ci img{max-height:100%;max-width:100%;border-radius:4.5%/3.3%;box-shadow:0 6px 24px rgba(0,0,0,.5);display:block}
.cardv .ct{flex:1;min-width:0;overflow:auto;display:grid;gap:1.6cqmin;align-content:start;touch-action:pan-y;font-size:max(13px,3.8cqmin);line-height:1.4}
.cardv .ct h4{margin:0;font-family:var(--f-title);font-size:max(15px,5cqmin);letter-spacing:.02em}
.cardv .ct .ty{opacity:.8;font-style:italic}
.cardv .ct .tx{white-space:pre-wrap;background:rgba(0,0,0,.22);padding:2cqmin;border-radius:10px}
.cardv .ct .pt{font-family:var(--f-num);font-weight:700;font-size:max(18px,6cqmin)}
.cardv .ct .en{opacity:.7;font-size:.92em}
.ms{display:inline-grid;place-items:center;width:1.35em;height:1.35em;border-radius:50%;font-family:var(--f-num);font-weight:700;font-size:.85em;margin:0 .06em;color:#1a1a1a;background:#cfc7b8;vertical-align:-.15em;font-style:normal}
.ms.W{background:#f6f0d6}.ms.U{background:#a9d0ef}.ms.B{background:#b9aeb4}.ms.R{background:#f19c80}.ms.G{background:#9bd3ae}.ms.C{background:#d5d0cc}
@container (max-width:520px){.cardv{flex-direction:column}.cardv .ci{height:auto;max-height:52%;max-width:100%}.cardv .ci img{max-height:100%}}
.pchips{display:flex;flex-wrap:wrap;justify-content:center;gap:1.4cqmin;pointer-events:auto;max-width:92%}
.pchip{display:inline-flex;align-items:center;gap:1cqmin;height:max(24px,7cqmin);padding:0 2.2cqmin;border-radius:8px;background:rgba(0,0,0,.25);font-size:max(12px,3.8cqmin);font-weight:600;font-variant-numeric:tabular-nums}
.pchip i{width:max(9px,2.6cqmin);height:max(9px,2.6cqmin);border-radius:50%;background:var(--dot);box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.pchip.warn{background:var(--danger);color:#fff}

.life{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1;padding-top:6cqmin}
.num{font-family:var(--f-num);font-weight:700;font-size:min(44cqh,36cqw);line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.delta{position:absolute;top:calc(50% - min(22cqh,18cqw) - 3cqmin);left:50%;transform:translateX(-50%);font-family:var(--f-num);font-weight:700;font-size:max(18px,8cqmin);opacity:0;transition:opacity .2s;font-variant-numeric:tabular-nums;pointer-events:none;z-index:1}
.delta.on{opacity:.9}
.panel.dead .delta{display:none}

.pbtn{position:absolute;bottom:3.5cqmin;z-index:2;height:max(42px,12cqmin);padding:0 3cqmin;border-radius:12px;background:rgba(0,0,0,.24);display:inline-flex;align-items:center;gap:1.6cqmin;font-weight:600;font-size:max(13px,4cqmin)}
.pbtn svg{width:max(18px,5.5cqmin);height:max(18px,5.5cqmin);flex:none}
.pbtn.l{left:3.5cqmin}.pbtn.r{right:3.5cqmin}.pbtn.c{left:50%;transform:translateX(-50%)}
.pbtn:active{background:rgba(0,0,0,.4)}
@container (max-width:470px){.pbtn span{display:none}.pbtn{padding:0 2.6cqmin}}

.deadov{position:absolute;inset:0;z-index:3;display:none;place-content:center;text-align:center;gap:1cqmin;pointer-events:none;background:rgba(0,0,0,.35)}
.panel.dead .deadov{display:grid}
.deadov b{font-family:var(--f-title);font-size:max(18px,8cqmin);letter-spacing:.06em}
.deadov small{font-size:max(12px,4cqmin);opacity:.85}

.rollov{position:absolute;inset:0;z-index:4;display:none;place-content:center;text-align:center;pointer-events:none;background:rgba(0,0,0,.45)}
.rollov.on{display:grid}
.rollov b{font-family:var(--f-num);font-size:min(40cqh,30cqw);line-height:.9}
.rollov small{font-size:max(12px,4cqmin);letter-spacing:.1em;text-transform:uppercase}
.rollov.top b{color:var(--brass)}

.assignov{position:absolute;inset:0;z-index:7;display:none;place-content:center;text-align:center;background:rgba(0,0,0,.4);font-weight:600;font-size:max(16px,6cqmin);border:3px dashed rgba(255,255,255,.6);border-radius:16px}
.assignov.on{display:grid}

.ov{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;background:var(--bg2);padding:3cqmin;gap:2cqmin}
.ov.on{display:flex}
.ov-h{display:flex;align-items:center;gap:2cqmin}
.ov-h>div{flex:1;min-width:0}
.ov-h h3{margin:0;font-family:var(--f-title);font-size:max(15px,5cqmin);letter-spacing:.03em}
.ov-h p{margin:0;font-size:max(11px,3.2cqmin);opacity:.75}
.x{width:max(44px,11cqmin);height:max(44px,11cqmin);border-radius:12px;background:rgba(0,0,0,.28);display:grid;place-items:center;flex:none}
.x svg{width:55%;height:55%}
.rows{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr;gap:1.6cqmin;align-content:start;touch-action:pan-y;-webkit-overflow-scrolling:touch}
@container (min-width:520px){.rows{grid-template-columns:1fr 1fr}.rows .wide{grid-column:1/-1}}
@container (min-width:900px) and (max-height:320px){.rows{grid-template-columns:repeat(3,1fr)}}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:1.6cqmin;padding:1.4cqmin 2cqmin;border-radius:12px;background:rgba(0,0,0,.2)}
.r .lab{display:flex;align-items:center;gap:1.6cqmin;min-width:0;font-weight:600;font-size:max(13px,3.8cqmin)}
.r .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .lab small{display:block;font-weight:400;opacity:.75;font-size:max(11px,3cqmin)}
.r .lab i,.dot{flex:none;width:max(12px,3.4cqmin);height:max(12px,3.4cqmin);border-radius:50%;background:var(--dot);box-shadow:0 0 0 1px rgba(255,255,255,.5);display:inline-block}
.sb{width:max(44px,11cqmin);height:max(44px,11cqmin);border-radius:10px;background:rgba(255,255,255,.12);font-family:var(--f-num);font-size:max(22px,7cqmin);font-weight:700;line-height:1;touch-action:manipulation}
.sb:active,.sb.press{background:rgba(255,255,255,.3)}
.r .v{min-width:max(40px,10cqmin);text-align:center;font-family:var(--f-num);font-weight:700;font-size:max(24px,8cqmin);font-variant-numeric:tabular-nums}
.r .v.hot{color:#ffb4a6}
.fxsec{display:grid;gap:1.6cqmin;padding:2cqmin;border-radius:12px;background:rgba(0,0,0,.2);align-content:start}
.fxsec h4{margin:0;font-size:max(11px,3.2cqmin);text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.tg{display:flex;flex-wrap:wrap;gap:1.4cqmin}
.tb{min-height:max(40px,10cqmin);padding:0 2.6cqmin;border-radius:10px;background:rgba(255,255,255,.12);font-weight:600;font-size:max(13px,3.8cqmin);display:inline-flex;align-items:center;gap:1.4cqmin}
.tb[aria-pressed="true"]{background:var(--fg);color:var(--bg2)}
.tb.go2{background:var(--fg);color:var(--bg2);width:100%;justify-content:center}
.amt{display:flex;align-items:center;gap:2cqmin;flex-wrap:wrap}
.padv{font-family:var(--f-num);font-weight:700;font-size:max(36px,14cqmin);text-align:center;line-height:1;padding:1cqmin;border-radius:12px;background:rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.padg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqmin;flex:1;min-height:0}
.padg button{border-radius:12px;background:rgba(255,255,255,.12);font-family:var(--f-num);font-size:max(22px,7cqmin);font-weight:700;min-height:max(40px,9cqh)}
.padg button:active{background:rgba(255,255,255,.3)}
.padg .ok{background:var(--fg);color:var(--bg2)}
.addrow{display:flex;gap:1.6cqmin}
.addrow input{flex:1;min-width:0;height:max(44px,11cqmin);border-radius:10px;border:0;background:rgba(0,0,0,.3);color:var(--fg);padding:0 2.4cqmin;font-size:16px;font-family:var(--f-ui)}
.r .del{width:max(32px,8cqmin);height:max(32px,8cqmin);border-radius:8px;background:rgba(0,0,0,.25);display:grid;place-items:center}
.r .del svg{width:60%;height:60%}
.r.cust{grid-template-columns:minmax(0,1fr) auto auto auto auto}
@container (max-width:420px){
  .r,.r.cust{grid-template-columns:auto minmax(0,1fr) auto;row-gap:1cqmin}
  .r .lab{grid-column:1/-1}
  .r .lab span{white-space:normal}
  .r.cust .del{grid-column:1/-1;justify-self:end}
  .ov-h p{display:none}
}
.amt b{font-family:var(--f-num);font-size:max(30px,11cqmin);min-width:max(50px,14cqmin);text-align:center;font-variant-numeric:tabular-nums}

/* ---------- Leiste ---------- */
.barwrap{container-type:inline-size;min-width:0}
.bar{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;min-height:52px}
.bar::-webkit-scrollbar{display:none}
.bb{flex:none;height:48px;min-width:48px;padding:0 12px;border-radius:12px;background:#1a1d22;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.bb svg{width:20px;height:20px;flex:none}
.bb:active{background:#2a2e36}
.bb.on{background:var(--brass);color:#1a1408}
.bb.turnb{background:#22262d;font-family:var(--f-num);font-size:19px;letter-spacing:.02em;max-width:260px}
.bb.turnb span{overflow:hidden;text-overflow:ellipsis}
.sp{flex:1 0 6px}
.clock{flex:none;height:48px;border-radius:12px;font-family:var(--f-num);font-size:19px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 8px;display:inline-flex;align-items:center;gap:6px}
.clock.paused{color:var(--brass)}
.clock svg{width:16px;height:16px}
.banner{flex:1;display:flex;align-items:center;gap:10px;justify-content:center;font-weight:600;font-size:16px;color:var(--brass);white-space:nowrap}
.banner svg{width:20px;height:20px}
@container (max-width:980px){.bb .t{display:none}.bb{padding:0 10px}}
@container (max-width:560px){.bb.turnb{max-width:170px;font-size:17px}.clock{display:none}}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(0,0,0,.6);padding:16px}
#modal.on{display:grid}
.card{width:min(620px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#17191e;border:1px solid #2a2d34;border-radius:18px;padding:20px;display:grid;gap:16px;-webkit-overflow-scrolling:touch}
.card-h{display:flex;align-items:center;gap:12px}
.card-h h2{margin:0;flex:1;font-family:var(--f-title);font-size:22px;color:var(--brass);letter-spacing:.03em}
.card .x{width:44px;height:44px;background:#22252c}
.grp{display:grid;gap:8px}
.grp h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.dice{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.dice button{height:52px;border-radius:12px;background:#22252c;font-family:var(--f-num);font-size:21px;font-weight:600}
.dice button:active{background:#323641}
.dieout{min-height:96px;border-radius:14px;background:#0f1013;display:grid;place-content:center;text-align:center}
.dieout b{font-family:var(--f-num);font-size:60px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.dieout small{color:var(--muted);font-size:13px}
.mbtn{min-height:52px;border-radius:12px;background:#22252c;padding:8px 16px;text-align:left;font-weight:600;font-size:16px;display:flex;align-items:center;gap:12px}
.mbtn svg{width:22px;height:22px;flex:none;color:var(--brass)}
.mbtn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.mbtn.warn{background:#3a1b16}
.mrow{display:flex;gap:8px;flex-wrap:wrap}
.mrow .mbtn{flex:1 1 200px}
.stepper{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper .sb{width:52px;height:52px;font-size:26px;background:#22252c}
.stepper b{font-family:var(--f-num);font-size:34px;min-width:50px;text-align:center}
.hist{display:grid;gap:0;font-size:14px}
.hist div{display:grid;grid-template-columns:48px 12px minmax(0,1fr);gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums}
.hist i{width:10px;height:10px;border-radius:50%;background:var(--dot)}
.tblwrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
table.t td.hot{color:#ffb4a6;font-weight:600}
table.t .dot{width:10px;height:10px;margin-right:6px;vertical-align:middle}
.winner{display:grid;gap:4px;padding:18px;border-radius:14px;background:radial-gradient(120% 140% at 50% 30%,var(--bg) 0%,var(--bg2) 100%);color:var(--fg);text-align:center}
.winner small{text-transform:uppercase;letter-spacing:.14em;font-size:12px;opacity:.85}
.winner b{font-family:var(--f-title);font-size:32px;letter-spacing:.04em}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{flex:1 1 120px;background:#0f1013;border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi b{font-family:var(--f-num);font-size:28px;font-variant-numeric:tabular-nums}
.chart{background:#0f1013;border-radius:12px;padding:10px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;background:var(--dot)}

.startp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;display:grid;gap:10px;justify-items:center;padding:18px;border-radius:22px;background:rgba(14,15,18,.92);border:1px solid #2f3239;box-shadow:0 20px 60px rgba(0,0,0,.6);width:min(440px,calc(100vw - 32px))}
.startp .big{width:100%;min-height:96px;border-radius:16px;background:var(--brass);color:#1a1408;font-weight:700;font-size:22px;display:grid;place-items:center;gap:4px;padding:10px;font-family:var(--f-title);letter-spacing:.03em;animation:pulse 2.2s ease-in-out infinite}
.startp .big .flip{transform:rotate(180deg);opacity:.75;font-size:.8em}
.startp .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.startp .row2 button{flex:1 1 120px;min-height:48px;border-radius:12px;background:#22252c;font-weight:600;font-size:15px;padding:0 10px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,164,92,.5)}50%{box-shadow:0 0 0 10px rgba(201,164,92,0)}}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;background:#000c;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;max-width:80vw}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head><body>
<div id="setup" hidden></div>
<div id="game" hidden></div>
<div id="modal"></div>
<div id="toast" role="status"></div>

<script>
(()=>{
const KEY='commander-tafel-v2';
const COLORS={
  U:{n:'Blau',bg:'#1f5384',bg2:'#11314f',fg:'#ecf4fc'},
  R:{n:'Rot',bg:'#9a3221',bg2:'#5e190f',fg:'#fdece7'},
  G:{n:'Grün',bg:'#326838',bg2:'#1a3b1f',fg:'#eaf6eb'},
  W:{n:'Weiß',bg:'#ddd2b4',bg2:'#b3a581',fg:'#241e12'},
  B:{n:'Schwarz',bg:'#352c3e',bg2:'#16121a',fg:'#efe8f5'},
  M:{n:'Gold',bg:'#a07b22',bg2:'#5f4510',fg:'#fff7e0'},
  C:{n:'Farblos',bg:'#646b74',bg2:'#383d43',fg:'#f3f5f7'},
  P:{n:'Lila',bg:'#62438c',bg2:'#33214f',fg:'#f4edfc'}
};
const LINE={U:'#5aa0e6',R:'#ef6a4f',G:'#5fbf6a',W:'#efe4c4',B:'#a58fc0',M:'#e2b44a',C:'#a9b1ba',P:'#a77fe0'};
const CORDER=['U','R','G','W','B','M','C','P'];
const CTRS=[
  {k:'poison',n:'Gift',hint:'10 = ausgeschieden'},
  {k:'tax1',n:'Commander-Steuer',tax:true},
  {k:'tax2',n:'Steuer Partner',tax:true,partner:true},
  {k:'energy',n:'Energie'},
  {k:'exp',n:'Erfahrung'},
  {k:'rad',n:'Strahlung (Rad)'},
  {k:'misc',n:'Sonstige Marken'}
];
const TABLES={long:'Liegt: lange Seiten',head1:'Liegt: Kopfende links',head2:'Liegt: beide Kopfenden',upright:'Stehend'};
const FS_OK=!STANDALONE_EARLY()&&!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function STANDALONE_EARLY(){return!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches))}
const HASTOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const I={
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  dice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.5v15l11-7.5z"/><rect x="18" y="4.5" width="2.5" height="15" rx="1"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 4.5v15L7 12z"/><rect x="3.5" y="4.5" width="2.5" height="15" rx="1"/></svg>',
  crown:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5z"/></svg>',
  init:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 21V4h9l-1 3h6v9h-8l1-3H5"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
  dn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16"/><path d="m7 15 4-5 3 3 5-6"/></svg>',
  sword:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/></svg>',
  stack:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5M4 4v4.5h4.5"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.5c2.4 0 4 1.5 4.5 4"/></svg>',
  rot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.5M20 4v4.5h-4.5"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
  planar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5 21 12l-9 9.5L3 12z"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>'
};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const $=s=>document.querySelector(s);
const fmtT=ms=>{const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const elSetup=$('#setup'),elGame=$('#game'),elModal=$('#modal'),elToast=$('#toast');
const STANDALONE=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));

function fresh(){return{phase:'setup',setup:{n:4,start:40,cmdLife:true,sound:true,sfx:true,turns:true,clock:true,art:true,table:(('ontouchstart' in window)||navigator.maxTouchPoints>0)?'long':'upright',arch:-1,players:Array.from({length:6},(_,i)=>newSetupPlayer(i))},cfg:null,players:[],g:null,hist:[],lifeLog:[]}}
function newSetupPlayer(i){return{name:'Spieler '+(i+1),color:CORDER[i],partner:false,rot:null,cmdr:['',''],cdata:[null,null]}}
function migrate(s){const st=s.setup;if(st.sfx==null)st.sfx=true;if(st.turns==null)st.turns=true;if(s.cfg){if(s.cfg.sfx==null)s.cfg.sfx=true;if(s.cfg.turns==null)s.cfg.turns=true}if(st.clock==null)st.clock=true;if(st.art==null)st.art=true;
  st.players.forEach((p,i)=>{if(!p.cmdr)p.cmdr=['',''];if(!p.cdata)p.cdata=[null,null]});
  if(s.cfg){if(s.cfg.clock==null)s.cfg.clock=true;if(s.cfg.art==null)s.cfg.art=true}
  (s.players||[]).forEach(p=>{if(!p.cmdr)p.cmdr=['',''];if(!p.cdata)p.cdata=[null,null];if(!p.custom)p.custom=[]});
  if(s.g&&s.g.paused==null)s.g.paused=false;return s}
const AKEY='commander-tafel-archiv';
function loadArch(){try{return JSON.parse(localStorage.getItem(AKEY))||[]}catch(e){return[]}}
function saveArch(a){try{localStorage.setItem(AKEY,JSON.stringify(a))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.setup)return s}catch(e){}return null}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}

let S=migrate(load()||fresh());
const ui={startPrompt:false,cardK:{},cardEn:{},pad:{},archConfirm:false,ov:{},fx:{},delta:{},assign:null,modal:null,roll:{},rollTop:new Set(),pick:null,die:null,planar:null,confirm:null,shake:{}};
let undo=[],undoKey=null,undoT=0;
let wl=null;

/* ---------- Tischlayout ---------- */
function layout(n,table){
  if(table==='upright'){const cols=n<=3?n:(n===4?2:3);const rows=[];for(let i=0;i<n;i+=cols)rows.push([...Array(Math.min(cols,n-i)).keys()].map(x=>x+i));return{upright:true,rows,top:[],bottom:[],left:null,right:null}}
  const heads=n>=4&&table==='head2'?2:(n>=3&&table!=='long'?1:0);
  const m=n-heads,t=Math.floor(m/2),b=m-t;
  const top=[...Array(t).keys()];let k=t;
  const right=heads===2?k++:null;
  const bottom=[];for(let i=0;i<b;i++)bottom.push(k++);
  const left=heads>=1?k++:null;
  return{top,bottom:bottom.reverse(),left,right};
}
function autoRot(id,L){if(L.top.includes(id))return 180;if(id===L.left)return 90;if(id===L.right)return 270;return 0}
function rotOf(p){return p.rot!=null?p.rot:autoRot(p.id,layout(S.players.length,S.cfg.table))}
function seatLabel(i,n,table){const L=layout(n,table);
  if(L.upright){const r=L.rows.findIndex(x=>x.includes(i));return(L.rows.length>1?(r?'unten ':'oben '):'')+(L.rows[r].length===1?'':['links','Mitte','rechts'][L.rows[r].length===2?L.rows[r].indexOf(i)*2:L.rows[r].indexOf(i)])}
  if(i===L.left)return'Kopfende links';if(i===L.right)return'Kopfende rechts';
  const row=L.top.includes(i)?L.top:L.bottom,pos=row.indexOf(i),side=L.top.includes(i)?'oben':'unten';
  const names=row.length===1?['']:row.length===2?['links','rechts']:['links','Mitte','rechts'];return(side+' '+names[pos]).trim()}

/* ---------- Hilfen ---------- */
const P=id=>S.players[id];
const col=p=>COLORS[p.color]||COLORS.C;
function deadReason(p){
  if(p.life<=0)return'0 Lebenspunkte';
  if(p.poison>=10)return'10 Giftmarken';
  for(const f in p.cmd){const a=p.cmd[f];for(let k=0;k<a.length;k++)if(a[k]>=21)return'21 Commander-Schaden von '+(P(+f)?P(+f).name:'?');}
  return null;
}
const alive=()=>S.players.filter(p=>!deadReason(p)).map(p=>p.id);
function pushUndo(key){const now=Date.now();if(key&&key===undoKey&&now-undoT<1500){undoT=now;return}undoKey=key||null;undoT=now;
  undo.push(JSON.stringify({players:S.players,g:S.g,hist:S.hist,lifeLog:S.lifeLog}));if(undo.length>200)undo.shift()}
function doUndo(){const s=undo.pop();undoKey=null;if(!s){toast('Nichts zum Rückgängigmachen');return}const o=JSON.parse(s);S.players=o.players;S.g=o.g;S.hist=o.hist;S.lifeLog=o.lifeLog||[];ui.delta={};
  if(!S.g.ended)unarchive();else archiveGame();
  if(ui.modal==='end'&&!S.g.ended)closeModal();relayout();update();save();toast('Rückgängig')}
function addHist(e){e.t=Date.now();const l=S.hist[S.hist.length-1];
  if(e.k!=='ev'&&l&&l.pid===e.pid&&l.k===e.k&&l.sub===e.sub&&e.t-l.t<4000){l.d+=e.d;l.res=e.res;l.t=e.t;if(l.d===0)S.hist.pop()}
  else S.hist.push(e);
  if(S.hist.length>800)S.hist.splice(0,S.hist.length-800)}
function ev(text,pid){addHist({k:'ev',text,pid:pid??null})}
function logLives(){const now=Date.now(),l=S.lifeLog[S.lifeLog.length-1],lives=S.players.map(p=>p.life);
  if(l&&now-l.t<1500&&S.lifeLog.length>1)l.l=lives;else S.lifeLog.push({t:now,l:lives});
  if(S.lifeLog.length>3000)S.lifeLog.splice(1,S.lifeLog.length-3000)}
let toastT;function toast(t){elToast.textContent=t;elToast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>elToast.classList.remove('on'),1300)}
function bumpDelta(pid,d){const o=ui.delta[pid]||(ui.delta[pid]={v:0});o.v+=d;clearTimeout(o.t);o.t=setTimeout(()=>{delete ui.delta[pid];update()},2200)}

/* ---------- Ton ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(seq){if(!S.cfg||!S.cfg.sound)return;const a=ac();if(!a)return;let t=a.currentTime+.02;
  seq.forEach(([f,d,type,v])=>{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.16,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);t+=d*.75})}
window.addEventListener('pointerdown',()=>{if(S.cfg&&(S.cfg.sound||S.cfg.sfx))ac()},{once:true,capture:true});
let sfxT=0;
function noise(a,t,dur,vol,freq){const n=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const src=a.createBufferSource();src.buffer=n;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);src.connect(f);f.connect(g);g.connect(a.destination);src.start(t)}
function osc(a,t,type,f0,f1,dur,vol){const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function sfx(kind){if(!S.cfg||!S.cfg.sfx)return;const now=performance.now();if(now-sfxT<90)return;sfxT=now;const a=ac();if(!a)return;const t=a.currentTime+.01;
  if(kind==='dmg'){osc(a,t,'sine',150,55,.18,.35);noise(a,t,.09,.25,900)}
  else if(kind==='big'){osc(a,t,'sine',120,40,.35,.45);noise(a,t,.2,.35,700)}
  else if(kind==='heal'){osc(a,t,'sine',660,null,.16,.12);osc(a,t+.08,'sine',990,null,.22,.1)}
  else if(kind==='cmd'){osc(a,t,'square',420,180,.12,.06);osc(a,t,'triangle',1250,900,.25,.08);noise(a,t,.06,.2,4000)}
  else if(kind==='poison'){osc(a,t,'sine',260,620,.09,.14);osc(a,t+.1,'sine',320,760,.09,.12)}
  else if(kind==='turn'){osc(a,t,'triangle',880,null,.06,.07);osc(a,t+.07,'triangle',1320,null,.09,.06)}}

/* ---------- Auswerten nach jeder Änderung ---------- */
function afterChange(by){
  logLives();
  S.players.forEach(p=>{const dr=deadReason(p);
    if(dr&&!p.elim){p.elim={t:Date.now(),turn:S.g.turn,by:by??null,reason:dr};ev(p.name+' ist ausgeschieden ('+dr+')',p.id);
      ui.shake[p.id]=1;setTimeout(()=>{delete ui.shake[p.id];update()},600);tone([[220,.25,'triangle'],[165,.3,'triangle'],[110,.6,'triangle']])}
    else if(!dr&&p.elim){p.elim=null}});
  const al=alive();
  if(S.players.length>1&&al.length<=1&&!S.g.ended){
    const now=Date.now();if(S.g.active!=null&&S.g.turnStart){P(S.g.active).time+=now-S.g.turnStart}S.g.turnStart=null;
    S.g.ended=true;S.g.endedAt=now;S.g.winner=al.length?al[0]:null;archiveGame();ev(al.length?P(al[0]).name+' gewinnt':'Alle ausgeschieden – unentschieden');
    tone([[523,.16],[659,.16],[784,.16],[1047,.5]]);setTimeout(()=>openModal('end'),650)}
  else if(al.length>1&&S.g.ended){S.g.ended=false;S.g.endedAt=null;S.g.winner=null;S.g.turnStart=Date.now();unarchive()}
}
function archiveGame(){const g=S.g;const id='g'+g.started;const a=loadArch().filter(x=>x.id!==id);
  const order=S.players.slice().sort((x,y)=>(y.elim?y.elim.t:Infinity)-(x.elim?x.elim.t:Infinity));
  a.push({id,date:g.started,dur:g.endedAt-g.started,turns:g.turn,winner:g.winner!=null?P(g.winner).name:null,
    players:S.players.map(p=>({name:p.name,cmdr:[0,1].map(k=>cmdName(p,k)).filter(Boolean).join(' + '),color:p.color,place:order.indexOf(p)+1,by:p.elim&&p.elim.by!=null&&P(p.elim.by)?P(p.elim.by).name:null}))});
  saveArch(a.slice(-500))}

/* ---------- Aktionen ---------- */
function changeLife(pid,d){const p=P(pid);p.life+=d;sfx(d<=-10?'big':d<0?'dmg':'heal');bumpDelta(pid,d);addHist({pid,k:'life',d,res:p.life});afterChange(null);update();save()}
function changeCmd(pid,from,k,d){const p=P(pid);const a=p.cmd[from];const nv=Math.max(0,a[k]+d);const real=nv-a[k];if(!real)return;pushUndo('cmd'+pid+from+k);a[k]=nv;
  addHist({pid,k:'cmd',sub:from+'-'+k,from,ck:k,d:real,res:nv});
  if(S.cfg.cmdLife){p.life-=real;bumpDelta(pid,-real)}
  if(real>0)sfx('cmd');
  afterChange(from);update();save()}
function changeCtr(pid,key,d){const p=P(pid);const nv=Math.max(0,(p[key]||0)+d);const real=nv-(p[key]||0);if(!real)return;pushUndo('ctr'+pid+key);p[key]=nv;addHist({pid,k:key,d:real,res:nv});
  if(key==='poison'){if(real>0)sfx('poison');afterChange(null)}update();save()}

function fxState(pid){return ui.fx[pid]||(ui.fx[pid]={amt:1,target:null,cmd:false,ck:0,link:false})}
function runFx(pid,kind){const me=P(pid),f=fxState(pid),x=f.amt;const opp=alive().filter(i=>i!==pid);pushUndo();
  const hit=(id,d)=>{const q=P(id);q.life+=d;bumpDelta(id,d);addHist({pid:id,k:'life',sub:'fx',d,res:q.life})};
  let msg='';
  if(kind==='dmg'){const t=f.target;if(t==null||!P(t))return;hit(t,-x);
    if(f.cmd){const k=me.partner?f.ck:0;P(t).cmd[pid][k]+=x;addHist({pid:t,k:'cmd',sub:pid+'-'+k,from:pid,ck:k,d:x,res:P(t).cmd[pid][k]})}
    if(f.link)hit(pid,x);
    msg=`${me.name}: ${x} ${f.cmd?'Commander-':''}Schaden an ${P(t).name}${f.link?', +'+x+' Leben (Lebensverknüpfung)':''}`}
  else if(kind==='drain'){opp.forEach(i=>hit(i,-x));if(opp.length)hit(pid,x*opp.length);msg=`${me.name}: jeder Gegner verliert ${x}, ${me.name} erhält ${x*opp.length}`}
  else if(kind==='opp'){opp.forEach(i=>hit(i,-x));msg=`${me.name}: jeder Gegner verliert ${x}`}
  else if(kind==='alllose'){alive().forEach(i=>hit(i,-x));msg=`${me.name}: alle Spieler verlieren ${x}`}
  else if(kind==='allgain'){alive().forEach(i=>hit(i,x));msg=`${me.name}: alle Spieler erhalten ${x}`}
  sfx(kind==='allgain'?'heal':(kind==='dmg'&&f.cmd)?'cmd':x>=10?'big':'dmg');
  ev(msg,pid);afterChange(pid);ui.ov[pid]=null;update();save();toast(msg)}

function setActive(nx){const g=S.g,now=nowG();if(g.active!=null&&g.turnStart&&!g.ended){P(g.active).time+=now-g.turnStart}g.active=nx;g.turnStart=g.ended?null:now;g.storm=0;g.planar=0}
function stepTurn(dir){pushUndo();const g=S.g,n=S.players.length,ord=[...Array(n).keys()];
  if(!alive().length)return;
  if(g.active==null){const a=alive()[0];setActive(a);g.first=a;g.turn=1;ev('Zug 1 – '+P(a).name+' beginnt',a);update();save();return}
  const first=g.first??g.active,rel=i=>(i-first+n)%n,cur=g.active;let nx=null;
  for(let s=1;s<=n;s++){const c=(cur+dir*s+n*n)%n;if(!deadReason(P(c))){nx=c;break}}
  if(nx==null)return;
  if(dir>0&&rel(nx)<=rel(cur))g.turn++;
  if(dir<0&&rel(nx)>=rel(cur))g.turn=Math.max(1,g.turn-1);
  sfx('turn');setActive(nx);ev((dir>0?'Zug ':'Zurück zu Zug ')+g.turn+' – '+P(nx).name,nx);update();save()}

function pickStart(){closeModal();ui.startPrompt=false;const order=alive();if(order.length<2){update();return}pushUndo();
  const steps=order.length*3+rnd(order.length);let i=0,delay=70;
  const step=()=>{ui.pick=order[i%order.length];update();if(S.cfg.sound)tone([[880,.04,'square',.04]]);i++;
    if(i<steps){delay=Math.min(delay*1.1,320);setTimeout(step,delay)}
    else{const w=order[(steps-1)%order.length];setTimeout(()=>{setStarter(w,'ausgelost');if(S.cfg.turns)ui.pick=null;else setTimeout(()=>{ui.pick=null;update()},2500);update()},900)}};
  step()}
function setStarter(w,how){setActive(w);S.g.first=w;S.g.turn=1;ev('Startspieler '+how+': '+P(w).name,w);sfx('turn');save();toast(P(w).name+' beginnt')}
function rollAll(fromPrompt){closeModal();ui.startPrompt=false;const ids=alive();ui.roll={};let max=0;ids.forEach(id=>{const v=rnd(20)+1;ui.roll[id]=v;if(v>max)max=v});ui.rollTop=new Set(ids.filter(id=>ui.roll[id]===max));
  ev('Alle würfeln W20: '+ids.map(id=>P(id).name+' '+ui.roll[id]).join(', '));
  if(fromPrompt===true){if(ui.rollTop.size===1){pushUndo();const w=[...ui.rollTop][0];setTimeout(()=>{setStarter(w,'mit der höchsten Zahl');update()},1500)}else{setTimeout(()=>{toast('Gleichstand – nochmal würfeln');ui.startPrompt=true;update()},2200)}}
  update();save();clearTimeout(rollAll.t);rollAll.t=setTimeout(()=>{ui.roll={};ui.rollTop=new Set();update()},6000)}
function rollDie(sides){const label=sides==='coin'?'Münze':'W'+sides;const final=sides==='coin'?(rnd(2)?'Kopf':'Zahl'):rnd(sides)+1;let n=0;
  const tick=()=>{const out=document.getElementById('dieout');if(!out)return;const v=n<9?(sides==='coin'?(n%2?'Kopf':'Zahl'):rnd(sides)+1):final;out.innerHTML='<b>'+v+'</b><small>'+label+'</small>';if(n++<9)setTimeout(tick,45+n*8);else{ui.die={label,v:final};ev(label+': '+final);save()}};tick()}
function rollPlanar(){const cost=S.g.planar||0;const r=rnd(6);const res=r===0?'Planeswalk':r===1?'Chaos':'Nichts';S.g.planar=cost+1;ui.planar={res,cost};
  ev('Planarwürfel ('+cost+' Mana): '+res);save();renderModal()}

/* ---------- Scryfall: Commander-Suche ---------- */
const SF='https://api.scryfall.com';
async function sfAuto(q){try{const r=await fetch(SF+'/cards/autocomplete?q='+encodeURIComponent(q));if(!r.ok)return[];const j=await r.json();return j.data||[]}catch(e){return[]}}
const deMap={};
async function sfJSON(path){try{const r=await fetch(SF+path);if(!r.ok)return null;return await r.json()}catch(e){return null}}
async function sfSearchDe(q){const j=await sfJSON('/cards/search?q='+encodeURIComponent(q+' lang:de')+'&unique=cards');return j&&j.data?j.data:[]}
function faceOf(c){return c.image_uris?c:(c.card_faces&&c.card_faces[0])||{}}
function cardText(c,key){if(c[key])return c[key];if(c.card_faces)return c.card_faces.map(f=>f[key]||'').filter(Boolean).join('\n—\n');return''}
async function sfCard(name){
  let c=await sfJSON('/cards/named?fuzzy='+encodeURIComponent(name));
  if(!c||c.object!=='card'){const de=deMap[name.toLowerCase()];if(de)c=await sfJSON('/cards/named?exact='+encodeURIComponent(de));}
  if(!c||c.object!=='card'){const hits=await sfSearchDe(name);if(hits[0])c=await sfJSON('/cards/named?exact='+encodeURIComponent(hits[0].name));}
  if(!c||c.object!=='card')return null;
  const face=faceOf(c),iu=c.image_uris||face.image_uris||{};
  const out={name:c.name,art:iu.art_crop||null,img:iu.normal||null,cmc:typeof c.cmc==='number'?c.cmc:null,cost:c.mana_cost||face.mana_cost||'',ci:c.color_identity||[],
    type:c.type_line||'',text:cardText(c,'oracle_text'),pt:c.power!=null?c.power+'/'+c.toughness:(face.power!=null?face.power+'/'+face.toughness:''),oracle:c.oracle_id||null,full:true};
  if(out.oracle){const j=await sfJSON('/cards/search?q='+encodeURIComponent('oracleid:'+out.oracle+' lang:de')+'&unique=prints&order=released&dir=desc');
    const d=j&&j.data&&j.data[0];if(d){const df=faceOf(d),diu=d.image_uris||df.image_uris||{};
      out.nameDe=d.printed_name||(d.card_faces?d.card_faces.map(f=>f.printed_name).filter(Boolean).join(' // '):'')||null;
      out.typeDe=d.printed_type_line||df.printed_type_line||'';out.textDe=cardText(d,'printed_text');out.imgDe=diu.normal||null}}
  return out}
async function enrich(cd){if(!cd||cd.full||cd.offline||!cd.name)return cd;const c=await sfCard(cd.name);return c||cd}
function ciColor(ci){if(!ci||!ci.length)return'C';if(ci.length>1)return'M';return ci[0]}
const shortName=n=>{const s=n.split(' // ')[0];return s.length>22?s.split(',')[0]:s};
let acT=null;
async function onCmdInput(inp){const q=inp.value.trim();clearTimeout(acT);if(q.length<2)return;
  acT=setTimeout(async()=>{let list=await sfAuto(q);
    const put=()=>{const dl=document.getElementById('dl-'+inp.id);if(dl)dl.innerHTML=list.slice(0,14).map(n=>`<option value="${esc(n)}"></option>`).join('')};put();
    if(list.length<4&&q.length>=3){const de=await sfSearchDe(q);de.slice(0,10).forEach(c=>{const pn=c.printed_name||(c.card_faces&&c.card_faces[0].printed_name);if(pn){deMap[pn.toLowerCase()]=c.name;if(!list.includes(pn))list.push(pn)}})}
    const dl=document.getElementById('dl-'+inp.id);if(dl)dl.innerHTML=list.slice(0,14).map(n=>`<option value="${esc(n)}"></option>`).join('')},300)}
async function resolveCmd(i,k){const st=S.setup,p=st.players[i],name=(p.cmdr[k]||'').trim();
  if(!name){p.cdata[k]=null;setPrev(i,k);save();return}
  const prev=document.getElementById(`cprev${i}-${k}`);if(prev)prev.innerHTML='<span>Suche Karte …</span>';
  const c=await sfCard(name);
  if(c){p.cdata[k]=c;p.cmdr[k]=c.nameDe||c.name;const inp=document.getElementById(`cmd${i}-${k}`);if(inp&&document.activeElement!==inp)inp.value=p.cmdr[k];
    if(k===0&&!p.colorSet){p.color=ciColor(c.ci)}}
  else p.cdata[k]={name,art:null,cmc:null,cost:'',ci:[],offline:true};
  setPrev(i,k);save();
  if(!document.activeElement||document.activeElement.tagName!=='INPUT')renderSetup()}
function setPrev(i,k){const el=document.getElementById(`cprev${i}-${k}`);if(!el)return;const c=S.setup.players[i].cdata[k];
  el.innerHTML=!c?'':c.offline?`<span>Karte nicht gefunden oder offline – Name wird so angezeigt</span>`:`${c.art?`<img src="${c.art}" alt="">`:''}<b>${esc(c.nameDe||c.name)}</b><span>${c.nameDe&&c.nameDe!==c.name?esc(c.name)+' · ':''}${c.cmc!=null?c.cmc+' Mana':''}${c.full&&!c.nameDe?' · nur auf Englisch gedruckt':''}</span>`}

function readSetupInputs(){const st=S.setup;for(let i=0;i<st.n;i++){const a=document.getElementById('pname'+i),b=document.getElementById('ppart'+i);if(a)st.players[i].name=a.value.trim()||('Spieler '+(i+1));if(b)st.players[i].partner=b.checked}

  const co=document.getElementById('clockopt');if(co)st.clock=co.checked;
  const sx=document.getElementById('sfxopt');if(sx)st.sfx=sx.checked;
  const tu=document.getElementById('turnsopt');if(tu)st.turns=tu.checked;
  const ao=document.getElementById('artopt');if(ao)st.art=ao.checked;
  for(let i=0;i<st.n;i++)for(const k of[0,1]){const c=document.getElementById(`cmd${i}-${k}`);if(c){const v=c.value.trim();if(v!==st.players[i].cmdr[k]){st.players[i].cmdr[k]=v;if(!v)st.players[i].cdata[k]=null}}}
  const ar=document.getElementById('arch');if(ar)st.arch=+ar.value;
  const sc=document.getElementById('startcustom');if(sc&&sc.value){const v=parseInt(sc.value,10);if(v>0)st.start=Math.min(999,v)}}

  switch(b.dataset.act){
    case'n':st.n=+b.dataset.v;if(st.table==='upright'){if(st.arch>=st.n)st.arch=-1;break}if(st.table==='head2'&&st.n<4)st.table=st.n>=3?'head1':'long';if(st.table==='head1'&&st.n<3)st.table='long';if(st.arch>=st.n)st.arch=-1;break;
    case'start':st.start=+b.dataset.v;document.getElementById('startcustom').value='';break;
    case'table':st.table=b.dataset.v;break;
    case'col':st.players[+b.dataset.i].color=b.dataset.c;st.players[+b.dataset.i].colorSet=true;break;

function applyEdits(){const st=S.setup;if(st.n!==S.players.length)return;
  S.players.forEach((p,i)=>{const s=st.players[i];if(p.name!==s.name)ev(p.name+' heißt jetzt '+s.name,i);p.name=s.name;p.color=s.color;p.partner=s.partner;p.rot=s.rot;p.cmdr=s.cmdr.slice();p.cdata=s.cdata.map(cmdObj)});
  Object.assign(S.cfg,{cmdLife:st.cmdLife,sound:st.sound,sfx:st.sfx,turns:st.turns,table:st.table,clock:st.clock,art:st.art});
  S.phase='game';show();save();wake();toast('Übernommen')}
function startGame(){readSetupInputs();const st=S.setup;
  S.cfg={start:st.start,cmdLife:st.cmdLife,sound:st.sound,sfx:st.sfx,turns:st.turns,table:st.table,arch:st.arch,clock:st.clock,art:st.art};
  S.players=st.players.slice(0,st.n).map((p,i)=>{const sl=st.arch>=0?(i===st.arch?40:20):st.start;

function manaHTML(cost){if(!cost)return'';return cost.replace(/\{([^}]+)\}/g,(m,x)=>{const c=x.replace('/','');const cls=/^[WUBRGC]$/.test(c)?c:'';return`<i class="ms ${cls}">${esc(x.length>2?x.replace('/',''):x)}</i>`}).replace(/ \/\/ /g,' / ')}

function cmdrHTML(p){const out=[];[0,1].forEach(k=>{if(k===1&&!p.partner)return;const n=cmdName(p,k);if(!n)return;const tax=p[k?'tax2':'tax1']||0;const c=p.cdata[k];

function update(){if(S.phase!=='game'||!S.players.length)return;
  const bar=$('#bar');if(bar){const sl=bar.scrollLeft;bar.innerHTML=barHTML();bar.scrollLeft=sl;tickClock()}
  S.players.forEach(p=>{const el=elGame.querySelector(`.panel[data-pid="${p.id}"]`);if(!el)return;
    const dr=deadReason(p);
    el.classList.toggle('dead',!!dr);el.classList.toggle('active',S.cfg.turns&&S.g.active===p.id&&!S.g.ended);el.classList.toggle('kbsel',ui.sel===p.id);el.classList.toggle('pick',ui.pick===p.id);el.classList.toggle('shake',!!ui.shake[p.id]);

    el.querySelector('.badges').innerHTML=b.join('');
    el.querySelector('.pchips').innerHTML=chipsHTML(p);
    const dl=el.querySelector('.delta'),dv=ui.delta[p.id];dl.classList.toggle('on',!!(dv&&dv.v));if(dv)dl.textContent=(dv.v>0?'+':'−')+Math.abs(dv.v);

    const up=layout(S.players.length,S.cfg.table).upright;
    sp.innerHTML=`<button class="big" data-act="sp-pick">${up?'':'<span class="flip">Startspieler auslosen</span>'}<span>Startspieler auslosen</span></button>

const nowG=()=>S.g.paused&&S.g.pausedAt?S.g.pausedAt:Date.now();
function tickClock(){if(!S.g||S.phase!=='game')return;const c=document.getElementById('clock');const end=S.g.ended?S.g.endedAt:nowG();
  if(c)c.innerHTML=(S.g.paused?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>':'')+fmtT(end-S.g.started);
  const tt=elGame.querySelector('.panel.active .ttime');if(tt&&S.g.turnStart)tt.textContent=fmtT(nowG()-S.g.turnStart)}
function togglePause(){const g=S.g;if(g.ended)return;const now=Date.now();
  if(g.paused){const d=now-(g.pausedAt||now);g.started+=d;if(g.turnStart)g.turnStart+=d;g.paused=false;g.pausedAt=null;toast('Uhr läuft weiter')}
  else{g.paused=true;g.pausedAt=now;toast('Uhr pausiert')}update();save()}
setInterval(tickClock,1000);

/* ---------- Eingabe: Tippen = 1 Schritt, Halten = schnell ---------- */
const presses=new Map();
elGame.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.half');
  if(h&&!ui.assign){e.preventDefault();const pid=+h.dataset.pid,d=+h.dataset.dir;pushUndo('life'+pid);h.classList.add('press');
    const st={el:h,held:false,tap:()=>changeLife(pid,d)};
    st.t=setTimeout(()=>{st.held=true;changeLife(pid,d*10);st.iv=setInterval(()=>changeLife(pid,d*10),550)},450);
    presses.set(e.pointerId,st);try{h.setPointerCapture(e.pointerId)}catch(_){}return}
  const r=e.target.closest('[data-rep]');
  if(r){const act=()=>runAct(r);r.classList.add('press');const st={el:r,held:false,tap:act,n:0};
    st.t=setTimeout(()=>{st.held=true;const loop=()=>{runAct(r);st.n++;st.iv=setTimeout(loop,st.n>8?60:130)};loop()},420);
    presses.set(e.pointerId,st)}
});
function endPress(e,apply){const st=presses.get(e.pointerId);if(!st)return;clearTimeout(st.t);clearTimeout(st.iv);clearInterval(st.iv);st.el.classList.remove('press');presses.delete(e.pointerId);
  if(!st.held&&apply)st.tap()}
window.addEventListener('pointerup',e=>endPress(e,true));
window.addEventListener('pointercancel',e=>endPress(e,false));

function runAct(b){const a=b.dataset.act,pid=+b.dataset.pid,d=+b.dataset.d;
  if(a==='cmd')changeCmd(pid,+b.dataset.from,+b.dataset.k,d);
  else if(a==='ctr')changeCtr(pid,b.dataset.k,d);
  else if(a==='cust'){const c=P(pid).custom[+b.dataset.i];if(!c)return;const nv=Math.max(0,c.v+d);if(nv===c.v)return;pushUndo('cu'+pid+b.dataset.i);c.v=nv;addHist({pid,k:'ev',text:P(pid).name+': '+c.name+' → '+nv});update();save()}
  else if(a==='fxamt'){const f=fxState(pid);f.amt=Math.max(1,Math.min(999,f.amt+d));update()}}

elGame.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.hasAttribute('data-rep')||b.disabled)return;const a=b.dataset.act,pid=b.dataset.pid!=null?+b.dataset.pid:null;
  switch(a){
    case'card':{const k=+b.dataset.k;ui.cardK[pid]=k;ui.ov[pid]='card';update();const pl=P(pid),cd=pl.cdata&&pl.cdata[k];
      if(cd&&!cd.full&&!cd.offline){enrich(cd).then(n=>{if(n&&n!==cd){pl.cdata[k]=n;if(S.setup.players[pid])S.setup.players[pid].cdata[k]={...n};save();update()}})}
      else if(!cd&&pl.cmdr&&pl.cmdr[k]){sfCard(pl.cmdr[k]).then(n=>{if(n){pl.cdata[k]=n;save();update()}})}break}
    case'cardlang':ui.cardEn[pid]=!ui.cardEn[pid];update();break;
    case'ov':ui.ov[pid]=ui.ov[pid]===b.dataset.ov?null:b.dataset.ov;if(b.dataset.ov==='pad')ui.pad[pid]='';update();break;
    case'ovclose':ui.ov[pid]=null;update();break;
    case'fxset':fxState(pid).amt=+b.dataset.v;update();break;
    case'fxtgt':{const f=fxState(pid),t=+b.dataset.t;f.target=f.target===t?null:t;update();break}
    case'fxcmd':fxState(pid).cmd=!fxState(pid).cmd;update();break;
    case'fxck':fxState(pid).ck=+b.dataset.k;update();break;
    case'fxlink':fxState(pid).link=!fxState(pid).link;update();break;
    case'fx':runFx(pid,b.dataset.kind);break;
    case'padkey':{let v=ui.pad[pid]??'';const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(k==='±')v=v.startsWith('-')?v.slice(1):'-'+v;else if(v.replace('-','').length<4)v+=k;ui.pad[pid]=v;update();break}
    case'padok':{const v=parseInt(ui.pad[pid],10);ui.pad[pid]='';ui.ov[pid]=null;if(!isNaN(v)&&v!==P(pid).life){pushUndo();changeLife(pid,v-P(pid).life)}else update();break}
    case'custadd':{const inp=document.getElementById('custin'+pid);const n=inp&&inp.value.trim();if(!n){inp&&inp.focus();break}pushUndo();P(pid).custom.push({name:n,v:0});inp.blur();update();save();break}
    case'custdel':{pushUndo();P(pid).custom.splice(+b.dataset.i,1);update();save();break}
    case'pause':togglePause();break;
    case'fs':fullscreen();break;
    case'rotp':{const p=P(pid);p.rot=(rotOf(p)+90)%360;S.setup.players[pid].rot=p.rot;relayout();update();save();break}
    case'undo':doUndo();break;
    case'next':if(S.g.ended)openModal('end');else stepTurn(1);break;
    case'prev':stepTurn(-1);break;
    case'monarch':case'initiative':ui.assign=a;update();break;
    case'assign':{pushUndo();const k=ui.assign;if(k==='start'){ui.assign=null;setStarter(pid,'gewählt');update();break}S.g[k]=pid;ev((k==='monarch'?'Monarch: ':'Initiative: ')+P(pid).name,pid);ui.assign=null;update();save();break}
    case'assignnone':{pushUndo();const k=ui.assign;S.g[k]=null;ev(k==='monarch'?'Kein Monarch mehr':'Initiative entfernt');ui.assign=null;update();save();break}
    case'assigncancel':if(ui.assign==='start')ui.startPrompt=true;ui.assign=null;update();break;
    case'sp-pick':pickStart();break;
    case'sp-roll':rollAll(true);break;
    case'sp-choose':ui.startPrompt=false;ui.assign='start';update();break;
    case'sp-skip':ui.startPrompt=false;update();break;
    case'dn':pushUndo();S.g.dn=(S.g.dn+1)%3;if(S.g.dn)ev(S.g.dn===1?'Es wird Tag':'Es wird Nacht');update();save();break;
    case'menu':case'tools':case'hist':case'stats':openModal(a);break;
  }});

/* ---------- Auswertung ---------- */
function playTime(p){let t=p.time||0;if(S.g.active===p.id&&S.g.turnStart&&!S.g.ended)t+=nowG()-S.g.turnStart;return t}
function cmdDealt(p){let s=0;S.players.forEach(q=>{if(q.id!==p.id){const a=q.cmd[p.id];s+=a[0]+a[1]}});return s}
function chartSVG(){const log=S.lifeLog.slice();if(!log.length)return'';
  const end=S.g.ended?S.g.endedAt:Date.now();log.push({t:end,l:S.players.map(p=>p.life)});
  const t0=log[0].t,t1=Math.max(end,t0+60000);let lo=0,hi=0;log.forEach(e=>e.l.forEach(v=>{if(v>hi)hi=v;if(v<lo)lo=v}));hi=Math.ceil(hi/10)*10||10;
  const W=560,H=220,pl=34,pr=10,pt=10,pb=24,x=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),y=v=>pt+(hi-v)/(hi-lo||1)*(H-pt-pb);
  const ticks=[];const step=hi>40?20:10;for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)ticks.push(v);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lebensverlauf">`;
  ticks.forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#5a4a3a':'#23262d'}" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" fill="#9a968c" font-size="11" text-anchor="end">${v}</text>`});
  const mins=Math.round((t1-t0)/60000);s+=`<text x="${pl}" y="${H-6}" fill="#9a968c" font-size="11">0 min</text><text x="${W-pr}" y="${H-6}" fill="#9a968c" font-size="11" text-anchor="end">${mins} min</text>`;
  S.players.forEach((p,i)=>{let d='';let prev=null;log.forEach(e=>{const v=e.l[i];if(v==null)return;const X=x(e.t).toFixed(1),Y=y(v).toFixed(1);d+=d?` L${X},${prev} L${X},${Y}`:`M${X},${Y}`;prev=Y});
    const c=LINE[p.color]||'#ccc';s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`;
    const last=log[log.length-1];s+=`<circle cx="${x(last.t)}" cy="${y(last.l[i])}" r="3.5" fill="${c}"/>`});
  return s+'</svg>'}
function statsHTML(){const g=S.g;const end=g.ended?g.endedAt:nowG();
  const tbl=`<div class="tblwrap"><table class="t"><thead><tr><th>Spieler</th><th>Leben</th><th>Zeit am Zug</th><th>Cmd-Schaden ausgeteilt</th><th>Ausgeschieden</th></tr></thead><tbody>${S.players.map(p=>`<tr><td><span class="dot" style="--dot:${col(p).bg}"></span>${esc(p.name)}${cmdName(p,0)?` <small style="color:var(--muted)">${esc([0,1].map(k=>cmdName(p,k)).filter(Boolean).join(' + '))}</small>`:''}</td><td>${p.life}</td><td>${fmtT(playTime(p))}</td><td>${cmdDealt(p)}</td><td>${p.elim?`Zug ${p.elim.turn}${p.elim.by!=null&&P(p.elim.by)?' · durch '+esc(P(p.elim.by).name):''}`:'–'}</td></tr>`).join('')}</tbody></table></div>`;
  const mx=`<div class="tblwrap"><table class="t"><thead><tr><th>erhalten ↓ / von →</th>${S.players.map(q=>`<th><span class="dot" style="--dot:${col(q).bg}"></span>${esc(q.name.slice(0,6))}</th>`).join('')}</tr></thead><tbody>${S.players.map(p=>`<tr><td><span class="dot" style="--dot:${col(p).bg}"></span>${esc(p.name)}</td>${S.players.map(q=>{if(q.id===p.id)return'<td>–</td>';const a=p.cmd[q.id];const v=q.partner?a[0]+' / '+a[1]:a[0];return`<td class="${Math.max(a[0],a[1])>=15?'hot':''}">${v}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
  return`<div class="kpis"><div class="kpi"><small>Spieldauer</small><b>${fmtT(end-g.started)}</b></div>${S.cfg.turns?`<div class="kpi"><small>Runde</small><b>${g.turn}</b></div>`:''}<div class="kpi"><small>Noch im Spiel</small><b>${alive().length} / ${S.players.length}</b></div></div>
  <div class="grp"><h4>Lebensverlauf</h4><div class="chart">${chartSVG()}<div class="legend">${S.players.map(p=>`<span style="--dot:${LINE[p.color]}"><i></i>${esc(p.name)}</span>`).join('')}</div></div></div>
  <div class="grp"><h4>Spieler</h4>${tbl}</div>
  <div class="grp"><h4>Commander-Schaden</h4>${mx}</div>`}

function archiveHTML(){const a=loadArch();if(!a.length)return'<p class="hint">Noch keine beendeten Spiele. Sobald ein Spiel einen Gewinner hat, landet es hier.</p>';
  const tally=(keyFn)=>{const m={};a.forEach(gm=>gm.players.forEach(p=>{const k=keyFn(p);if(!k)return;const e=m[k]||(m[k]={k,games:0,wins:0,place:0});e.games++;e.place+=p.place;if(p.place===1)e.wins++}));return Object.values(m).sort((x,y)=>y.wins-x.wins||y.wins/y.games-x.wins/x.games)};
  const tbl=(rows,label)=>`<div class="tblwrap"><table class="t"><thead><tr><th>${label}</th><th>Spiele</th><th>Siege</th><th>Quote</th><th>Ø Platz</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.k)}</td><td>${r.games}</td><td>${r.wins}</td><td>${Math.round(r.wins/r.games*100)} %</td><td>${(r.place/r.games).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`;
  const avg=a.reduce((s,g)=>s+g.dur,0)/a.length;

  <div class="grp"><h4>Spieler</h4>${tbl(tally(p=>p.name),'Spieler')}</div>
  ${cm.length?`<div class="grp"><h4>Commander</h4>${tbl(cm,'Commander')}</div>`:''}
  <div class="grp"><h4>Letzte Spiele</h4><div class="arch-list">${a.slice().reverse().slice(0,30).map(g=>{const d=new Date(g.date);return`<div class="arch-item"><span><b>${esc(g.winner||'Unentschieden')}</b> gewinnt${(()=>{const w=g.players.find(p=>p.place===1);return w&&w.cmdr?' mit '+esc(w.cmdr):''})()}</span><small>${d.toLocaleDateString('de-DE')} · ${fmtT(g.dur)} · ${g.turns} Runden · ${g.players.map(p=>esc(p.name)).join(', ')}</small></div>`}).join('')}</div></div>
  <button class="mbtn${ui.archConfirm?' warn':''}" data-act="archclear">${I.reset}<span>${ui.archConfirm?'Wirklich alles löschen? Nochmal tippen':'Archiv leeren'}</span></button>`}

  }});
elModal.addEventListener('change',e=>{if(e.target.id==='m-sfx'){S.cfg.sfx=S.setup.sfx=e.target.checked;if(e.target.checked){ac();sfx('heal')}save()}if(e.target.id==='m-turns'){S.cfg.turns=S.setup.turns=e.target.checked;update();save()}if(e.target.id==='m-clock'){S.cfg.clock=S.setup.clock=e.target.checked;update();save()}if(e.target.id==='m-art'){S.cfg.art=S.setup.art=e.target.checked;update();save()}if(e.target.id==='m-cmdlife'){S.cfg.cmdLife=S.setup.cmdLife=e.target.checked;save()}if(e.target.id==='m-sound'){S.cfg.sound=S.setup.sound=e.target.checked;if(e.target.checked)ac();save()}});
document.addEventListener('keydown',e=>{
  if(S.phase==='game'&&!ui.modal&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    const k=e.key;
    if(/^[1-6]$/.test(k)&&+k<=S.players.length){ui.sel=ui.sel===+k-1?null:+k-1;update();e.preventDefault();return}
    if(ui.sel!=null&&(k==='ArrowUp'||k==='ArrowDown'||k==='+'||k==='-')){const d=(k==='ArrowUp'||k==='+'?1:-1)*(e.shiftKey?10:1);pushUndo('life'+ui.sel);changeLife(ui.sel,d);e.preventDefault();return}
    if(ui.sel!=null&&/^[cma]$/i.test(k)){const t={c:'cmd',m:'ctr',a:'fx'}[k.toLowerCase()];ui.ov[ui.sel]=ui.ov[ui.sel]===t?null:t;update();e.preventDefault();return}
    if(k==='f'||k==='F'){fullscreen();e.preventDefault();return}
    if(k===' '&&S.cfg.turns){e.preventDefault();if(!S.g.ended)stepTurn(1);return}
  }
  if(e.key==='Escape'){if(ui.sel!=null&&!ui.modal&&!Object.values(ui.ov).some(Boolean)){ui.sel=null;update();return}if(ui.modal)closeModal();else if(ui.assign){ui.assign=null;update()}else{ui.ov={};update()}}
  if((e.metaKey||e.ctrlKey)&&e.key==='z'&&S.phase==='game'&&!ui.modal){e.preventDefault();doUndo()}});

function show(){const g=S.phase==='game'&&S.players.length;elSetup.hidden=!!g;elGame.hidden=!g;document.body.classList.toggle('ingame',!!g);
  if(g)buildGame();else{if(ro)ro.disconnect();renderSetup();window.scrollTo(0,0)}}
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$|netlify|vercel/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
show();
window.__tafel={get S(){return S},ui};
})();
</script>
